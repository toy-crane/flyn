name: Flyn Internal
run_name: Flyn ${{ inputs.release_sha }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      release_sha:
        type: string
        required: true
      request_id:
        type: string
        required: true

defaults:
  image: sdk-57
  tools:
    node: "22.23.2"
    bun: "1.4.0"

jobs:
  identity:
    type: custom
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      REQUEST_ID: ${{ inputs.request_id }}
    outputs:
      release_sha: ${{ steps.receipt.outputs.release_sha }}
      request_id: ${{ steps.receipt.outputs.request_id }}
    steps:
      - id: receipt
        run: |
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s' "$REQUEST_ID" | grep -Eq '^[a-f0-9-]{36}$'
          set-output release_sha "$RELEASE_SHA"
          set-output request_id "$REQUEST_ID"

  fingerprint:
    type: fingerprint
    needs: [identity]
    environment: production
    env:
      EXPO_NO_DOTENV: "1"

  get_build:
    type: get-build
    needs: [fingerprint]
    environment: production
    params:
      platform: ios
      profile: production
      distribution: store
      channel: internal
      simulator: false
      wait_for_in_progress: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  check_existing:
    type: custom
    after: [get_build]
    if: ${{ after.get_build.outputs.build_id }}
    environment: production
    env:
      EXPO_NO_DOTENV: "1"
      FLYN_BUILD_ID: ${{ after.get_build.outputs.build_id }}
    outputs:
      action: ${{ steps.choose.outputs.action }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: cd /tmp && env -u EXPO_TOKEN npm install --global eas-cli@24.0.0
      - id: choose
        run: |
          ACTION=$(bun ../../scripts/ci/testflight-action.ts "$FLYN_BUILD_ID")
          set-output action "$ACTION"

  build_ios:
    type: build
    after: [get_build, check_existing]
    if: ${{ !after.get_build.outputs.build_id || after.check_existing.outputs.action == 'build' }}
    environment: production
    env:
      EXPO_NO_DOTENV: "1"
    params:
      platform: ios
      profile: production
      message: ${{ inputs.release_sha }} (${{ inputs.request_id }})

  submit_ios:
    name: Submit to Flyn Internal (automatic distribution)
    type: submit
    needs: [build_ios]
    environment: production
    env:
      EXPO_NO_DOTENV: "1"
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      # Flyn Internal is an App Store Connect automatic-distribution group.

  verify_new:
    type: custom
    needs: [build_ios, submit_ios]
    environment: production
    env:
      EXPO_NO_DOTENV: "1"
      FLYN_BUILD_ID: ${{ needs.build_ios.outputs.build_id }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: cd /tmp && env -u EXPO_TOKEN npm install --global eas-cli@24.0.0
      - run: bun ../../scripts/ci/verify-testflight.ts "$FLYN_BUILD_ID"

  submit_existing:
    name: Submit compatible build to Flyn Internal
    type: submit
    needs: [get_build, check_existing]
    if: ${{ needs.check_existing.outputs.action == 'submit' }}
    environment: production
    env:
      EXPO_NO_DOTENV: "1"
    params:
      build_id: ${{ needs.get_build.outputs.build_id }}
      profile: production

  verify_submitted:
    type: custom
    needs: [get_build, submit_existing]
    environment: production
    env:
      EXPO_NO_DOTENV: "1"
      FLYN_BUILD_ID: ${{ needs.get_build.outputs.build_id }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: cd /tmp && env -u EXPO_TOKEN npm install --global eas-cli@24.0.0
      - run: bun ../../scripts/ci/verify-testflight.ts "$FLYN_BUILD_ID"

  update_ios:
    type: update
    needs: [check_existing]
    if: ${{ needs.check_existing.outputs.action == 'update' }}
    environment: production
    env:
      EXPO_NO_DOTENV: "1"
    params:
      platform: ios
      channel: internal
      message: ${{ inputs.release_sha }} (${{ inputs.request_id }})

  update_submitted:
    type: update
    needs: [verify_submitted]
    environment: production
    env:
      EXPO_NO_DOTENV: "1"
    params:
      platform: ios
      channel: internal
      message: ${{ inputs.release_sha }} (${{ inputs.request_id }})

  format_notification:
    name: Classify mobile release result
    type: custom
    after: [identity, fingerprint, get_build, check_existing, build_ios, submit_ios, verify_new, submit_existing, verify_submitted, update_ios, update_submitted]
    environment: production
    env:
      FLYN_RELEASE_SHA: ${{ inputs.release_sha }}
      FLYN_WORKFLOW_URL: ${{ workflow.url }}
      FLYN_EAS_ACCOUNT: ${{ account.name }}
      FLYN_EAS_APP: ${{ app.slug }}
      FLYN_IDENTITY_STATUS: ${{ after.identity.status }}
      FLYN_FINGERPRINT_STATUS: ${{ after.fingerprint.status }}
      FLYN_GET_BUILD_STATUS: ${{ after.get_build.status }}
      FLYN_CHECK_EXISTING_STATUS: ${{ after.check_existing.status }}
      FLYN_BUILD_IOS_STATUS: ${{ after.build_ios.status }}
      FLYN_SUBMIT_IOS_STATUS: ${{ after.submit_ios.status }}
      FLYN_VERIFY_NEW_STATUS: ${{ after.verify_new.status }}
      FLYN_SUBMIT_EXISTING_STATUS: ${{ after.submit_existing.status }}
      FLYN_VERIFY_SUBMITTED_STATUS: ${{ after.verify_submitted.status }}
      FLYN_UPDATE_IOS_STATUS: ${{ after.update_ios.status }}
      FLYN_UPDATE_SUBMITTED_STATUS: ${{ after.update_submitted.status }}
      FLYN_ACTION: ${{ after.check_existing.outputs.action }}
      FLYN_NEW_BUILD_ID: ${{ after.build_ios.outputs.build_id }}
      FLYN_EXISTING_BUILD_ID: ${{ after.get_build.outputs.build_id }}
      FLYN_APP_VERSION: ${{ after.build_ios.outputs.app_version }}
      FLYN_APP_BUILD_VERSION: ${{ after.build_ios.outputs.app_build_version }}
      FLYN_EXISTING_APP_VERSION: ${{ after.get_build.outputs.app_version }}
      FLYN_EXISTING_APP_BUILD_VERSION: ${{ after.get_build.outputs.app_build_version }}
      FLYN_UPDATE_ID: ${{ after.update_ios.outputs.first_update_group_id }}
      FLYN_SUBMITTED_UPDATE_ID: ${{ after.update_submitted.outputs.first_update_group_id }}
    outputs:
      message: ${{ steps.format.outputs.message }}
    steps:
      - uses: eas/checkout
      - id: format
        run: |
          MESSAGE=$(bun ../../scripts/ci/release-notification.ts)
          set-output message "$MESSAGE"

  notify_slack:
    name: Notify Slack of mobile release result
    type: custom
    needs: [format_notification]
    environment: production
    steps:
      - uses: eas/send_slack_message
        with:
          message: ${{ needs.format_notification.outputs.message }}
