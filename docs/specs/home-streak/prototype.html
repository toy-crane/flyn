<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens: apps/mobile/global.css + heroui-native variables.css (light) ── */
  :root {
    --background: #f4f4f6;
    --foreground: #111114;
    --surface: #ffffff;
    --surface-foreground: var(--foreground);
    --surface-secondary: oklch(0.9524 0.0013 286.37);
    --muted: oklch(0.5517 0.0138 285.94);
    --accent: oklch(0.6204 0.195 253.83);
    --accent-foreground: #ffffff;
    --border: oklch(90% 0.004 286.32);
    --learn: oklch(0.54 0.19 300);
    --expression: #0f766e;
    --radius: 6px;
    --font: -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", sans-serif;
  }
  .sh-theme-dark {
    --background: #0b0b0d;
    --foreground: #ffffff;
    --surface: #1a1a1e;
    --surface-secondary: oklch(0.257 0.0037 286.14);
    --muted: oklch(70.5% 0.015 286.067);
    --accent: oklch(0.6204 0.195 253.83);
    --accent-foreground: #ffffff;
    --border: oklch(28% 0.006 286.033);
    --learn: oklch(0.78 0.15 300);
    --expression: #76d6c9;
  }

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }

  /* ── product ── */
  .screen { display: flex; flex-direction: column; gap: 16px; padding: 4px 8px 24px; }
  .home-head { display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 0 4px; }
  .home-title { font-size: 34px; font-weight: 700; letter-spacing: -0.4px; line-height: 41px; margin: 0; }
  .avatar { width: 32px; height: 32px; border-radius: 999px; background: color-mix(in oklch, var(--accent) 35%, var(--surface-secondary)); margin-bottom: 6px; }

  .nav-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 0 2px; }
  .nav-back { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; text-decoration: none; }
  .nav-back .chev { font-size: 26px; line-height: 1; margin-top: -3px; }
  .nav-title { font-size: 17px; font-weight: 600; text-align: center; }

  .streak { display: flex; align-items: baseline; gap: 10px; padding: 2px 4px 0; }
  .streak-value { font-size: 28px; font-weight: 700; letter-spacing: -0.3px; line-height: 34px; }
  .streak-rule { font-size: 13px; color: var(--muted); }

  .callout { position: absolute; z-index: 5; background: var(--foreground); color: var(--background); border-radius: 10px; padding: 7px 10px; font-size: 13px; line-height: 18px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.18); transform: translate(-50%, 8px); }
  .callout::after { content: ""; position: absolute; left: 50%; top: -5px; width: 10px; height: 10px; background: var(--foreground); transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
  .cell.selected { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--foreground); }
  .cell.today.selected { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--foreground); }

  .card { background: var(--surface); border-radius: 18px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-size: 17px; font-weight: 600; line-height: 22px; margin: 0; }
  .card-sub { font-size: 13px; color: var(--muted); line-height: 18px; display: inline-flex; align-items: center; gap: 2px; text-decoration: none; }
  .card-sub .chev { font-size: 18px; line-height: 1; }

  .cell { position: relative; border-radius: 10px; background: var(--surface-secondary); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--foreground); border: 0; padding: 0; margin: 0; font-family: inherit; width: 100%; }
  .cell:disabled { color: var(--foreground); opacity: 1; cursor: default; }
  button.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cell.l1 { background: oklch(from var(--accent) 0.90 0.07 h); }
  .cell.l2 { background: oklch(from var(--accent) 0.82 0.12 h); }
  .cell.l3 { background: oklch(from var(--accent) 0.72 0.17 h); }
  .cell.l4 { background: var(--accent); }
  .sh-theme-dark .cell.l1 { background: oklch(from var(--accent) 0.36 0.09 h); }
  .sh-theme-dark .cell.l2 { background: oklch(from var(--accent) 0.45 0.13 h); }
  .sh-theme-dark .cell.l3 { background: oklch(from var(--accent) 0.54 0.17 h); }
  .cell.future { background: transparent; box-shadow: inset 0 0 0 1px var(--border); font-weight: 400; }
  .cell.blank { background: transparent; }
  .cell:not(.future):not(.blank) { cursor: pointer; }
  .cell.blank { visibility: hidden; }
  .cell.today { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent); }
  .cell.today.future { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent); }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 6px; position: relative; }
  .week .dow { font-size: 12px; color: var(--muted); text-align: center; line-height: 16px; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; }
  .cal-title { font-size: 17px; font-weight: 600; }
  .cal-nav { display: flex; gap: 4px; }
  .cal-nav button { width: 32px; height: 32px; border: 0; border-radius: 999px; background: var(--surface-secondary); color: var(--foreground); font-size: 16px; cursor: pointer; }
  .cal-nav button:disabled { opacity: .35; cursor: default; }
  .cal-foot { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 2px; }
  .cal-foot-label { font-size: 15px; color: var(--muted); }
  .cal-foot-value { font-size: 17px; font-weight: 600; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 4px; position: relative; }
  .cal .dow { font-size: 12px; color: var(--muted); text-align: center; line-height: 18px; }

  .empty-note { font-size: 15px; color: var(--muted); line-height: 22px; text-align: center; padding: 6px 0 2px; }
</style>

<header class="sh-bar">
  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
  <div class="sh-theme" id="sh-theme" role="group" aria-label="theme (t)" hidden>
    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>
</header>

<main class="sh-stage">
  <section data-screen="home" data-title="홈" data-states="첫 사용">
    <div class="screen">
      <div class="home-head"><h1 class="home-title">홈</h1><div class="avatar"></div></div>
      <div class="streak" data-component="new:StreakLine"><span class="streak-value"><span data-role="streak-now">12</span>일 연속</span></div>
      <div class="card" data-component="new:WeekStrip">
        <div class="card-head"><h2 class="card-title" id="home-week-title"></h2><a class="card-sub" href="#record">연속 기록 <span class="chev">›</span></a></div>
        <div class="week" id="home-week"></div>
      </div>
    </div>
  </section>

  <section data-screen="record" data-title="연속 기록" data-states="첫 사용">
    <div class="screen">
      <div class="nav-head"><a class="nav-back" href="#home" aria-label="뒤로 가기"><span class="chev">‹</span></a><span class="nav-title">연속 기록</span><span></span></div>
      <div class="streak" data-component="new:StreakLine"><span class="streak-value"><span data-role="streak-now">12</span>일 연속</span></div>
      <div class="card" data-component="new:MonthCalendar">
        <div class="cal-head">
          <div class="cal-title" id="cal-title"></div>
          <div class="cal-nav"><button id="cal-prev" aria-label="이전 달">‹</button><button id="cal-next" aria-label="다음 달">›</button></div>
        </div>
        <div class="cal" id="cal-grid"></div>
        <div class="cal-foot"><span class="cal-foot-label">영어로 말한 횟수</span><span class="cal-foot-value" id="cal-sum"></span></div>
      </div>
    </div>
  </section>
</main>

<script>
  // 더미 데이터: 2026-03-01(일)부터 오늘 2026-09-13(일)까지. 색은 그날 영어로 말한 횟수(에피소드에서 보낸 영어 메시지 수), done은 화를 끝낸 날.
  const TODAY = new Date(2026, 8, 13);
  const START = new Date(2026, 2, 1);
  const DOW = ['월', '화', '수', '목', '금', '토', '일'];
  let seed = 20260913;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function key(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function sameDay(a, b) { return key(a) === key(b); }

  const fullData = {};
  for (let d = new Date(START); d <= TODAY; d = addDays(d, 1)) {
    const dow = d.getDay();
    const active = rnd() < (dow === 0 || dow === 6 ? 0.45 : 0.62);
    const words = active ? Math.round(1 + rnd() * rnd() * 20) : 0;
    const done = active && rnd() < 0.55;
    fullData[key(d)] = { words, done };
  }
  for (let i = 0; i < 12; i++) { const k = key(addDays(TODAY, -i)); fullData[k].done = true; if (fullData[k].words === 0) fullData[k].words = 3 + Math.round(rnd() * 10); }
  fullData[key(addDays(TODAY, -12))].done = false;
  for (let i = 1; i <= 24; i++) { const k = key(new Date(2026, 5, i)); fullData[k].done = true; if (fullData[k].words === 0) fullData[k].words = 4 + Math.round(rnd() * 12); }
  fullData[key(new Date(2026, 4, 31))].done = false; fullData[key(new Date(2026, 5, 25))].done = false;

  // 첫 사용: 오늘 계정을 만들었고 아직 아무 화도 끝내지 않았다.
  let days = fullData;
  let streakNow = 12, streakBest = 24, firstMonth = new Date(2026, 2, 1);

  function level(words) { return words === 0 ? 0 : words <= 3 ? 1 : words <= 7 ? 2 : words <= 12 ? 3 : 4; }
  // 날짜 칸은 모두 버튼이라 화면 읽기와 키보드로도 고를 수 있고, 접근성 이름에 날짜와 횟수, 오늘 여부를 함께 담는다.
  // 아직 오지 않은 날은 잠긴 버튼이라 이름과 상태는 읽히고 누를 수는 없다.
  function cellFor(d, opts) {
    const past = d <= TODAY;
    const el = document.createElement('button');
    el.className = 'cell';
    el.type = 'button';
    const info = days[key(d)] || { words: 0, done: false };
    const dateLabel = (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
    const parts = [dateLabel];
    if (!past) { el.classList.add('future'); parts.push('아직 오지 않은 날'); el.disabled = true; }
    else {
      if (info.words) el.classList.add('l' + level(info.words));
      if (info.done) el.classList.add('done');
      parts.push(info.words === 0 ? '기록 없음' : '영어로 ' + info.words + '번 말했어요');
    }
    if (sameDay(d, TODAY)) { el.classList.add('today'); parts.push('오늘'); }
    el.setAttribute('aria-label', parts.join(', '));
    if (!opts || opts.number !== false) el.textContent = d.getDate();
    if (past) el.addEventListener('click', e => { e.stopPropagation(); toggleCallout(el, d); });
    return el;
  }

  // 특정 날을 누르면 그 아래에 툴팁으로 그날 영어로 말한 횟수를 보여 준다.
  let openCallout = null;
  function closeCallout() {
    if (!openCallout) return;
    openCallout.cell.classList.remove('selected');
    openCallout.el.remove();
    openCallout = null;
  }
  function toggleCallout(cell, d) {
    if (openCallout && openCallout.cell === cell) { closeCallout(); return; }
    closeCallout();
    const info = days[key(d)] || { words: 0, done: false };
    const grid = cell.parentElement;
    const el = document.createElement('div');
    el.className = 'callout';
    el.textContent = info.words === 0 ? '기록 없음' : '영어로 ' + info.words + '번 말했어요';
    grid.appendChild(el);
    const gridBox = grid.getBoundingClientRect();
    const cellBox = cell.getBoundingClientRect();
    let x = cellBox.left - gridBox.left + cellBox.width / 2;
    const half = el.offsetWidth / 2;
    x = Math.max(half, Math.min(gridBox.width - half, x));
    el.style.left = x + 'px';
    el.style.top = (cellBox.bottom - gridBox.top) + 'px';
    cell.classList.add('selected');
    openCallout = { cell, el };
  }
  addEventListener('click', closeCallout);
  addEventListener('hashchange', closeCallout);

  function renderTiles() {
    document.querySelectorAll('[data-role="streak-now"]').forEach(el => el.textContent = streakNow);
  }

  // 홈: 이번 주 한 줄. 월요일부터 시작한다.
  function renderWeek() {
    const grid = document.getElementById('home-week');
    grid.replaceChildren();
    DOW.forEach(t => { const h = document.createElement('div'); h.className = 'dow'; h.textContent = t; grid.appendChild(h); });
    const weekStart = addDays(TODAY, -((TODAY.getDay() + 6) % 7));
    // 주차는 그 주의 목요일이 속한 달로 센다. 달력 앱이 쓰는 규칙이다.
    const thursday = addDays(weekStart, 3);
    const firstThursday = new Date(thursday.getFullYear(), thursday.getMonth(), 1);
    firstThursday.setDate(1 + ((4 - firstThursday.getDay() + 7) % 7));
    const weekOfMonth = Math.floor((thursday.getDate() - firstThursday.getDate()) / 7) + 1;
    document.getElementById('home-week-title').textContent = (thursday.getMonth() + 1) + '월 ' + weekOfMonth + '주차';
    for (let i = 0; i < 7; i++) grid.appendChild(cellFor(addDays(weekStart, i)));
  }

  // 연속 기록: 월 달력. 이전·다음 달로 이동한다.
  let calYear = 2026, calMonth = 8;
  const calGrid = document.getElementById('cal-grid');
  const calTitle = document.getElementById('cal-title');
  const calSum = document.getElementById('cal-sum');
  const calPrev = document.getElementById('cal-prev');
  const calNext = document.getElementById('cal-next');
  function renderCal() {
    calTitle.textContent = calYear + '년 ' + (calMonth + 1) + '월';
    calGrid.replaceChildren();
    DOW.forEach(t => { const h = document.createElement('div'); h.className = 'dow'; h.textContent = t; calGrid.appendChild(h); });
    const first = new Date(calYear, calMonth, 1);
    for (let i = 0; i < (first.getDay() + 6) % 7; i++) { const b = document.createElement('div'); b.className = 'cell blank'; calGrid.appendChild(b); }
    const n = new Date(calYear, calMonth + 1, 0).getDate();
    let doneCount = 0, wordSum = 0;
    for (let i = 1; i <= n; i++) {
      const d = new Date(calYear, calMonth, i);
      const info = days[key(d)];
      if (info) { doneCount += info.done ? 1 : 0; wordSum += info.words; }
      calGrid.appendChild(cellFor(d));
    }
    calSum.textContent = wordSum.toLocaleString('ko-KR') + '번';
    calPrev.disabled = calYear === firstMonth.getFullYear() && calMonth === firstMonth.getMonth();
    calNext.disabled = calYear === TODAY.getFullYear() && calMonth === TODAY.getMonth();
  }
  calPrev.onclick = () => { closeCallout(); calMonth -= 1; if (calMonth < 0) { calMonth = 11; calYear -= 1; } renderCal(); };
  calNext.onclick = () => { closeCallout(); calMonth += 1; if (calMonth > 11) { calMonth = 0; calYear += 1; } renderCal(); };

  function renderAll() { closeCallout(); renderTiles(); renderWeek(); calYear = 2026; calMonth = 8; renderCal(); }
  renderAll();

  // 상태 프리셋 "첫 사용"을 고르면 데이터를 비운다.
  const stateSelectEl = document.getElementById('sh-state');
  function syncState() {
    const empty = stateSelectEl.value === '첫 사용';
    days = empty ? {} : fullData;
    streakNow = empty ? 0 : 12; streakBest = empty ? 0 : 24;
    firstMonth = empty ? new Date(2026, 8, 1) : new Date(2026, 2, 1);
    renderAll();
  }
  stateSelectEl.addEventListener('change', syncState);
  // 화면을 바꾸면 셸이 상태를 Default로 되돌리므로 데이터도 같이 되돌린다.
  // 해시 이동, 화면 선택기, 좌우 화살표 세 경로가 모두 화면을 바꾼다.
  addEventListener('hashchange', () => setTimeout(syncState, 0));
  document.getElementById('sh-screen').addEventListener('change', () => setTimeout(syncState, 0));
  addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') setTimeout(syncState, 0); });
</script>

<script>
  document.body.classList.add('sh-vp-390');
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
