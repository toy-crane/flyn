<script>
const paths={ask:'M12 3l2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5Z M20 3v4 M18 5h4',copy:'M8 8h12v13H8z M15 8V3H3v13h5',trash:'M3 6h18 M9 6V3h6v3 M6 6l1 15h10l1-15 M10 10v7 M14 10v7',right:'M9 5l7 7-7 7',down:'M5 9l7 7 7-7',back:'M15 5l-7 7 7 7',close:'M6 6l12 12 M18 6L6 18',send:'M12 19V5 M5 12l7-7 7 7',bookmark:'M6 3h12v18l-6-4-6 4Z',home:'M3 11l9-8 9 8 M5 10v11h5v-6h4v6h5V10',search:'M10 3a7 7 0 1 0 0 14a7 7 0 1 0 0-14 M15 15l6 6',story:'M5 3h14v18H5z M9 7h6 M9 11h6'};
function icon(n){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[n]+'"/></svg>'}
const samples=[{source:'잘못 나온 커피 · 1화',en:"Could I get this without ice?",marked:'Could I get this <span class="mark">without ice</span>?',meaning:'이거 얼음 없이 받을 수 있을까요?',original:'Could I get this <u>without ices</u>?',why:'음료에 들어가는 얼음은 셀 수 없는 명사여서 ice로 써요.',answer:'여기서 <b>ice</b>는 얼음의 양을 말해요. 셀 수 없는 명사라서 <b>ices</b>로 쓰지 않아요.<br><br>얼음을 하나씩 세고 싶다면 <b>ice cubes</b>라고 해요.<br><br>“Could I get this without ice?”라고 하면 자연스럽게 얼음을 빼 달라고 부탁할 수 있어요.'},{source:'잘못 나온 커피 · 1화',en:"Let me make that right for you.",marked:'Let me make that right for you.',meaning:'제가 제대로 다시 해 드릴게요.',answer:'<b>make that right</b>는 잘못된 상황을 바로잡겠다는 뜻이에요.<br><br>이 장면에서는 직원이 잘못 나온 주문을 다시 준비해 주겠다는 말이에요.'},{source:'갑자기 바뀐 여행 계획 · 3화',en:"Is there any chance we could check in a little earlier?",marked:'<span class="mark">Is there any chance</span> we could check in a little earlier?',meaning:'조금 일찍 체크인할 수 있을까요?',original:'조금 일찍 체크인할 수 있을까요?',why:'Is there any chance로 시작하면 가능한지 조심스럽게 물을 수 있어요.',answer:'<b>Is there any chance…?</b>는 상대에게 가능성을 조심스럽게 묻는 표현이에요.<br><br>바로 요구하기보다 가능한지 확인하는 느낌이라 이 상황에 잘 어울려요.'}];
const stores={};
function card(d,i,v,missing=false){return `<article class="card ${i===2?'green':''}" data-component="ExpressionCard" data-index="${i}"><div class="cardhead">${v==='a'&&!missing?`<button class="source link" data-action="goto" aria-label="${d.source} 대화에서 보기">${d.source} ${icon('right')}</button>`:`<span class="source">${d.source}</span>`}${d.original?`<button class="expand" data-action="expand" aria-label="설명 펼치기" aria-expanded="false">${icon('down')}</button>`:''}</div><p class="english">${d.marked}</p><p class="meaning">${d.meaning}</p>${d.original?`<div class="detail" hidden><label>내가 쓴 문장</label><p>${d.original}</p><label>이렇게 쓰는 이유</label><p style="color:var(--muted)">${d.why}</p></div>`:''}<div class="actions" data-component="IconRow"><button class="ask" data-action="ask">${icon('ask')}AI에게 물어보기</button><span class="spacer"></span>${v==='a'?`<button class="iconbtn" data-action="copy" aria-label="표현 복사">${icon('copy')}</button><button class="iconbtn" data-action="erase" aria-label="삭제">${icon('trash')}</button>`:''}</div>${v!=='a'?`<div class="lower">${!missing?`<button class="goto" data-action="goto">대화에서 보기 ${icon('right')}</button>`:'<span class="source">원래 대화가 삭제됐어요</span>'}<span class="spacer"></span><button class="iconbtn" data-action="copy" aria-label="표현 복사">${icon('copy')}</button><button class="iconbtn" data-action="erase" aria-label="삭제">${icon('trash')}</button></div>`:missing?'<p class="source">원래 대화가 삭제됐어요</p>':''}</article>`}
for(const app of document.querySelectorAll('[data-app]')){
const v=app.dataset.app; stores[v]={threads:{},index:0};
app.innerHTML=`<div class="status"><span>9:41</span><span>▰ ▰ ▰</span></div><section class="page notes"><header class="top"><h1>표현 노트</h1></header><div class="list"><div data-when="Default">${samples.map((d,i)=>card(d,i,v)).join('')}</div><div data-when="원본 없는 표현" hidden>${card(samples[0],0,v,true)}</div></div><nav class="tabs" data-component="NativeTabs">${[['home','홈'],['search','탐색'],['story','스토리'],['bookmark','노트']].map(([ic,t])=>`<span class="tab ${t==='노트'?'active':''}">${icon(ic)}${t}</span>`).join('')}</nav></section><section class="page episode" hidden><header class="top"><button class="iconbtn" data-action="back" aria-label="표현 노트로 돌아가기">${icon('back')}</button><h2></h2><span style="width:36px"></span></header><div class="episodebody"></div><div class="readOnly">끝난 대화예요</div></section><section class="overlay" hidden data-component="pageSheet"><div class="grab"></div><header class="top"><h2>AI에게 물어보기</h2><button class="iconbtn" data-action="close" aria-label="AI에게 물어보기 닫기">${icon('close')}</button></header><div class="chat"></div><form class="composer"><input aria-label="질문" placeholder="궁금한 점을 물어보세요"><button class="send" aria-label="보내기">${icon('send')}</button></form></section><div class="toast" role="status" hidden></div><div class="dialog" hidden><div class="dialogbox"><strong>표현을 삭제할까요?</strong><footer><button data-action="cancel">취소</button><button class="danger" data-action="confirm">삭제</button></footer></div></div>`;
function toast(t){let el=app.querySelector('.toast');el.textContent=t;el.hidden=false;clearTimeout(stores[v].timer);stores[v].timer=setTimeout(()=>el.hidden=true,1800)}
function thread(){let k=stores[v].index;return stores[v].threads[k] ||= {messages:[],draft:''}}
function renderAsk(){const d=samples[stores[v].index],t=thread(),chat=app.querySelector('.chat');chat.innerHTML=`<div class="context" data-component="ExpressionCard"><label>${d.source}</label><p><b>${d.en}</b></p><p style="color:var(--muted)">${d.meaning}</p></div>${t.messages.length?'':`<p class="hint">이 표현에서 어떤 점이 궁금하세요?</p><div class="chips"><button data-question="이 표현은 언제 써요?">언제 쓰는 표현이에요?</button><button data-question="비슷한 표현도 알려 줘">비슷한 표현도 알려 줘</button></div>`}`;for(const q of t.messages){const mine=document.createElement('div');mine.className='mine';mine.textContent=q;chat.append(mine);const answer=document.createElement('div');answer.className='answer';answer.innerHTML=q.includes('비슷')?'비슷한 부탁에는 <b>Could you…?</b>도 쓸 수 있어요.<br><br>“Could you leave out the ice?”는 얼음을 빼 달라고 직접 부탁하는 말이에요.':d.answer;chat.append(answer)}app.querySelector('input').value=t.draft;chat.scrollTop=chat.scrollHeight}
function send(q){if(!q.trim())return;thread().messages.push(q.trim());thread().draft='';renderAsk()}
app.querySelector('form').onsubmit=e=>{e.preventDefault();send(app.querySelector('input').value)};app.querySelector('input').oninput=e=>thread().draft=e.target.value;
app.onclick=e=>{const chip=e.target.closest('button[data-question]');if(chip){send(chip.dataset.question);return}const btn=e.target.closest('[data-action]');if(!btn)return;const c=btn.closest('.card');if(c)stores[v].index=Number(c.dataset.index);const d=samples[stores[v].index];switch(btn.dataset.action){case 'expand':{const detail=c.querySelector('.detail');detail.hidden=!detail.hidden;btn.setAttribute('aria-expanded',String(!detail.hidden));btn.style.transform=detail.hidden?'':'rotate(180deg)';break}case 'ask':app.querySelector('.overlay').hidden=false;renderAsk();break;case 'close':app.querySelector('.overlay').hidden=true;break;case 'goto':app.querySelector('.notes').hidden=true;app.querySelector('.episode').hidden=false;app.querySelector('.episode h2').textContent=d.source;app.querySelector('.episodebody').innerHTML=`<p class="date">9월 12일 · 오후 3:42</p><p class="scene">주문한 커피가 나왔지만, 컵에는 얼음이 가득해요. 직원이 다음 손님을 부르기 전에 말을 걸어요.</p><p class="speaker">Jamie</p><div class="bubble">Here's your iced latte. Anything else?</div><div class="mine">${stores[v].index===0?'Could I get this without ices?':'I asked for a hot latte.'}</div><div class="found">${icon('bookmark')}저장한 표현</div><div class="bubble selected">${d.marked}<p class="meaning">${d.meaning}</p></div><p class="speaker">Jamie</p><div class="bubble">Of course. I'll get that sorted for you.</div>`;if(stores[v].index===2){app.querySelector('.scene').textContent='호텔에 일찍 도착했어요. 프런트 직원에게 체크인 시간을 물어봐요.';app.querySelectorAll('.episode .bubble')[0].textContent='Check-in starts at three. Can I help you with anything else?';app.querySelector('.episode .mine').textContent='조금 일찍 체크인할 수 있을까요?'}break;case 'back':app.querySelector('.episode').hidden=true;app.querySelector('.notes').hidden=false;break;case 'copy':navigator.clipboard?.writeText(d.en).then(()=>toast('표현을 복사했어요')).catch(()=>toast('복사할 표현: '+d.en));break;case 'erase':stores[v].erase=c;app.querySelector('.dialog').hidden=false;break;case 'cancel':app.querySelector('.dialog').hidden=true;break;case 'confirm':stores[v].erase.remove();app.querySelector('.dialog').hidden=true;toast('표현을 삭제했어요');break}};

<script>
  const stage = document.querySelector('.sh-workspace');
  const stateSelect = document.getElementById('sh-state');
  const variantSelect = document.getElementById('sh-variant');
  const variantControl = document.getElementById('sh-variant-control');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  function fail(message) {
    const notice = document.createElement('p');
    notice.setAttribute('role', 'alert');
    notice.textContent = message;
    stage.replaceChildren(notice);
    document.querySelectorAll('.sh-bar select, .sh-bar button').forEach(control => control.disabled = true);
    throw new Error(message);
  }

  const question = (stage.dataset.question || '').trim();
  if (!question) fail('Name the user situation in data-question.');
  document.getElementById('sh-question').textContent = question;

  const rows = [...stage.querySelectorAll(':scope > .sh-options')];
  if (rows.length !== 1) fail('Use one alternatives row for the current decision.');
  const currentVariants = [...rows[0].children].filter(node => node.matches('[data-variant]'));
  const ids = currentVariants.map(variant => variant.dataset.variant.trim());
  if (currentVariants.length < 1 || currentVariants.length > 3 || new Set(ids).size !== ids.length || ids.includes('')) {
    fail('The decision needs 1–3 alternatives with unique, nonempty data-variant values.');
  }
  currentVariants.forEach((variant, index) => { variant.dataset.variant = ids[index]; });

  function buildVariants() {
    variantControl.hidden = currentVariants.length === 1;
    variantSelect.replaceChildren();
    currentVariants.forEach(variant => variantSelect.add(new Option(
      variant.dataset.title || variant.dataset.variant, variant.dataset.variant)));
    applyVariant(currentVariants[0].dataset.variant);
  }

  function applyVariant(id) {
    const active = currentVariants.some(variant => variant.dataset.variant === id)
      ? id : currentVariants[0].dataset.variant;
    const leaving = currentVariants.find(variant => !variant.hidden);
    const leavingFrame = leaving && leaving.querySelector('.sh-stage');
    const frameOffset = leavingFrame ? leavingFrame.scrollTop : 0;
    const pageOffset = scrollY;
    currentVariants.forEach(variant => { variant.hidden = variant.dataset.variant !== active; });
    variantSelect.value = active;
    const entering = currentVariants.find(variant => variant.dataset.variant === active);
    const enteringFrame = entering.querySelector('.sh-stage');
    if (enteringFrame) enteringFrame.scrollTop = frameOffset;
    scrollTo(scrollX, pageOffset);
  }
  variantSelect.onchange = () => applyVariant(variantSelect.value);

  const declared = (stage.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
  const currentStates = [...new Set(['Default', ...declared])];
  function buildStates() {
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    stage.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.comparisonShell = {
    setState: applyState,
    getQuestion: () => question,
    getState: () => stateSelect.value,
    setVariant: applyVariant,
    getVariant: () => variantSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  buildStates();
  buildVariants();
</script>
