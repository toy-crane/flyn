<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend freely, never strip):
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The tab bar, arrow keys, and #hash routing build themselves;
               in-prototype links may target screens (href="#slug").
  - States:   a screen with meaningful states declares data-states="a,b,c"
               (free strings; first one is the default). Elements that belong
               to one state carry data-when="a" (comma-separated for several).
               Elements without data-when always show.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block below with the project's own
               design tokens, copied verbatim. Keep --background, --foreground,
               and --font defined afterwards; when the system's names differ,
               add a small mapping block after the copy, and a web font
               substitutes a system stack (note that in the spec). A
               project with no design system
               keeps the block as it ships: that minimal palette is the
               finished look, not a stage waiting to be swapped out.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. .wf-line (text bar) is here for the same reason but
               rarely earns its use — real text belongs where it would go.

  Self-contained by design: no build, no framework, no network.
  Chrome that needs explaining has failed; keep it three controls.
  -->
    <title>flyn input form style prototype</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <style>
    /* Current project roles, represented with iOS semantic-color fallbacks. */
    :root {
      --background: #ffffff;
      --grouped-background: #f2f2f7;
      --surface: #ffffff;
      --foreground: #000000;
      --secondary: rgba(60, 60, 67, 0.6);
      --tertiary: rgba(60, 60, 67, 0.3);
      --placeholder: rgba(60, 60, 67, 0.3);
      --separator: rgba(60, 60, 67, 0.22);
      --opaque-separator: #c6c6c8;
      --tertiary-system-fill: rgba(118, 118, 128, 0.12);
      --disabled: #e5e5ea;
      --accent: #007aff;
      --danger: #d70015;
      --success: #1f7a35;
      --glass: rgba(248, 248, 248, 0.72);
      --field-fill: var(--tertiary-system-fill);
      --field-height: 52px;
      --field-padding-x: 18px;
      --radius: 16px;
      --font:
        -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }

    body[data-appearance="dark"] {
      --background: #000000;
      --grouped-background: #1c1c1e;
      --surface: #1c1c1e;
      --foreground: #ffffff;
      --secondary: rgba(235, 235, 245, 0.6);
      --tertiary: rgba(235, 235, 245, 0.3);
      --placeholder: rgba(235, 235, 245, 0.3);
      --separator: rgba(84, 84, 88, 0.65);
      --opaque-separator: #38383a;
      --tertiary-system-fill: rgba(118, 118, 128, 0.24);
      --disabled: #2c2c2e;
      --accent: #0a84ff;
      --danger: #ff453a;
      --success: #32d74b;
      --glass: rgba(44, 44, 46, 0.72);
    }

    * {
      box-sizing: border-box;
    }
    html,
    body {
      min-height: 100%;
    }
    body {
      padding: 0 0 40px;
      margin: 0;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      color: var(--foreground);
      background: #e8e8ed;
    }
    body[data-appearance="dark"] {
      background: #111113;
    }
    button,
    input {
      font: inherit;
    }

    /* Review chrome retained from the prototype shell. */
    .sh-bar {
      position: sticky;
      top: 0;
      z-index: 999;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      min-height: 44px;
      padding: 8px 12px;
      font:
        12px / 1.5 ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;
      color: #d7d7d7;
      background: #191a1c;
    }
    .sh-bar b {
      font-weight: 500;
      color: #8a8f98;
    }
    .sh-bar nav {
      display: flex;
      gap: 6px;
    }
    .sh-bar button {
      padding: 2px 9px;
      color: inherit;
      cursor: pointer;
      background: none;
      border: 1px solid #3a3d42;
      border-radius: 999px;
    }
    .sh-bar button.on {
      color: #191a1c;
      background: #d7d7d7;
      border-color: #d7d7d7;
    }
    #sh-states:not([hidden])::before,
    #sh-variants::before {
      margin-right: 4px;
      color: #8a8f98;
    }
    #sh-states:not([hidden])::before {
      content: "state";
    }
    #sh-variants::before {
      content: "field";
    }
    #sh-states,
    #sh-variants {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      min-inline-size: 0;
      padding: 0;
      margin: 0;
      border: 0;
    }
    .sh-spacer {
      flex: 1;
    }
    .sh-stage {
      max-width: 960px;
      padding: 12px 16px 0;
      margin: 0 auto;
    }
    [hidden] {
      display: none !important;
    }

    .sh-vp-390 .sh-stage {
      max-width: 390px;
      height: min(844px, calc(100dvh - 68px));
      padding: 0;
      margin-top: 12px;
      overflow: hidden;
      background: var(--background);
      border: 10px solid #191a1c;
      border-radius: 42px;
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.24);
    }
    .sh-vp-768 .sh-stage {
      max-width: 768px;
      padding: 16px;
      margin-top: 12px;
      background: var(--background);
      border: 1px solid #c4c4c4;
      border-radius: 12px;
    }

    section[data-screen] {
      position: relative;
      min-height: 824px;
      overflow: hidden;
      color: var(--foreground);
      background: var(--background);
    }
    .sh-vp-390 section[data-screen] {
      height: 100%;
      min-height: 0;
      overflow-y: auto;
    }

    /* iOS-like shared screen chrome. */
    .status-bar {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      height: 54px;
      padding: 6px 20px 0;
      font-size: 15px;
      font-weight: 600;
    }
    .dynamic-island {
      width: 112px;
      height: 34px;
      background: #000;
      border-radius: 999px;
    }
    body[data-appearance="dark"] .dynamic-island {
      outline: 1px solid #171719;
    }
    .signals {
      justify-self: end;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .navigation-bar {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      height: 54px;
      padding: 0 16px;
      background: var(--background);
      border-bottom: 1px solid
        color-mix(in srgb, var(--separator), transparent 45%);
    }
    .navigation-title {
      font-size: 17px;
      font-weight: 600;
      text-align: center;
    }
    .back-button,
    .sheet-action {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      color: var(--foreground);
      background: var(--glass);
      border: 0;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(18px);
    }
    .back-button {
      font-size: 34px;
      font-weight: 200;
      line-height: 1;
    }
    .sheet-action {
      font-size: 23px;
      font-weight: 400;
    }
    .sheet-action[disabled] {
      color: var(--tertiary);
    }

    .form-layout {
      display: flex;
      flex-direction: column;
      min-height: calc(100% - 108px);
      padding: 24px 20px 12px;
    }
    .form-main {
      flex: 1;
    }
    .intro {
      margin: 0 0 16px;
      font-size: 15px;
      line-height: 21px;
      color: var(--secondary);
    }
    .field-unit {
      display: grid;
      gap: 8px;
    }
    .field-label {
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
      color: var(--secondary);
    }
    .field-shell {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: var(--field-height);
      padding: 0 var(--field-padding-x);
      overflow: hidden;
      background: var(--field-fill);
      border: 1px solid transparent;
      border-radius: 999px;
    }
    .field-shell input {
      width: 100%;
      min-width: 0;
      height: 48px;
      padding: 0;
      font-size: 17px;
      line-height: 24px;
      color: var(--foreground);
      caret-color: var(--accent);
      outline: none;
      background: transparent;
      border: 0;
    }
    .field-shell input::placeholder {
      color: var(--placeholder);
      opacity: 1;
    }
    .field-shell.is-error {
      border-color: var(--danger);
    }
    .field-icon {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 22px;
      height: 22px;
      margin-left: 8px;
      font-size: 14px;
      font-weight: 700;
      color: white;
      border-radius: 999px;
    }
    .field-icon.success {
      background: var(--success);
    }
    .field-icon.danger {
      background: var(--danger);
    }
    .field-footer {
      margin: 0;
      font-size: 13px;
      line-height: 18px;
      color: var(--secondary);
    }
    .field-footer.danger {
      color: var(--danger);
    }

    body[data-variant="B"] .field-shell {
      border-radius: 16px;
    }
    body[data-variant="C"] .field-shell {
      min-height: 42px;
      padding-inline: 12px;
      background: var(--background);
      border-color: var(--opaque-separator);
      border-radius: 7px;
    }
    body[data-variant="C"] .field-shell input {
      height: 40px;
    }
    body[data-variant="C"] .field-shell.is-error {
      border-color: var(--danger);
    }

    .submit-button {
      width: 100%;
      min-height: 52px;
      margin-top: 20px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: var(--accent);
      border: 0;
      border-radius: 16px;
    }
    .submit-button[disabled] {
      color: var(--tertiary);
      background: var(--disabled);
    }

    .suggestions {
      display: grid;
      gap: 4px;
      margin-top: 16px;
    }
    .suggestions-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--secondary);
    }
    .suggestion {
      min-height: 44px;
      padding: 0;
      font-size: 17px;
      color: var(--accent);
      text-align: left;
      background: transparent;
      border: 0;
    }

    /* Settings sheet context. */
    .settings-backdrop {
      position: absolute;
      inset: 0;
      padding: 0 22px;
      color: var(--secondary);
      background: var(--grouped-background);
    }
    .settings-backdrop .status-bar {
      margin: 0 -22px;
    }
    .settings-backdrop h1 {
      margin: 38px 0 22px;
      font-size: 22px;
      color: var(--foreground);
      text-align: center;
    }
    .settings-card {
      height: 120px;
      background: var(--surface);
      border-radius: 22px;
      opacity: 0.72;
    }
    .sheet-dim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
    }
    .profile-sheet {
      position: absolute;
      inset: 62px 0 0;
      z-index: 2;
      min-height: calc(100% - 62px);
      overflow: hidden;
      background: var(--background);
      border-radius: 36px 36px 0 0;
      box-shadow: 0 -10px 34px rgba(0, 0, 0, 0.1);
    }
    .sheet-grabber {
      width: 36px;
      height: 5px;
      margin: 7px auto 2px;
      background: var(--tertiary);
      border-radius: 999px;
    }
    .sheet-header {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: 8px;
      align-items: center;
      padding: 8px 16px 0;
    }
    .sheet-title {
      font-size: 17px;
      font-weight: 600;
      text-align: center;
    }
    .sheet-content {
      padding: 20px 32px 0;
    }

    @media (max-width: 520px) {
      .sh-bar {
        gap: 6px;
      }
      .sh-spacer {
        display: none;
      }
    }
    </style>
  </head>
  <body class="sh-vp-390" data-appearance="light" data-variant="A">
    <header class="sh-bar">
      <b>flyn input</b>
      <nav aria-label="화면" id="sh-tabs"></nav>
      <span class="sh-spacer"></span>
      <span hidden id="sh-states"></span>
      <fieldset aria-label="입력 변형" id="sh-variants">
        <button
          aria-pressed="true"
          class="on"
          data-variant="A"
          title="Filled capsule"
          type="button"
        >
          A
        </button>
        <button
          aria-pressed="false"
          data-variant="B"
          title="Filled rounded rectangle"
          type="button"
        >
          B
        </button>
        <button
          aria-pressed="false"
          data-variant="C"
          title="Current rounded border"
          type="button"
        >
          C
        </button>
      </fieldset>
      <button id="sh-appearance" title="Light/dark 전환" type="button">
        light
      </button>
      <button id="sh-vp" type="button">vp: full (m)</button>
    </header>

    <main class="sh-stage">
      <section
        data-screen="email"
        data-states="빈 입력,오류"
        data-title="이메일"
      >
        <div class="status-bar" data-component="native:StatusBar">
          <span>9:41</span><span class="dynamic-island"></span
          ><span class="signals">▮▮▮ ◉ ▰</span>
        </div>
        <div class="navigation-bar" data-component="native:StackHeader">
          <button aria-label="로그인, 뒤로" class="back-button" type="button">
            ‹
          </button>
          <div class="navigation-title">이메일</div>
          <span></span>
        </div>
        <div class="form-layout" data-component="EmailForm">
          <div class="form-main">
            <p class="intro">코드를 받을 이메일 주소를 입력해 주세요.</p>
            <div class="field-unit" data-component="FormTextField">
              <span class="field-label" id="email-label">이메일 주소</span>
              <div
                class="field-shell"
                data-component="new:FilledTextField"
                data-when="빈 입력"
              >
                <input
                  aria-labelledby="email-label"
                  inputmode="email"
                  placeholder="name@example.com"
                >
              </div>
              <div
                class="field-shell is-error"
                data-component="new:FilledTextField"
                data-when="오류"
              >
                <input
                  aria-describedby="email-error"
                  aria-invalid="true"
                  aria-labelledby="email-label"
                  inputmode="email"
                  value="alwaysfun2183@"
                >
                <span aria-hidden="true" class="field-icon danger">!</span>
              </div>
              <p
                class="field-footer danger"
                data-when="오류"
                id="email-error"
                role="alert"
              >
                올바른 이메일 주소를 입력해 주세요.
              </p>
            </div>
          </div>
          <button
            class="submit-button"
            data-component="FormSubmitButton"
            disabled
            type="button"
          >
            코드 받기
          </button>
        </div>
      </section>

      <section
        data-screen="onboarding"
        data-states="닉네임,아이디 가능,아이디 중복"
        data-title="온보딩"
      >
        <div class="status-bar" data-component="native:StatusBar">
          <span>9:41</span><span class="dynamic-island"></span
          ><span class="signals">▮▮▮ ◉ ▰</span>
        </div>
        <div class="navigation-bar" data-component="native:StackHeader">
          <span></span>
          <div class="navigation-title" data-when="닉네임">닉네임</div>
          <div class="navigation-title" data-when="아이디 가능,아이디 중복">
            아이디
          </div>
          <span></span>
        </div>
        <div class="form-layout" data-component="OnboardingForm">
          <div class="form-main" data-when="닉네임">
            <div class="field-unit" data-component="FormTextField">
              <label class="field-label" for="nickname-onboarding"
                >닉네임</label
              >
              <div class="field-shell" data-component="new:FilledTextField">
                <input
                  aria-label="닉네임"
                  id="nickname-onboarding"
                  value="Hello"
                >
              </div>
              <p class="field-footer">
                1~32자, 글자·숫자·공백과 - ' .만 사용할 수 있어요.
              </p>
            </div>
          </div>
          <div class="form-main" data-when="아이디 가능">
            <div class="field-unit" data-component="FormTextField">
              <label class="field-label" for="username-available">아이디</label>
              <div class="field-shell" data-component="new:FilledTextField">
                <input
                  aria-label="아이디"
                  id="username-available"
                  value="alwaysfun2183"
                >
                <span
                  aria-label="사용 가능"
                  class="field-icon success"
                  role="img"
                  >✓</span
                >
              </div>
              <p class="field-footer">
                4~20자, 영문 소문자·숫자·_·.만 사용할 수 있어요.
              </p>
            </div>
          </div>
          <div class="form-main" data-when="아이디 중복">
            <div class="field-unit" data-component="FormTextField">
              <span class="field-label" id="onboarding-username-label"
                >아이디</span
              >
              <div
                class="field-shell is-error"
                data-component="new:FilledTextField"
              >
                <input
                  aria-describedby="onboarding-username-error"
                  aria-invalid="true"
                  aria-labelledby="onboarding-username-label"
                  value="alwaysfun218"
                >
                <span aria-hidden="true" class="field-icon danger">!</span>
              </div>
              <p
                class="field-footer danger"
                id="onboarding-username-error"
                role="alert"
              >
                이미 사용 중인 아이디예요.
              </p>
            </div>
            <div class="suggestions" data-component="UsernameSuggestionList">
              <span class="suggestions-title">추천</span>
              <button class="suggestion" type="button">alwaysfun218.3</button>
              <button class="suggestion" type="button">alwaysfun_2183</button>
              <button class="suggestion" type="button">alwaysfun2183_</button>
            </div>
          </div>
          <button
            class="submit-button"
            data-component="FormSubmitButton"
            data-when="닉네임"
            type="button"
          >
            아이디 정하기
          </button>
          <button
            class="submit-button"
            data-component="FormSubmitButton"
            data-when="아이디 가능"
            type="button"
          >
            시작하기
          </button>
          <button
            class="submit-button"
            data-component="FormSubmitButton"
            data-when="아이디 중복"
            disabled
            type="button"
          >
            시작하기
          </button>
        </div>
      </section>

      <section
        data-screen="settings-sheet"
        data-states="닉네임,아이디 중복"
        data-title="설정 시트"
      >
        <div aria-hidden="true" class="settings-backdrop">
          <div class="status-bar">
            <span>9:41</span><span class="dynamic-island"></span

          </div>
          <h1>설정</h1>
          <div class="settings-card"></div>
        </div>
        <div class="sheet-dim"></div>
        <div class="profile-sheet" data-component="ProfileEditSheet">

            <button

              class="sheet-action"
              data-when="닉네임"
              type="button"

              ✓
            </button>
            <button

              class="sheet-action"
              data-when="아이디 중복"
              disabled
              type="button"
            >
              ✓
            </button>
          </div>
          <div class="sheet-content" data-when="닉네임">

              <div class="field-shell" data-component="new:FilledTextField">
                <input aria-label="닉네임" value="Hello">

              <p class="field-footer">
                1~32자, 글자·숫자·공백과 - ' .만 사용할 수 있어요.
              </p>
            </div>
          </div>
          <div class="sheet-content" data-when="아이디 중복">
            <div class="field-unit" data-component="UsernameEditSheet">
              <div
                class="field-shell is-error"
                data-component="new:FilledTextField"
              >
                <input
                  aria-describedby="settings-username-error"
                  aria-invalid="true"
                  aria-label="아이디"
                  value="alwaysfun218"
                >
                <span aria-hidden="true" class="field-icon danger">!</span>
              </div>
              <p
                class="field-footer danger"
                id="settings-username-error"
                role="alert"
              >
                이미 사용 중인 아이디예요.
              </p>
            </div>
            <div class="suggestions" data-component="UsernameSuggestionList">
              <span class="suggestions-title">추천</span>
              <button class="suggestion" type="button">alwaysfun218.3</button>
              <button class="suggestion" type="button">alwaysfun_2183</button>
              <button class="suggestion" type="button">alwaysfun2183_</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
    "use strict";
    const stage = document.querySelector(".sh-stage");
    const screens = [...stage.querySelectorAll("[data-screen]")];
    const tabs = document.getElementById("sh-tabs");
    const statebox = document.getElementById("sh-states");
    const variantbox = document.getElementById("sh-variants");
    const appearanceBtn = document.getElementById("sh-appearance");
    const vpBtn = document.getElementById("sh-vp");
    const FORM_CONTROL_TAG = /INPUT|TEXTAREA|SELECT/;
    let current = null;

    for (const screen of screens) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = screen.dataset.title || screen.dataset.screen;
      button.dataset.for = screen.dataset.screen;
      button.setAttribute("aria-current", "false");
      button.onclick = () => show(screen.dataset.screen);
      tabs.append(button);
    }

    function show(slug) {
      current =
        screens.find((screen) => screen.dataset.screen === slug) || screens[0];
      for (const screen of screens) {
        screen.hidden = screen !== current;
      }
      for (const button of tabs.children) {
        const selected = button.dataset.for === current.dataset.screen;
        button.classList.toggle("on", selected);
        button.setAttribute("aria-current", selected ? "page" : "false");
      }
      history.replaceState(null, "", `#${current.dataset.screen}`);
      buildStates();
    }

    function buildStates() {
      const names = (current.dataset.states || "")
        .split(",")
        .map((name) => name.trim())
        .filter(Boolean);
      statebox.innerHTML = "";
      statebox.hidden = !names.length;
      for (const name of names) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = name;
        button.setAttribute("aria-pressed", "false");
        button.onclick = () => applyState(name);
        statebox.append(button);
      }
      applyState(names[0] || null);
    }

    function applyState(name) {
      for (const element of current.querySelectorAll("[data-when]")) {
        element.hidden = !(
          name &&
          element.dataset.when
            .split(",")
            .map((value) => value.trim())
            .includes(name)
        );
      }
      for (const button of statebox.children) {
        const selected = button.textContent === name;
        button.classList.toggle("on", selected);
        button.setAttribute("aria-pressed", String(selected));
      }
    }

    variantbox.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-variant]");
      if (!button) {
        return;
      }
      document.body.dataset.variant = button.dataset.variant;
      for (const candidate of variantbox.querySelectorAll("button")) {
        const selected = candidate === button;
        candidate.classList.toggle("on", selected);
        candidate.setAttribute("aria-pressed", String(selected));
      }
    });

    appearanceBtn.onclick = () => {
      const next =
        document.body.dataset.appearance === "dark" ? "light" : "dark";
      document.body.dataset.appearance = next;
      appearanceBtn.textContent = next;
      appearanceBtn.classList.toggle("on", next === "dark");
      appearanceBtn.setAttribute("aria-pressed", String(next === "dark"));
    };
    appearanceBtn.setAttribute("aria-pressed", "false");

    const VPS = ["full", "390", "768"];
    let viewport =
      VPS.find((value) => document.body.classList.contains(`sh-vp-${value}`)) ||
      "full";
    function applyViewport() {
      for (const value of VPS) {
        document.body.classList.toggle(
          `sh-vp-${value}`,
          value === viewport && value !== "full"
        );
      }
      vpBtn.textContent = `vp: ${viewport} (m)`;
      vpBtn.classList.toggle("on", viewport !== "full");
    }
    vpBtn.onclick = () => {
      viewport = VPS[(VPS.indexOf(viewport) + 1) % VPS.length];
      applyViewport();
    };
    applyViewport();

    addEventListener("keydown", (event) => {
      if (FORM_CONTROL_TAG.test(event.target.tagName)) {
        return;
      }
      const index = screens.indexOf(current);
      if (event.key === "ArrowRight") {
        show(screens[(index + 1) % screens.length].dataset.screen);
      }
      if (event.key === "ArrowLeft") {
        show(
          screens[(index - 1 + screens.length) % screens.length].dataset.screen
        );
      }
      if (event.key === "m") {
        vpBtn.click();
      }
    });

    addEventListener("hashchange", () => show(location.hash.slice(1)));
    show(location.hash.slice(1));
    </script>
  </body>
</html>
