<!doctype html><html lang="ko"><!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               and viewport cycle. Chrome that needs explaining has failed.

  Self-contained by design: no build, no framework, no network.

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }

    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;

    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);

    overflow-y: auto; margin-top: 12px;

  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

5:{title:'우리 동네 친구',emoji:'☕',situation:'카페에서 친해진 친구와 다음 만남을 약속해 보세요.',draft:'I look forward to see you again.',outcome:'단골 카페에서 새 친구를 만났어요.',narration:'친구가 다음 주에도 같은 자리에서 만나자며 웃는다.',reply:'Me too. See you next week!',done:false,alternate:false,sent:null}};
Object.values(episodes).forEach(e=>{e.initialDraft=e.draft;});
const alternateEndings={
1:{reply:'I’m sorry, we can’t replace it today. I can offer you a discount next time.',narration:'커피를 바꾸지는 못했다. 직원은 다음 주문에서 할인해 주겠다고 약속한다.',outcome:'커피 대신 다음 주문의 할인을 받았어요.'},
2:{reply:'It isn’t mine. I’ll keep it here in case the owner comes back.',narration:'바리스타가 노트를 계산대 안쪽에 보관한다. 주인이 돌아오면 전해주기로 한다.',outcome:'주인을 찾지 못해 바리스타에게 노트를 맡겼어요.'},
3:{reply:'That line is the service charge. The total is correct.',narration:'직원이 계산서의 각 항목을 설명한다. 금액을 확인한 뒤 계산을 마친다.',outcome:'내역을 확인한 뒤 원래 금액으로 계산했어요.'},
4:{reply:'We’re out of oat milk today. I’ll make it with regular milk, as you asked.',narration:'직원이 오늘은 귀리 우유가 없다고 알려준다. 일반 우유로 주문을 마친다.',outcome:'귀리 우유가 없어 일반 우유로 주문했어요.'},
5:{reply:'I’m not sure about next week yet, but it was lovely talking to you.',narration:'민이 다음 주 일정은 아직 모른다며 손을 흔든다.',outcome:'다음 약속은 정하지 못했지만 인사를 나눴어요.'}};
const finalExpression={id:'farewell',kind:'',situation:'다음에 또 만나자고 말할 때',original:'I look forward to see you again.',originalLabel:'내가 쓴 문장',english:'I look forward to <mark>seeing</mark> you again.',plain:'I look forward to seeing you again.',meaning:'다시 만날 날을 기대할게요.',reason:'look forward to 뒤에는 동사의 -ing 형태를 써요.',other:'I look forward to visiting your cafe.',otherMeaning:'당신의 카페에 갈 날을 기대해요.'};
const longExpressions=[{id:'long-1',kind:'',situation:'주문한 음료가 다른 이유를 정중하게 확인할 때',original:'I think this is different with what I ordered.',originalLabel:'내가 쓴 문장',english:'I think this is <mark>different from</mark> what I ordered.',plain:'I think this is different from what I ordered.',meaning:'제가 주문한 것과 다른 것 같아요.',reason:'무엇과 다르다고 말할 때 different from을 써요.',other:'This room is different from the one in the photos.',otherMeaning:'이 방은 사진에 나온 방과 달라요.'},{id:'long-2',kind:'teal',situation:'바쁜 상대에게 부탁하면서 시간을 넉넉히 줄 때',original:'급한 건 아니니까 시간 되실 때 확인해 주실래요?',originalLabel:'한국어로 물어본 말',english:'<mark>Whenever you have a moment,</mark> could you check whether this was made with regular milk or oat milk?',plain:'Whenever you have a moment, could you check whether this was made with regular milk or oat milk?',meaning:'시간 되실 때, 이걸 일반 우유로 만들었는지 귀리 우유로 만들었는지 확인해 주실래요?',reason:'Whenever you have a moment로 상대가 편한 때 부탁을 들어줘도 된다고 말해요.',other:'Whenever you have a moment, could you check my reservation?',otherMeaning:'시간 되실 때 제 예약을 확인해 주실래요?'}];
let activeEpisode=1,reviewEpisode=1,transcriptEpisode=1,transcriptOrigin='review',reviewOrigin='episode',reviewMode='Default',current='episode';
const screens=[...document.querySelectorAll('[data-screen]')];
const screenSelect=$('#sh-screen'),stateSelect=$('#sh-state');
screens.forEach(s=>{const o=document.createElement('option');o.value=s.dataset.screen;o.textContent=s.dataset.title;screenSelect.append(o)});
function episodeState(){const e=episodes[activeEpisode];return e.done?(e.alternate?'다른 결말':'에피소드 종료'):'Default'}
function state(){return current==='episode'?episodeState():current==='review'?reviewMode:'Default'}
function syncChrome(){screenSelect.value=current;const declared=(screens.find(s=>s.dataset.screen===current).dataset.states||'').split(',').filter(Boolean);stateSelect.replaceChildren(...['Default',...declared].map(v=>{const o=document.createElement('option');o.value=v;o.textContent=v==='Default'?(current==='episode'?'대화 중':'기본'):v;return o}));stateSelect.value=state();stateSelect.disabled=declared.length===0;}
function situation(n){return `<span aria-hidden="true">${episodes[n].emoji}</span><span>${episodes[n].situation}</span>`}
const characterForEpisode=(text,n)=>`<div class="turn"><div class="character" data-component="SceneMessage"><div class="speaker">${n===5?'민':'바리스타'}</div><div class="speech">${escapeHTML(text)}</div></div></div>`;
const narration=text=>`<p class="narration" data-component="SceneMessage">${escapeHTML(text)}</p>`;
function correction(e){return `<details class="correction ${e.kind}" data-correction="${e.id}" data-component="EpisodeCorrectionNote"><summary aria-label="${e.kind?'이럴 때 쓰는 영어 표현':'더 자연스러운 영어 표현'} 보기">${icon(e.kind?'chat':'spark')}<span class="correction-text">${e.plain}</span>${icon('down')}</summary><div class="detail-body"><h3>${e.kind?'이럴 때 쓰는 영어 표현':'더 자연스러운 영어 표현'}</h3><p>${escapeHTML(e.original)}</p><p>${e.english}</p><p>${e.reason}</p></div></details>`}
function user(text,e,readonly){return `<div class="turn user-turn"><div class="user-bubble" data-component="UserMessage">${escapeHTML(text)}</div>${e&&!readonly?correction(e):''}</div>`}
function conversation(n,readonly=false){const e=episodes[n];const character=text=>characterForEpisode(text,n);let html='';if(n===1){html=narration('직원이 차가운 라테를 내려놓고 다음 손님을 부르려 한다.')+character('Here you go. Next, please!')+user(expressions[0].original,expressions[0],readonly)+character('Oh, you wanted it hot?')+user(expressions[1].original,expressions[1],readonly)+character('Of course. Pick it up at the other end of the counter.');}else if(n===2){html=narration('옆자리 손님이 서둘러 나간 뒤, 의자 위에 작은 노트가 남아 있다.')+character('Excuse me, is that notebook yours?');}else if(n===3){html=narration('계산서를 확인하니 주문하지 않은 케이크가 적혀 있다.')+character('Everything all right with the bill?');}else if(n===4){html=narration('늘 주문하던 라테를 오늘은 다른 우유로 마셔보고 싶다.')+character('Your usual latte?');}else{html=narration('카페 문을 닫을 시간이다. 민이 다음 주에도 들를 건지 묻는다.')+character('Same time next week?');}
if(e.sent!==null){const exp=n===1&&e.sent===expressions[2].original?expressions[2]:n===5&&e.sent===finalExpression.original?finalExpression:null;html+=`<div class="last-turn">${user(e.sent,exp,readonly)}<div class="closing-scene">${character(e.alternate?alternateEndings[n].reply:e.reply)}${narration(e.alternate?alternateEndings[n].narration:e.narration)}</div></div>`;}
return html;}
function actualOutcome(n){return episodes[n].alternate?alternateEndings[n].outcome:episodes[n].outcome}
function scrollEnd(selector){const el=$(selector);el.scrollTop=el.scrollHeight;}
function celebrationMarkup(){return '<div class="celebration-burst" aria-hidden="true">'+Array.from({length:22},(_,i)=>{const direction=i%2?-1:1;const dx=direction*(35+(i*17)%99),dy=-(20+(i*23)%66),rotation=direction*(70+(i*31)%160);return `<i class="confetti" style="--dx:${dx}px;--dy:${dy}px;--turn:${rotation}deg;--delay:${(i%4)*22}ms"></i>`;}).join('')+'</div>';}
function completionCard(n,celebrate=false){const success=!episodes[n].alternate;const title=actualOutcome(n);
return `<div class="outcome-card completion-celebration ${celebrate?'celebrating':''}" data-component="EpisodeClosing">${celebrate?celebrationMarkup():''}<div class="achievement-heading"><div class="achievement-mark" data-component="new:EpisodeCompletionMark" aria-hidden="true"><div class="achievement-medal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4 10-10"/></svg></div><svg class="achievement-spark" viewBox="0 0 24 24" fill="currentColor"><path d="m12 0 3.1 8.9L24 12l-8.9 3.1L12 24l-3.1-8.9L0 12l8.9-3.1Z"/></svg><svg class="achievement-spark small" viewBox="0 0 24 24" fill="currentColor"><path d="m12 0 3.1 8.9L24 12l-8.9 3.1L12 24l-3.1-8.9L0 12l8.9-3.1Z"/></svg></div>${success?'<div class="achievement-kicker">해냈어요!</div>':''}<h3 id="outcome-text" tabindex="-1">${title.replace(/[.]$/,'')}</h3></div><button class="primary" data-action="review-expressions" data-component="Button">표현 돌아보기 ${icon('arrow')}</button></div>`;}
function renderEpisode(celebrate=false){const e=episodes[activeEpisode];$('#episode-title').textContent=`${activeEpisode}화 · ${e.title}`;$('#episode-situation').innerHTML=situation(activeEpisode);$('#episode-body').innerHTML=conversation(activeEpisode);let bottom='';if(e.done){bottom=completionCard(activeEpisode,celebrate);}else{bottom=`<form class="composer" id="episode-form"><textarea id="reply" rows="1" aria-label="답장" placeholder="영어나 한국어로 적어 주세요.">${escapeHTML(e.draft)}</textarea><button class="send" id="send" aria-label="보내기" ${e.draft.trim()?'':'disabled'}>${icon('up')}</button></form>`;}$('#episode-bottom').classList.toggle('has-completion',e.done);$('#episode-bottom').innerHTML=bottom;const input=$('#reply');if(input){input.oninput=()=>{e.draft=input.value;$('#send').disabled=!input.value.trim();input.style.height='48px';input.style.height=Math.min(112,input.scrollHeight)+'px';};$('#episode-form').onsubmit=event=>{event.preventDefault();if(e.done||!input.value.trim())return;e.sent=input.value.trim();input.blur();e.done=true;e.draft='';renderEpisode(true);syncChrome();scrollEnd('#episode-body');$('#outcome-text')?.focus({preventScroll:true});};}scrollEnd('#episode-body');}
function ensureEnded(n){const e=episodes[n];if(!e.done){e.done=true;e.sent=e.sent||e.draft||e.initialDraft;}}
function expressionList(){if(reviewEpisode===5)return episodes[5].sent===finalExpression.original?[finalExpression]:[];if(reviewEpisode!==1)return [];const last=episodes[1].sent;return last&&last!==expressions[2].original?expressions.slice(0,2):expressions;}
function renderReview(){const e=episodes[reviewEpisode];$('#review-episode').textContent=`${reviewEpisode}화 · ${e.title}`;let list=expressionList(),content='';if(reviewMode==='표현이 많음')list=[...list,...longExpressions];if(reviewMode==='표현 없음')list=[];if(reviewMode==='확인 중인 표현')list=list.slice(0,2);$('#review-count').textContent=reviewMode==='표현을 불러오지 못함'?'':`${list.length}개`;
if(reviewMode==='표현을 불러오지 못함'){content=`<div class="story-unavailable" data-component="StoryUnavailable"><svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 2 20 20M8.36 8.36A6 6 0 0 0 6 20h12M9.7 4.3A7 7 0 0 1 20.8 10a5 5 0 0 1 .5 8.2"/></svg><h3>표현을 불러오지 못했어요.</h3><button class="retry-button" data-component="Button" data-variant="secondary" data-action="retry-expressions" aria-busy="false">다시 시도하기</button></div>`;}else if(list.length===0){content=`<div class="empty-card" data-component="new:ExpressionEmpty">${icon('book')}<h3>이번 대화에는 안내한 표현이 없어요</h3></div>`;}else{content=`<div class="learning">${list.map(learnCard).join('')}</div>`;}
if(reviewMode==='확인 중인 표현')content+='<div class="pending-note" role="status"><span class="pending-dot"></span>마지막 메시지의 표현을 확인하고 있어요.</div>';
$('#review-content').innerHTML=content;const last=reviewEpisode===5;const nextNumber=Math.min(5,reviewEpisode+1),nextEpisode=episodes[nextNumber];$('#review-next').innerHTML=last?'<div class="next-label">우리 동네 카페</div><h3>마지막 이야기까지 함께했어요</h3>':'<div class="next-label">다음 · '+nextNumber+'화</div><h3>'+nextEpisode.title+'</h3><p>'+(reviewEpisode===1?'노트에는 왜 이 카페의 이름이 있을까요?':nextEpisode.situation)+'</p>';

$('#review-primary').innerHTML=last?'대화 기록 보기':`${nextNumber}화 ${episodes[nextNumber].done?'다시 보기':'시작하기'} ${icon('arrow')}`;$('#review-primary').dataset.action=last?'leave':'next-episode';}
function renderTranscript(){const e=episodes[transcriptEpisode];$('#transcript-review-footer').hidden=!e.done;$('#transcript-title').textContent=`${transcriptEpisode}화 · ${e.title}`;$('#transcript-situation').innerHTML=situation(transcriptEpisode);$('#transcript-body').innerHTML=conversation(transcriptEpisode,true)+(e.done?'<div class="read-only-end">끝</div><p class="record-outcome">'+actualOutcome(transcriptEpisode)+'</p>':'');scrollEnd('#transcript-body');}
function renderRecords(){const completed=Object.entries(episodes).filter(([n,e])=>e.done);const final=episodes[5].done;const count=final?5:completed.filter(([n])=>Number(n)<5).length;const next=final?null:Number(Object.keys(episodes).find(n=>!episodes[n].done)||5);let html='<h3 style="font-size:16px;line-height:24px">9월 9일 오전 9:30</h3><div class="progress" role="img" aria-label="5화 중 '+count+'화 종료">'+Array.from({length:5},(_,i)=>'<i style="'+(i<count?'background:var(--accent)':'')+'"></i>').join('')+'</div><p>'+ (final?'5/5화 · 완료':`${next}/5화 · ${episodes[next].title}`)+'</p><div style="margin-top:14px">';html+=completed.map(([n,e])=>`<button class="record-line" data-action="record-transcript" data-episode="${n}"><span><strong>${n}화 · ${e.title}</strong><small>${actualOutcome(Number(n))}</small></span>${icon('arrow')}</button>`).join('');html+='</div>';if(!final)html+='<button class="primary" data-action="resume" style="margin-top:14px" data-component="Button">이어서 하기</button>';$('#records-content').innerHTML=html;}
function go(slug,{preserveScroll=false,animate=true,celebrate=false}={}){const aliases={closing:'review',next:'episode'};slug=aliases[slug]||slug;if(!screens.some(s=>s.dataset.screen===slug))slug='episode';current=slug;screens.forEach(s=>{s.hidden=s.dataset.screen!==slug;s.classList.remove('screen-enter')});if(slug==='episode')renderEpisode(celebrate);if(slug==='review')renderReview();if(slug==='transcript')renderTranscript();if(slug==='records')renderRecords();const screen=screens.find(s=>!s.hidden);if(!preserveScroll&&!['episode','transcript'].includes(slug))screen.querySelector('.body').scrollTop=0;if(animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)screen.classList.add('screen-enter');history.replaceState(null,'','#'+slug);syncChrome();}
function setState(name){if(current==='episode'){const e=episodes[activeEpisode];if(name==='Default'){activeEpisode=1;for(const v of Object.values(episodes)){v.done=false;v.sent=null;v.alternate=false;v.draft=v.initialDraft;}episodes[1].draft=expressions[2].original;reviewMode='Default';}else{e.sent=e.sent||e.draft||e.initialDraft;e.done=true;e.alternate=name==='다른 결말';}go('episode',{animate:false,celebrate:['에피소드 종료','다른 결말'].includes(name)});}else if(current==='review'){reviewMode=name;if(name==='마지막 화'){reviewEpisode=5;activeEpisode=5;Object.keys(episodes).forEach(n=>ensureEnded(Number(n)));}go('review',{animate:false});}else{syncChrome();}}
window.prototypeShell={showScreen:go,setState,getScreen:()=>current,getState:state};
screenSelect.onchange=()=>{const slug=screenSelect.value;if(slug==='review'){reviewOrigin='episode';reviewEpisode=activeEpisode;ensureEnded(reviewEpisode);reviewMode=reviewEpisode===5?'마지막 화':'Default';}if(slug==='transcript'){transcriptEpisode=activeEpisode;transcriptOrigin='episode';ensureEnded(transcriptEpisode);}go(slug);};stateSelect.onchange=()=>setState(stateSelect.value);
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='review-expressions'){if(!episodes[activeEpisode].done)return;reviewOrigin='episode';reviewEpisode=activeEpisode;reviewMode=reviewEpisode===5?'마지막 화':'Default';go('review');}if(action==='review-back'){if(reviewOrigin==='transcript'){transcriptEpisode=reviewEpisode;go('transcript');}else{activeEpisode=reviewEpisode;go('episode');}}if(action==='transcript-review'){if(!episodes[transcriptEpisode].done)return;reviewOrigin='transcript';reviewEpisode=transcriptEpisode;reviewMode=reviewEpisode===5?'마지막 화':'Default';go('review');}if(action==='transcript-back')go(transcriptOrigin);if(action==='leave')go('records');if(action==='go-home')go('home');if(action==='return-preview')go('review');if(action==='resume'){activeEpisode=Number(Object.keys(episodes).find(n=>!episodes[n].done)||5);go('episode');}if(action==='record-transcript'){transcriptEpisode=Number(el.dataset.episode);transcriptOrigin='records';go('transcript');}if(action==='next-episode'){activeEpisode=Math.min(5,reviewEpisode+1);go('episode');}if(action==='retry-expressions'){reviewMode='Default';go('review');}});
const VPS=['390','768','full'];let vp=0;$('#sh-vp').onclick=()=>{vp=(vp+1)%VPS.length;document.body.classList.remove('sh-vp-390','sh-vp-768');if(VPS[vp]!=='full')document.body.classList.add('sh-vp-'+VPS[vp]);$('#sh-vp').textContent=VPS[vp]==='full'?'전체 너비':'너비 '+VPS[vp];};
addEventListener('keydown',event=>{if(/INPUT|TEXTAREA|SELECT|SUMMARY/.test(event.target.tagName)||event.metaKey||event.ctrlKey||event.altKey)return;if(event.key==='m')$('#sh-vp').click();if(event.key==='ArrowRight'||event.key==='ArrowLeft'){const i=screens.findIndex(s=>s.dataset.screen===current);const j=(i+(event.key==='ArrowRight'?1:-1)+screens.length)%screens.length;screenSelect.value=screens[j].dataset.screen;screenSelect.onchange();}});
addEventListener('hashchange',()=>go(location.hash.slice(1)));
const initial=location.hash.slice(1);if(['closing','review','transcript'].includes(initial)){ensureEnded(1);transcriptOrigin='review';}go(initial||'episode',{animate:false});
</script></body></html>
