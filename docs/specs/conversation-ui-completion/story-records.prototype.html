<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>Flyn · 대화 기록</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens: the project's own, or this minimal set as-is ── */
  :root {
    --background: #f4f4f6;
    --foreground: #111114;
    --surface: #ffffff;
    --surface-foreground: var(--foreground);
    --accent: #4285f4;
    --muted: #6b7280;
    --border: #d4d4d8;
    --danger: #dc2626;
    --line: var(--border);
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .sh-theme-dark {
    --background: #0b0b0d;
    --foreground: #ffffff;
    --surface: #1a1a1e;
    --surface-foreground: var(--foreground);
    --accent: #0a84ff;
    --muted: #a1a1aa;
    --border: #3f3f46;
    --danger: #ff453a;
    --line: var(--border);
  }

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }

  /* Product: record cards open a sheet; the trailing menu only manages its run. */
  .sh-stage { position:relative; padding:0; height: min(844px, calc(100dvh - 84px)); min-height:420px; overflow:hidden; }
  .sh-vp-390 .sh-stage, .sh-vp-768 .sh-stage { padding:0; overflow:hidden; }
  .product-screen { height:100%; position:relative; width:100%; background:var(--background); }
  .page-header, .content { width:100%; max-width:520px; margin-inline:auto; }
  button, input { font:inherit; }
  button { -webkit-tap-highlight-color:transparent; cursor:pointer; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .records-base { height:100%; overflow-y:auto; overscroll-behavior:contain; }
  .page-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:21px 20px 14px; }
  h1 { margin:0; font-size:22px; line-height:1.25; font-weight:750; letter-spacing:-.5px; }
  .new-chat { border:0; background:none; color:var(--accent); padding:8px 0 8px 12px; font-size:15px; white-space:nowrap; }
  .content { padding:8px 20px 36px; }
  .story-intro { display:flex; align-items:center; gap:14px; padding:6px 4px 24px; border-bottom:1px solid var(--border); }
  .cover { flex:0 0 76px; height:88px; border-radius:9px; }
  .story-title { margin:0 0 5px; font-size:20px; line-height:1.35; font-weight:750; letter-spacing:-.5px; }
  .story-description { margin:0; font-size:14px; line-height:1.5; color:var(--muted); }
  .section-title { margin:24px 4px 12px; color:var(--muted); font-size:14px; line-height:1.4; font-weight:600; }
  .run-list { display:grid; gap:14px; }
  .run-card { position:relative; border-radius:16px; background:var(--surface); box-shadow:0 1px 2px #00000005; }
  .open-run { display:block; width:100%; border:0; border-radius:16px; padding:16px; min-height:106px; background:none; color:var(--foreground); text-align:left; }
  .open-run:active { background:color-mix(in srgb,var(--foreground) 4%,transparent); }
  .run-date { display:block; padding-right:32px; font-size:16px; line-height:22px; font-weight:700; }
  .progress { display:flex; width:100%; height:4px; gap:3px; margin:0; }

  .position-count { white-space:nowrap; }
  .run-position, .story-description, .episode-title { word-break:keep-all; overflow-wrap:break-word; }
  .progress span { flex:1; border-radius:3px; background:var(--border); }
  .progress .done { background:var(--accent); }
  .progress .current { background:color-mix(in srgb,var(--accent) 16%,var(--surface)); outline:1px solid var(--accent); }
  .run-position { display:block; margin-top:10px; color:var(--muted); font-size:14px; line-height:1.5; }
  .more-actions { position:absolute; right:4px; top:5px; }
  .icon-button { display:grid; place-items:center; width:44px; height:44px; border:0; background:none; color:var(--muted); border-radius:50%; }
  .icon { display:block; width:20px; height:20px; flex-shrink:0; }
  .more-menu { position:absolute; z-index:8; right:4px; top:47px; width:162px; padding:5px; background:var(--surface); border:1px solid var(--border); border-radius:13px; box-shadow:0 10px 30px #00000020; }
  .menu-delete { display:flex; align-items:center; justify-content:space-between; width:100%; min-height:44px; border:0; border-radius:9px; padding:10px 12px; color:var(--danger); background:none; text-align:left; font-size:16px; }
  .menu-delete:hover { background:color-mix(in srgb,var(--danger) 7%,transparent); }
  .empty-state { min-height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); }
  .empty-state .icon { width:32px; height:32px; }
  .empty-state p { margin:0; font-size:15px; }
  .records-loading { min-height:300px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  /* HTML approximation of LoadingSpinner's standalone iOS role: muted, 36px. */
  .loading-spinner { display:block; width:36px; height:36px; flex:0 0 36px; }
  .loading-spinner rect { fill:currentColor; opacity:.18; animation:spinner-pulse 1s linear infinite; }
  @keyframes spinner-pulse { 0% { opacity:1; } 100% { opacity:.18; } }
  @media (prefers-reduced-motion:reduce) { .loading-spinner rect { animation:none; opacity:.55; } }
  .overlay { position:absolute; inset:0; z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .scrim { position:absolute; inset:0; background:#00000055; animation:fade-in .18s ease-out; }
  .sheet { position:relative; width:100%; max-width:520px; display:flex; flex-direction:column; max-height:calc(100% - 50px); border-radius:26px 26px 0 0; background:var(--surface); color:var(--foreground); box-shadow:0 -8px 40px #00000012; animation:sheet-in .24s ease-out; }
  .sheet.expanded-sheet { height:calc(100% - 50px); }
  .sheet-grab { display:flex; justify-content:center; align-items:center; flex-shrink:0; width:100%; height:28px; padding:0; border:0; background:none; border-radius:26px 26px 0 0; touch-action:none; cursor:grab; }
  .sheet-grab::after { content:''; width:36px; height:5px; border-radius:9px; background:color-mix(in srgb,var(--muted) 35%,transparent); }
  .sheet-heading { position:relative; padding:4px 60px 20px 24px; flex-shrink:0; }
  .sheet-meta { margin:0 0 5px; color:var(--muted); font-size:13px; line-height:1.4; }

  .expanded-sheet .sheet-body { flex:1; }
  .episode-row { display:grid; grid-template-columns:30px minmax(0,1fr) 16px; gap:10px; align-items:start; width:100%; padding:17px 8px; border:0; background:none; color:var(--foreground); text-align:left; }
  .episode-row + .episode-row { border-top:1px solid var(--border); }
  .episode-row.current-episode { border:0; margin-top:6px; padding:17px 12px; border-radius:14px; background:color-mix(in srgb,var(--accent) 7%,var(--surface)); }
  .episode-row:first-child { margin-top:0; }
  .episode-number { font-size:14px; line-height:24px; font-weight:600; color:var(--muted); }

  .confirm-overlay { align-items:center; padding:20px; z-index:30; }

  .dialog-copy { padding:23px 20px 21px; }
  .dialog h2 { margin:0 0 8px; font-size:17px; line-height:1.35; }
  .dialog p { margin:0; font-size:14px; line-height:1.5; }
  .dialog-actions { display:flex; border-top:1px solid var(--border); }
  .dialog-actions button { width:50%; min-height:48px; padding:12px; border:0; background:none; color:var(--accent); font-size:16px; }
  .dialog-actions button + button { border-left:1px solid var(--border); color:var(--danger); font-weight:600; }
  .chat-view { display:flex; flex-direction:column; height:100%; max-width:520px; margin-inline:auto; }
  .chat-header { display:flex; align-items:center; gap:6px; padding:10px 12px; min-height:64px; flex-shrink:0; }
  .chat-header .icon-button { color:var(--foreground); }
  .chat-heading { min-width:0; }
  .chat-heading p { margin:0 0 2px; color:var(--muted); font-size:12px; }
  .chat-heading h1 { font-size:17px; line-height:1.35; letter-spacing:-.3px; }
  .situation { padding:12px 20px; font-size:14px; line-height:1.5; background:color-mix(in srgb,var(--accent) 10%,var(--background)); flex-shrink:0; }
  .messages { flex:1; min-height:0; overflow-y:auto; padding:24px 20px; display:flex; flex-direction:column; align-items:flex-start; gap:16px; }
  .scene { margin:0 0 4px; color:var(--scene,#3c3c43); font-size:14px; line-height:1.65; }
  .cast { margin:0 0 6px 3px; color:#b4552f; font-size:13px; font-weight:600; }
  .sh-theme-dark .cast { color:#f0997b; }
  .bubble { max-width:270px; padding:13px 16px; border-radius:17px; background:var(--surface); font-size:16px; line-height:1.5; }
  .own-message { align-self:flex-end; background:var(--accent); color:white; }
  .ending { width:100%; padding:20px; border:1px solid var(--border); border-radius:16px; text-align:center; font-size:16px; line-height:1.5; font-weight:600; }
  .composer { display:flex; align-items:center; gap:8px; padding:12px 16px 18px; flex-shrink:0; }
  .composer input { min-width:0; flex:1; border:1px solid var(--border); border-radius:22px; background:var(--surface); color:var(--foreground); padding:12px 15px; font-size:16px; }
  .send { background:var(--accent); color:white; width:40px; height:40px; }
  .send:disabled { opacity:.4; cursor:default; }
  .read-only { padding:16px 20px 24px; text-align:center; font-size:14px; color:var(--muted); }
  @keyframes sheet-in { from {transform:translateY(60px);opacity:0} to {transform:translateY(0);opacity:1} }
  @keyframes fade-in { from {opacity:0} to {opacity:1} }
  @media (prefers-reduced-motion: reduce) { .sheet,.scrim {animation:none;} }

</style>

<body class="sh-vp-390">
<header class="sh-bar">

<main class="sh-stage">

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
    dispatchEvent(new CustomEvent('prototype:screen', {detail:{screen:current.dataset.screen}}));
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = current.dataset.screen==='records' && name==='Default'?'1화 · 완료':name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
    dispatchEvent(new CustomEvent('prototype:state', {detail:{screen:current.dataset.screen,state:active}}));
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.closest('[role=dialog],[role=alertdialog]')) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>

<script>
/* Confirmed scope: card → episode sheet; include the current episode even without messages;
   card-end overflow → 삭제. Full-width segmented progress applies to every episode count (approved A). Dummy data only. Sheet size and return-to-records are review defaults. */
(() => {
  const $ = id => document.getElementById(id);
  const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = (body, cls='icon') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" aria-hidden="true">${body}</svg>`;
  const dots = icon('<circle cx="5" cy="12" r="1.65" fill="currentColor"/><circle cx="12" cy="12" r="1.65" fill="currentColor"/><circle cx="19" cy="12" r="1.65" fill="currentColor"/>');
  const arrow = icon('<path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>','row-arrow');
  const trash = icon('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>');
  const cafeEpisodes = [
    {title:'카페에서 생긴 일',outcome:'원하는 커피로 바꿔냈어요',situation:'☕ 잘못 나온 음료를 바꿔 달라고 말해 보세요',opening:"Hi! Here's your iced latte.",scene:'점심시간의 카페. Mia가 내민 잔에는 얼음이 가득해요. 주문한 건 따뜻한 라테였어요.'},
    {title:'계산이 꼬인 아침',outcome:'잘못 계산한 금액을 돌려받았어요',situation:'🧾 영수증을 확인하고 잘못된 금액을 알려 주세요',opening:'Good morning! That will be twelve dollars.',scene:'익숙한 카페 계산대 앞이에요. 늘 마시는 라테를 주문했는데, 영수증의 금액이 평소보다 커요.'},
    {title:'내 자리에 앉은 손님',outcome:'서로 양보하며 함께 앉을 자리를 찾았어요',situation:'🪑 잠깐 비운 자리에 다른 손님이 앉아 있어요',opening:'Oh, were you sitting here?',scene:'음료를 받아 돌아오니 아까 앉았던 자리에 다른 손님이 있어요.'},
    {title:'바쁜 오후의 작은 부탁',outcome:'Mia에게 필요한 도움을 건넸어요',situation:'🥤 손님이 몰린 카페에서 Mia를 도와주세요',opening:'Could you give me a hand for a moment?',scene:'카페에 손님이 몰려들어요. 양손에 잔을 든 Mia가 당신을 바라봐요.'},
    {title:'단골들과 함께 준비하는 마지막 영업일',outcome:'모두의 마음을 담아 작별 인사를 전했어요',situation:'💌 마지막 영업일에 Mia에게 마음을 전해 보세요',opening:"I can't believe it's our last day here.",scene:'익숙했던 카페가 오늘 문을 닫아요. 단골들이 하나둘 모여들어요.'}
  ];
  const repairEpisodes=[{title:'헤드폰 수리 문의',outcome:'수리 절차와 예상 기간을 확인했어요',situation:'🎧 헤드폰의 문제를 설명하고 수리 방법을 물어보세요',opening:'Hi! What seems to be the problem with your headphones?',scene:'애플 매장에 도착했어요. 직원에게 헤드폰의 노이즈 캔슬링 문제를 설명하려고 해요.'}];
  let episodes=repairEpisodes, storyName='헤드폰 수리 문의';
  function setStory(multi){
    episodes=multi?cafeEpisodes:repairEpisodes;
    storyName=multi?'Mia의 카페':'헤드폰 수리 문의';
    document.querySelector('.story-title').textContent=storyName;
    document.querySelector('.story-description').textContent=multi?'매일 들르는 동네 카페에서 벌어지는 다섯 번의 사건.':'애플 매장에서 AirPods Max의 노이즈 캔슬링 문제를 설명하는 상황입니다. 수리 가능 여부와 필요한 절차를 영어로 물어보세요.';
    document.querySelector('.sheet-meta').textContent=storyName;
  }
  const run = (id,date,finished,started) => ({id,date,finished,started,messages:{}});
  // Forced review preset represents a request still pending after the existing 1-second threshold.
  // Story context is already known; the recent-records region alone waits. No real request or delay.
  // Confirmed for recent records: spinner only, with the loading name exposed to assistive technology.
  $('records-spinner').innerHTML=Array.from({length:12},(_,i)=>`<rect x="16.5" y="2" width="3" height="9" rx="1.5" transform="rotate(${i*30} 18 18)" style="animation-delay:${(i-12)/12}s"/>`).join('');
  let runs=[], selectedId=null, deleteId=null, chat=null, preset='Default', syncing=false;
  function fixture(name) {
    setStory(name.startsWith('5화'));
    const r=run('run-1','9월 14일 오후 2:37',episodes.length,false);
    if(name.includes('진행 중')) {r.finished=episodes.length===1?0:1;r.started=true;}
    if(name.includes('시작 전')) {r.finished=0;r.started=false;}
    if(name==='5화 · 다음 화 시작 전') {r.finished=1;r.started=false;}
    if(name.includes('마지막 화')) {r.finished=4;r.started=true;}
    if(name==='여러 회차') return [run('run-2','9월 14일 오후 3:42',0,true),r];
    return name==='삭제 후'||name==='불러오는 중'?[]:[r];
  }
  function inferState() {
    if(!runs.length)return '삭제 후';
    if(runs.length>1)return '여러 회차';
    const r=runs[0], prefix=episodes.length===1?'1화':'5화';
    if(r.finished===episodes.length)return episodes.length===1?'Default':'5화 · 완료';
    if(r.finished===1&&!r.started)return '5화 · 다음 화 시작 전';
    if(r.finished===4)return '5화 · 마지막 화';
    return prefix+(r.started?' · 진행 중':' · 시작 전');
  }
  function syncState() {preset=inferState();syncing=true;prototypeShell.setState(preset);syncing=false;}
  function closeMenu() {
    document.querySelectorAll('.more-menu').forEach(el=>el.hidden=true);
    document.querySelectorAll('[data-more]').forEach(el=>el.setAttribute('aria-expanded','false'));
  }
  function dismissSheet(focus=true) {
    $('episode-overlay').hidden=true;$('records-base').inert=false;
    if(focus) document.querySelector(`[data-open="${selectedId}"]`)?.focus();
  }
  function dismissDelete(focus=true) {
    $('delete-overlay').hidden=true;$('records-base').inert=false;
    if(focus) document.querySelector(`[data-more="${deleteId}"]`)?.focus();
  }
  function closeOverlays() {closeMenu();dismissSheet(false);dismissDelete(false);}
  function renderRecords() {
    const loading=preset==='불러오는 중';
    $('records-results').setAttribute('aria-busy',String(loading));
    $('records-loading').hidden=!loading;
    $('records-loading').setAttribute('aria-busy',String(loading));
    $('run-list').hidden=loading;
    $('empty-records').hidden=loading||!!runs.length;
    $('run-list').innerHTML=runs.map(r=>{
      const total=episodes.length,index=Math.min(r.finished,total-1),complete=r.finished===total;
      const count=`${index+1}/${total}화`, label=complete?'완료':episodes[index].title;
      const position=`<span class="position-count">${count}</span> · ${label}`;
      const bars=episodes.map((_,i)=>`<span class="${i<r.finished?'done':i===r.finished?'current':''}"></span>`).join('');
      const bar=`<span class="progress" data-component="StoryProgress" aria-label="${total}화 중 ${r.finished}화 완료">${bars}</span>`;
      const content=`<span class="run-date">${r.date}</span><span class="progress-row">${bar}<span class="run-position">${position}</span></span>`;
      return `<article class="run-card" data-component="StoryPlayCard"><button class="open-run" data-open="${r.id}" type="button" aria-label="${r.date} 대화 기록 보기" aria-haspopup="dialog">${content}</button><div class="more-actions"><button class="icon-button" data-more="${r.id}" type="button" aria-label="${r.date} 더보기" aria-haspopup="menu" aria-expanded="false">${dots}</button><div class="more-menu" role="menu" hidden><button class="menu-delete" role="menuitem" data-delete="${r.id}" type="button">삭제${trash}</button></div></div></article>`;
    }).join('');
  }
  function openSheet(id) {
    closeMenu();selectedId=id;
    const r=runs.find(r=>r.id===id);if(!r)return;
    $('sheet-title').textContent=r.date;
    $('episode-list').innerHTML=episodes.slice(0,Math.min(episodes.length,r.finished+1)).map((ep,i)=>{
      const done=i<r.finished;
      const detail=done?ep.outcome:r.started?'이어서 하기':'시작하기';
      return `<button class="episode-row ${done?'':'current-episode'}" data-episode="${i}" type="button" data-component="StoryPlayEpisodeRow"><span class="episode-number">${i+1}화</span><span><span class="episode-title">${ep.title}</span><span class="episode-detail ${done?'':'episode-action'}">${detail}</span></span>${arrow}</button>`;
    }).join('');
    $('episode-sheet').classList.remove('expanded-sheet');$('sheet-grab').setAttribute('aria-label','목록 크게 보기');
    $('episode-list').scrollTop=0;$('records-base').inert=true;$('episode-overlay').hidden=false;$('sheet-title').focus();
  }
  function openDelete(id) {
    closeMenu();deleteId=id;$('records-base').inert=true;$('delete-overlay').hidden=false;$('cancel-delete').focus();
  }
  function showChat(r,index,draft=false) {
    closeOverlays();chat={run:r,index,draft};
    syncing=true;prototypeShell.showScreen('chat');syncing=false;
    renderChat();$('chat-back').focus();
  }
  function bubble(text, own=false) {return `<div class="bubble ${own?'own-message':''}">${escape(text)}</div>`;}
  function renderChat() {
    if(!chat) chat={run:runs[0]||run('preview','9월 8일 오후 3:42',0,true),index:0};
    chat.run.initialStarted ??= chat.run.started;
    const ep=episodes[chat.index], complete=chat.index<chat.run.finished;
    $('chat-title').textContent=ep.title;$('chat-number').textContent=`${chat.index+1}화 · ${storyName}`;$('chat-situation').textContent=ep.situation;
    let body=`<p class="scene">${ep.scene}</p><div><p class="cast">${episodes.length===1?'직원':'Mia'}</p>${bubble(ep.opening)}</div>`;
    if(complete) body+=bubble('Could you help me with this, please?',true)+bubble("Of course. Let's sort it out together.")+`<div class="ending">${ep.outcome}</div>`;
    else if(chat.run.initialStarted) body+=bubble(episodes.length===1?'The noise cancellation is not working.':chat.index===0?'I ordered a hot latte.':'Could you check the total, please?',true);
    for(const message of chat.run.messages[chat.index]||[]) body+=bubble(message,true)+bubble("Of course. Let's take a look.");
    $('messages').innerHTML=body;$('composer').hidden=complete;$('read-only').hidden=!complete;$('message-input').value='';$('send-message').disabled=true;
    $('messages').scrollTop=$('messages').scrollHeight;
  }
  function backToRecords() {
    syncing=true;prototypeShell.showScreen('records');prototypeShell.setState(preset);syncing=false;
    renderRecords();$('records-title').focus();
  }
  $('run-list').addEventListener('click',e=>{
    const open=e.target.closest('[data-open]'),more=e.target.closest('[data-more]'),del=e.target.closest('[data-delete]');
    if(open)openSheet(open.dataset.open);
    if(more){const menu=more.nextElementSibling,wasOpen=!menu.hidden;closeMenu();menu.hidden=wasOpen;more.setAttribute('aria-expanded',String(!wasOpen));}
    if(del)openDelete(del.dataset.delete);
  });
  $('episode-list').addEventListener('click',e=>{const row=e.target.closest('[data-episode]');if(row)showChat(runs.find(r=>r.id===selectedId),Number(row.dataset.episode));});
  $('sheet-close').onclick=()=>dismissSheet();
  $('cancel-delete').onclick=()=>dismissDelete();
  $('confirm-delete').onclick=()=>{runs=runs.filter(r=>r.id!==deleteId);dismissDelete(false);syncState();renderRecords();$('records-title').focus();};
  document.querySelectorAll('[data-dismiss]').forEach(el=>el.onclick=()=>el.dataset.dismiss==='sheet'?dismissSheet():dismissDelete());
  document.addEventListener('click',e=>{if(!e.target.closest('.more-actions'))closeMenu();});
  $('chat-back').onclick=backToRecords;
  $('new-chat').onclick=()=>showChat(run(`draft-${Date.now()}`,'9월 14일 오후 3:42',0,false),0,true);
  $('message-input').oninput=()=>{$('send-message').disabled=!$('message-input').value.trim();};
  $('composer').onsubmit=e=>{
    e.preventDefault();const value=$('message-input').value.trim();if(!value)return;
    (chat.run.messages[chat.index]??=[]).push(value);
    chat.run.started=true;
    if(chat.draft){runs.unshift(chat.run);chat.draft=false;}
    preset=inferState();renderChat();$('message-input').focus();
  };
  let drag=null, dragged=false;
  const grip=$('sheet-grab'), sheet=$('episode-sheet');
  grip.onpointerdown=e=>{drag={start:e.clientY,delta:0};dragged=false;grip.setPointerCapture(e.pointerId);};
  grip.onpointermove=e=>{if(!drag)return;drag.delta=e.clientY-drag.start;dragged=Math.abs(drag.delta)>8;if(drag.delta>0)sheet.style.transform=`translateY(${drag.delta}px)`;};
  grip.onpointerup=()=>{if(!drag)return;sheet.style.transform='';if(drag.delta>70)dismissSheet();else if(drag.delta< -40){sheet.classList.add('expanded-sheet');grip.setAttribute('aria-label','목록 작게 보기');}drag=null;};
  grip.onpointercancel=()=>{drag=null;sheet.style.transform='';};
  grip.onclick=()=>{if(dragged)return;sheet.classList.toggle('expanded-sheet');grip.setAttribute('aria-label',sheet.classList.contains('expanded-sheet')?'목록 작게 보기':'목록 크게 보기');};
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(!$('delete-overlay').hidden)dismissDelete();else if(!$('episode-overlay').hidden)dismissSheet();else closeMenu();}
    if(e.key!=='Tab')return;
    const overlay=!$('delete-overlay').hidden?$('delete-overlay'):!$('episode-overlay').hidden?$('episode-overlay'):null;
    if(!overlay)return;
    const controls=[...overlay.querySelectorAll('button:not([disabled])')],first=controls[0],last=controls.at(-1);
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('sheet-title'))){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  });
  addEventListener('prototype:state',e=>{if(syncing||e.detail.screen!=='records')return;closeOverlays();preset=e.detail.state;runs=fixture(preset);chat=null;renderRecords();});
  addEventListener('prototype:screen',e=>{if(syncing)return;closeOverlays();if(e.detail.screen==='chat')renderChat();});
  runs=fixture('Default');renderRecords();if(prototypeShell.getScreen()==='chat')renderChat();
})();
</script>
