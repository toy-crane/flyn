<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->

  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
<script>
const ICONS={"back": "<path d=\"m15 4-8 8 8 8\"/>", "translate": "<path d=\"M3 5h12M9 2v3M5 5c0 6 7 10 7 10M13 5c0 6-8 11-8 11M13 21l4-10 4 10m-6-4h4\"/>", "bookmark": "<path d=\"M6 3h12v18l-6-4-6 4z\"/>", "copy": "<rect x=\"8\" y=\"8\" width=\"12\" height=\"13\" rx=\"2\"/><path d=\"M16 5V3H3v13h2\"/>", "down": "<path d=\"m6 9 6 6 6-6\"/>", "forward": "<path d=\"m9 5 7 7-7 7\"/>", "up": "<path d=\"M12 20V4m-7 7 7-7 7 7\"/>", "check": "<path d=\"m5 12 4 4L19 6\"/>", "spark": "<path d=\"m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z\"/>", "close": "<path d=\"m6 6 12 12M6 18 18 6\"/>"};

let followFrame=0;msg.addEventListener('wheel',()=>cancelAnimationFrame(followFrame),{passive:true});msg.addEventListener('touchstart',()=>cancelAnimationFrame(followFrame),{passive:true});function reveal(el,open){const follow=msg.contains(el)&&msg.scrollHeight-msg.scrollTop-msg.clientHeight<28;el.classList.toggle('open',open);el.inert=!open;if(follow){const start=performance.now();cancelAnimationFrame(followFrame);function tick(now){msg.scrollTop=msg.scrollHeight;if(now-start<520)followFrame=requestAnimationFrame(tick)}followFrame=requestAnimationFrame(tick)}}
function completedConversation(){return '<p class="opening"><strong>월요일 아침, Mia의 카페.</strong>회의에 가기 전 커피를 주문했다. 카드를 내밀었지만 단말기에서 짧은 경고음이 울린다.</p>'+utterance(original,'죄송해요, 카드 결제가 안 됐어요. 다른 결제 방법이 있으세요?')+`<div class="user"><div class="bubble">I pay with my phone yesterday.</div>${learning()}</div>`+utterance('Yes, you can use your phone again. Just hold it near the reader.','네, 휴대폰으로 다시 결제하셔도 돼요. 단말기 가까이에 대 주세요.')+`<div class="user"><div class="bubble">I’ll use my phone again. Thank you!</div></div>`+utterance('Yes, it went through. Here is your iced Americano with only a little ice.','네, 결제됐어요. 얼음을 조금만 넣은 아이스 아메리카노 나왔어요.')}
function clearParticles(){document.getElementById('celebration-layer')?.remove()}
function playParticles(){clearParticles();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;requestAnimationFrame(()=>{const card=closingSlot.querySelector('.closing.play');if(!card||current.dataset.screen!=='episode')return;const phone=card.closest('.phone'),mark=card.querySelector('.mark');const bounds=phone.getBoundingClientRect(),origin=mark.getBoundingClientRect();const layer=document.createElement('div');layer.id='celebration-layer';layer.className='particle-layer';layer.setAttribute('aria-hidden','true');layer.inert=true;const x=origin.left-bounds.left+origin.width/2,y=origin.top-bounds.top+origin.height/2;layer.innerHTML=Array.from({length:28},(_,i)=>{const angle=Math.PI+(i/27)*Math.PI;const reach=125+(i%4)*26;const dx=Math.cos(angle)*reach,dy=Math.sin(angle)*reach-35;return `<i class="confetti" style="left:${x}px;top:${y}px;--dx:${dx}px;--dy:${dy}px;--fall:${dy+120}px;--r:${i*67}deg;background:${['var(--accent)','var(--learn)','var(--expression)'][i%3]}"></i>`}).join('');phone.append(layer);setTimeout(()=>layer.remove(),2500)})}

function setMode(name){clearParticles();clearTimeout(revealTimer);mode=name;setAsk(false);turn=0;closingSlot.innerHTML='';composer.hidden=false;composer.querySelector('textarea').value='I pay with my phone yesterday.';
 if(name==='대화 종료'||name==='다시 읽기'){turn=2;msg.innerHTML=completedConversation().replaceAll('class="reveal learning" inert','class="reveal learning open"');composer.hidden=true;if(name==='대화 종료'){closingSlot.innerHTML=closing(true);playParticles()}else closingSlot.innerHTML='<div class="review-cta" data-component="Button"><button class="primary" data-action="review">표현 돌아보기</button></div>';msg.scrollTop=msg.scrollHeight;requestAnimationFrame(()=>msg.scrollTop=msg.scrollHeight);
 }else{msg.innerHTML=`<p class="opening"><strong>월요일 아침, Mia의 카페.</strong>회의에 가기 전 커피를 주문했다. 카드를 내밀었지만 단말기에서 짧은 경고음이 울린다.</p>`+utterance(name==='긴 대사'?longOriginal:original,name==='긴 대사'?'죄송해요, 카드 결제가 안 됐어요. 어제 휴대폰으로 결제하셨다면 다시 시도하셔도 돼요. 초록색 체크 표시가 나올 때까지 단말기 가까이에 대고, 너무 빨리 떼지 마세요.':'죄송해요, 카드 결제가 안 됐어요. 다른 결제 방법이 있으세요?');msg.scrollTop=0;} }
const baseApply=applyState;applyState=function(name){baseApply(name);if(current.dataset.screen==='episode')setMode(stateSelect.value)};window.prototypeShell.setState=applyState;stateSelect.onchange=()=>applyState(stateSelect.value);
composer.addEventListener('submit',e=>{e.preventDefault();const field=composer.querySelector('textarea'),text=field.value.trim();if(!text)return;turn++;const node=document.createElement('div');node.className='user new-message';const b=document.createElement('div');b.className='bubble';b.textContent=text;node.append(b);msg.append(node);if(turn===1){const corrected=/^I pay with my phone yesterday\.?$/i.test(text);if(corrected){node.insertAdjacentHTML('beforeend',learning());revealTimer=setTimeout(()=>{reveal(node.querySelector('.learning'),true)},380)}msg.insertAdjacentHTML('beforeend',utterance('Yes, you can use your phone again. Just hold it near the reader.','네, 휴대폰으로 다시 결제하셔도 돼요. 단말기 가까이에 대 주세요.','new-message'));field.value='I’ll use my phone again. Thank you!';}else{msg.insertAdjacentHTML('beforeend',utterance('Yes, it went through. Here is your iced Americano with only a little ice.','네, 결제됐어요. 얼음을 조금만 넣은 아이스 아메리카노 나왔어요.','new-message'));composer.hidden=true;closingSlot.innerHTML=closing(true);playParticles();mode='대화 종료';baseApply(mode);}msg.scrollTop=msg.scrollHeight;});
function toast(text){const el=current.querySelector('.toast');el.textContent=text;el.hidden=false;setTimeout(()=>el.hidden=true,1400)}
let lastAsk;function setAsk(open){const overlay=document.getElementById('ask-overlay');overlay.hidden=!open;[...overlay.parentElement.children].filter(e=>e!==overlay&&!e.classList.contains('toast')).forEach(e=>e.inert=open)}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;

if(action==='expand'||action==='review-expand'){const el=b.parentElement.querySelector('.reveal'),on=!el.classList.contains('open');reveal(el,on);b.setAttribute('aria-expanded',on)}

if(action==='copy'){const text=b.closest('.utterance')?.querySelector('.bubble').textContent||'I paid with my phone yesterday.';try{await navigator.clipboard.writeText(text);toast('복사했어요')}catch{toast('복사하지 못했어요')}}
if(action==='review'){clearParticles();returnMode=mode;prototypeShell.showScreen('review')}

if(action==='close'){setAsk(false);lastAsk?.focus()}
});
document.addEventListener('keydown',e=>{const overlay=document.getElementById('ask-overlay');if(!overlay.hidden){if(e.key==='Escape'){setAsk(false);lastAsk?.focus()}if(e.key==='Tab'){const all=[...overlay.querySelectorAll('button,textarea')];const first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
