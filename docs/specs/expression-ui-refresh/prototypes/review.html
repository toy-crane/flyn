<!--
  comparison shell: a decision layer for one user situation, up to three alternatives.
  Copy of build-prototype/templates/comparison-shell.html. Contract preserved:
  product UI only inside .sh-stage; situation in data-question; 1–3 [data-variant];
  presets in data-states; 390/768 viewports; sticky in-frame bars; project tokens in :root.
-->
<meta charset="utf-8">
<title>Compare · 기억해 둘 표현 (확정안)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--background:#f4f4f6;--foreground:#111114;--surface:#ffffff;--surface-foreground:var(--foreground);--expression:#0f766e;--expression-surface:#e5f3ef;--learn:oklch(0.54 0.19 300);--learn-foreground:oklch(0.9911 0 0);--learn-surface:oklch(0.945 0.022 300);--muted:#74747e;--accent:#0087ff;--accent-fill:#087ff5;--accent-soft:#e0efff;--accent-foreground:#fff;--border:#e3e3e9;--danger:#bd3434;--font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif}
  @media(prefers-color-scheme:dark){:root{--background:#0b0b0d;--foreground:#ffffff;--surface:#1a1a1e;--expression:#76d6c9;--expression-surface:#152f2c;--learn:oklch(0.78 0.15 300);--learn-foreground:oklch(0.21 0.03 300);--learn-surface:oklch(0.27 0.045 300);--muted:#a0a0aa;--border:#303038;--accent-soft:#152b42;--danger:#ff8982}}
  * { box-sizing: border-box }
  body { margin: 0; padding: 0 0 40px; background: var(--background); color: var(--foreground); font-family: var(--font); -webkit-font-smoothing: antialiased }
  .sh-bar { position: sticky; top: 0; z-index: 999; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: #191a1c; color: #d7d7d7; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button { border: 1px solid #3a3d42; background: none; color: inherit; font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer }
  .sh-bar select { width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit; font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer; color-scheme: dark }
  #sh-question { overflow-wrap: anywhere; max-width: 100% }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }
  .sh-workspace { overflow-x: auto }
  .sh-options { display: flex; gap: 16px; justify-content: safe center; align-items: flex-start }
  [data-variant] { flex: 1 0 300px; max-width: 960px; min-width: 0 }
  .sh-variant-label { margin: 12px 16px 0; color: var(--muted); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
  .sh-vp-390 [data-variant] { flex: 0 0 390px }
  .sh-vp-768 [data-variant] { flex: 0 0 768px }
  .sh-vp-390 .sh-stage { max-width: 390px; background: var(--background); border: 10px solid #191a1c; border-radius: 28px; padding: 0; height: min(844px, calc(100dvh - 52px)); overflow-y: auto; margin-top: 12px; scrollbar-width: none }
  .sh-vp-390 .sh-stage::-webkit-scrollbar { display: none }
  .sh-vp-768 .sh-stage { max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px; padding: 16px; margin-top: 12px }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; text-align: left }
  h1,h2,h3,p { margin: 0 }
  svg { flex-shrink: 0 }
  mark { background: none; color: inherit }
  u { text-decoration: underline; text-underline-offset: 3px }
  .screen { display: flex; flex-direction: column; gap: 12px; padding: 54px 20px 40px }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 4px }
  .section-head h2 { font-size: 16px; line-height: 22px; font-weight: 700 }
  .section-head .count { font-size: 12px; color: var(--muted) }
  .section-head.big h2 { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -.4px }
  .list { display: flex; flex-direction: column; gap: 10px }
  .card { display: block; width: 100%; background: var(--surface); color: var(--foreground); border-radius: 18px; padding: 16px 16px 14px; position: relative }
  .card .body { display: grid; gap: 8px }
  .card.learn { --ch: var(--learn); --ch-bg: var(--learn-surface) }
  .card.guidance { --ch: var(--expression); --ch-bg: var(--expression-surface) }
  .meta { display: flex; gap: 8px; align-items: center; min-height: 20px; font-size: 12px; line-height: 18px; color: var(--muted) }
  .meta.situation { color: var(--ch); gap: 6px }
  .meta svg.spark { width: 14px; height: 14px }
  .meta .grow { flex: 1; min-width: 0 }
  .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .15s }
  [aria-expanded="true"] > .body .chev, [aria-expanded="true"] > .more .chev { transform: rotate(180deg) }
  .en { font-size: 17px; line-height: 25px; font-weight: 600 }
  .en mark { color: var(--ch); background: var(--ch-bg); border-radius: 3px; padding: 0 2px; margin: 0 -1px }
  .ko, .why { font-size: 15px; line-height: 22px; color: var(--muted) }
  .detail { display: grid; gap: 12px; padding-top: 6px }
  [aria-expanded="false"] > .detail { display: none }
  .band { border-radius: 11px; background: var(--background); padding: 8px 11px; font-size: 15px; line-height: 22px; color: var(--muted) }
  .mine { display: grid; gap: 6px }
  .example { display: grid; gap: 4px }
  .label { font-size: 12px; line-height: 18px; color: var(--muted) }
  .sample { font-size: 16px; line-height: 24px; font-weight: 600 }
  .more { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; line-height: 20px; color: var(--muted); width: 100% }
  .icons { display: flex; justify-content: flex-end; gap: 0; margin-top: 4px; margin-right: -6px }
  .icons button { width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); border-radius: 8px }
  .icons button svg { width: 16px; height: 16px }
  .icons button[aria-pressed="true"] { color: var(--accent) }
  .icons button[aria-pressed="true"] svg { fill: currentColor }
  .sh-vp-390 .sh-stage { overflow: hidden }
  .screen { padding: 0; gap: 0; height: 100%; display: flex; flex-direction: column }
  .toolbar { height: 44px; margin-top: 54px; display: flex; align-items: center; justify-content: center; position: relative; padding: 0 56px; font-size: 17px; font-weight: 600; flex-shrink: 0 }
  .toolbar .tb { position: absolute; top: 0; width: 44px; height: 44px; display: grid; place-items: center }
  .toolbar .tb.left { left: 4px } .toolbar .tb.right { right: 4px }
  .toolbar svg { width: 24px; height: 24px }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 20px; scrollbar-width: none }
  .scroll::-webkit-scrollbar { display: none }
  .context { display: grid; gap: 4px }
  .context .story { font-size: 12px; line-height: 16px; color: var(--muted) }
  .context .ep { font-size: 14px; line-height: 20px; font-weight: 600 }
  .group { display: grid; gap: 12px }
  .card.expandable { cursor: pointer }
  .detail { padding-top: 16px; gap: 14px }
  .sec { display: grid; gap: 4px }
  .sec .label { font-size: 12px; line-height: 18px; color: var(--muted); font-weight: 500 }
  .sec .orig { font-size: 15px; line-height: 22px; color: var(--foreground) }
  .sec .sample { font-size: 16px; line-height: 24px; font-weight: 600 }
  .icons { margin-top: 6px }
  .stack { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column }
  .toast-layer { position: absolute; left: 0; right: 0; top: 0; height: 72px; overflow: hidden; pointer-events: none; z-index: 3; display: flex; justify-content: center; align-items: flex-start; padding-top: 10px }
  .toast { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--surface); color: var(--foreground); font-size: 16px; line-height: 20px; box-shadow: 0 1px 2px #0000000f, 0 6px 20px #0000001a; transform: translateY(-140%); opacity: 0; transition: transform .16s cubic-bezier(.4,0,1,1), opacity .12s linear }
  .toast.in { transform: translateY(0); opacity: 1; transition: transform .42s cubic-bezier(.18,.9,.28,1.18), opacity .12s linear }
  .toast svg { width: 16px; height: 16px }
  .toast.saved svg { color: var(--accent); fill: var(--accent) }
  .toast.unsaved svg { color: var(--muted); fill: none }
  @media(prefers-color-scheme:dark){ .toast { box-shadow: 0 1px 2px #00000066, 0 6px 20px #00000080 } }
  .foot { flex-shrink: 0; padding: 12px 24px 34px; display: grid; gap: 12px }
  .foot .next { display: grid; gap: 4px }
  .foot .next-label { font-size: 12px; line-height: 16px; color: var(--muted) }
  .foot .next-title { font-size: 16px; line-height: 24px; font-weight: 600 }
  .foot .next-copy { font-size: 14px; line-height: 20px; color: var(--muted); word-break: keep-all }
  .primary { min-height: 48px; border-radius: 999px; background: var(--accent-fill); color: #fff; font-size: 16px; line-height: 24px; font-weight: 600; padding: 12px 24px; display: flex; align-items: center; justify-content: center; width: 100% }
</style>
<header class="sh-bar">
  <b>compare</b>
  <span id="sh-question"></span>
  <label class="sh-control" id="sh-variant-control"><span class="sh-control-label">variant</span><select id="sh-variant"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
</header>
<main class="sh-workspace" data-question="1화를 끝내고 기억해 둘 표현을 읽는 사람. 카드를 누르면 펼쳐진다" data-states="모두 접힘">
  <div class="sh-options">
    <div data-variant="final" data-title="노트 카드와 같은 구성 · 복사·책갈피 아이콘 줄 · 다른 예문 없음"><div class="sh-stage"><div class="screen" id="screen"></div></div></div>
  </div>
</main>
<script>
  document.body.classList.add('sh-vp-390');
  const stage = document.querySelector('.sh-workspace');
  const stateSelect = document.getElementById('sh-state');
  const variantSelect = document.getElementById('sh-variant');
  const variantControl = document.getElementById('sh-variant-control');
  const vpBtn = document.getElementById('sh-vp');
  function fail(message) { const n = document.createElement('p'); n.setAttribute('role','alert'); n.textContent = message; stage.replaceChildren(n); document.querySelectorAll('.sh-bar select, .sh-bar button').forEach(c => c.disabled = true); throw new Error(message); }
  const question = (stage.dataset.question || '').trim();
  if (!question) fail('Name the user situation in data-question.');
  document.getElementById('sh-question').textContent = question;
  const rows = [...stage.querySelectorAll(':scope > .sh-options')];
  if (rows.length !== 1) fail('Use one alternatives row for the current decision.');
  const currentVariants = [...rows[0].children].filter(node => node.matches('[data-variant]'));
  const ids = currentVariants.map(v => v.dataset.variant.trim());
  if (currentVariants.length < 1 || currentVariants.length > 3 || new Set(ids).size !== ids.length || ids.includes('all') || ids.includes('')) fail('The decision needs 1–3 alternatives.');
  currentVariants.forEach((variant, index) => { variant.dataset.variant = ids[index]; const label = document.createElement('div'); label.className = 'sh-variant-label'; label.textContent = variant.dataset.title || variant.dataset.variant; variant.prepend(label); });
  function buildVariants() { variantControl.hidden = currentVariants.length === 1; variantSelect.replaceChildren(); const choices = currentVariants.length > 1 ? [{ id: 'all', title: 'All' }] : []; choices.push(...currentVariants.map(v => ({ id: v.dataset.variant, title: v.dataset.title || v.dataset.variant }))); choices.forEach(c => variantSelect.add(new Option(c.title, c.id))); applyVariant(choices[0].id); }
  function applyVariant(id) { const fallback = currentVariants.length > 1 ? 'all' : currentVariants[0].dataset.variant; const active = [...variantSelect.options].some(o => o.value === id) ? id : fallback; currentVariants.forEach(v => { v.hidden = active !== 'all' && v.dataset.variant !== active; v.querySelector('.sh-variant-label').hidden = active !== 'all'; }); variantSelect.value = active; }
  variantSelect.onchange = () => applyVariant(variantSelect.value);
  const declared = (stage.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
  const currentStates = [...new Set(['Default', ...declared])];
  function buildStates() { stateSelect.innerHTML = ''; currentStates.forEach(name => { const o = document.createElement('option'); o.textContent = name; o.value = name; stateSelect.append(o); }); applyState('Default'); }
  function applyState(name) { const active = currentStates.includes(name) ? name : 'Default'; stage.querySelectorAll('[data-when]').forEach(el => { el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active); }); stateSelect.value = active; if (typeof onState === 'function') onState(active); }
  stateSelect.onchange = () => applyState(stateSelect.value);
  window.comparisonShell = { setState: applyState, getQuestion: () => question, getState: () => stateSelect.value, setVariant: applyVariant, getVariant: () => variantSelect.value };
  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() { VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full')); vpBtn.textContent = 'vp: ' + vp + ' (m)'; vpBtn.classList.toggle('on', vp !== 'full'); }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();
  addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (e.key === 'm') vpBtn.click(); });
  const spark = '<svg class="spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>';
  const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
  const bookmarkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>';
  const items = [
    { id: 'c1', kind: 'learn', situation: '상대의 말을 못 알아들었을 때', en: '<mark>Could</mark> you say <mark>that</mark> again?', ko: '다시 한번 말씀해 주시겠어요?', originalU: '<u>Can</u> you <u>say again</u>?', why: ['정중하게 부탁할 때는 Can보다 Could가 자연스러워요.', 'say 뒤에는 무엇을 다시 말해 달라는지 that을 붙여요.'], sample: 'Sorry, could you say that again? It’s a bit loud in here.', sampleKo: '죄송한데 다시 말씀해 주실래요? 여기가 좀 시끄러워서요.' },
    { id: 'c2', kind: 'guidance', situation: '받은 것을 다른 것으로 바꾸고 싶을 때', en: 'Could I get a hot latte <mark>instead</mark>?', ko: '대신 따뜻한 라테로 받을 수 있을까요?', originalU: '따뜻한 라테로 <u>바꿔</u> 주실 수 있나요?', why: ['instead는 원래 것 대신 다른 것을 원할 때 문장 끝에 붙여요.'], sample: 'This one has sugar. Could I get it without sugar instead?', sampleKo: '이건 설탕이 들었네요. 대신 설탕 없이 받을 수 있을까요?' },
    { id: 'c3', kind: 'learn', situation: '급하다고 알릴 때', en: 'I’m <mark>in a hurry</mark>, so could you make it quick?', ko: '제가 급해서요, 빨리 해 주실 수 있을까요?', originalU: 'I am <u>hurry</u>, so can you make it quick?', why: ['hurry는 명사라 in a hurry로 써야 "급하다"는 뜻이 돼요.'], sample: 'I’m in a hurry. Is the bus coming soon?', sampleKo: '제가 급한데요, 버스가 곧 오나요?' },
  ];
  const expanded = new Set(['c1']);
  const whyLines = c => c.why.map(w => `<p class="why">${w}</p>`).join('');
  const saved = new Set();
  const detail = c => `<div class="sec"><div class="label">내가 쓴 문장</div><p class="orig">${c.originalU}</p></div><div class="sec"><div class="label">이렇게 쓰는 이유</div>${whyLines(c)}</div>`;
  const icons = c => `<div class="icons"><button aria-label="표현 복사">${copyIcon}</button><button aria-label="${saved.has(c.id) ? '저장 취소' : '표현 저장'}" aria-pressed="${saved.has(c.id)}" data-save="${c.id}">${bookmarkIcon}</button></div>`;
  function card(c) {
    const open = expanded.has(c.id);
    return `<div class="card expandable ${c.kind}" role="button" tabindex="0" aria-expanded="${open}" data-toggle="${c.id}" data-component="ExpressionReviewCard"><div class="body"><div class="meta situation">${spark}<span class="grow">${c.situation}</span>${chev}</div><p class="en">${c.en}</p><p class="ko">${c.ko}</p></div><div class="detail">${detail(c)}</div>${icons(c)}</div>`;
  }
  const back = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>';
  const home = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>';
  function render() {
    document.getElementById('screen').innerHTML = `<div class="toolbar"><button class="tb left" aria-label="뒤로 가기">${back}</button>표현 돌아보기<button class="tb right" aria-label="홈으로 이동">${home}</button></div>
      <div class="stack"><div class="toast-layer" aria-live="polite"><div class="toast" id="toast" data-component="Toast">${bookmarkIcon}<span id="toast-text">표현을 저장했어요.</span></div></div>
      <div class="scroll" data-component="EpisodeReviewScreen"><div class="context"><div class="story">잘못 나온 첫 잔</div><div class="ep">1화 · 잘못 나온 첫 잔</div></div>
      <div class="group"><div class="section-head"><h2>기억해 둘 표현</h2></div><div class="list">${items.map(card).join('')}</div></div></div>
      <div class="foot"><div class="next"><div class="next-label">다음 이야기</div><div class="next-title">2화 · 카페에 남겨진 노트</div><div class="next-copy">옆자리 손님이 노트를 두고 갔어요. 주인을 찾아주세요.</div></div><button class="primary" data-component="Button">2화 시작하기</button></div></div>`;
  }
  let toastTimer;
  function announce(isSaved) {
    const t = document.getElementById('toast'); document.getElementById('toast-text').textContent = isSaved ? '표현을 저장했어요.' : '저장을 취소했어요.';
    t.classList.toggle('saved', isSaved); t.classList.toggle('unsaved', !isSaved); t.classList.add('in');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('in'), 2500);
  }
  function onState(name) { expanded.clear(); if (name === 'Default') expanded.add('c1'); render(); }
  stage.addEventListener('click', e => { const b = e.target.closest('[data-save]'); if (b) { e.stopPropagation(); const id = b.dataset.save; const next = !saved.has(id); next ? saved.add(id) : saved.delete(id); document.querySelector('.list').innerHTML = items.map(card).join(''); announce(next); return; }
    const t = e.target.closest('[data-toggle]'); if (!t || e.target.closest('.icons')) return; const k = t.dataset.toggle; expanded.has(k) ? expanded.delete(k) : expanded.add(k); document.querySelector('.list').innerHTML = items.map(card).join(''); });
  buildStates(); buildVariants();
</script>
