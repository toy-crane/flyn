<!--
  comparison shell: a decision layer for one user situation, up to three alternatives.
  Copy of build-prototype/templates/comparison-shell.html. Contract preserved:
  product UI only inside .sh-stage; situation in data-question; 1–3 [data-variant];
  presets in data-states; 390/768 viewports; sticky in-frame bars; project tokens in :root.
-->
<meta charset="utf-8">
<title>Compare · 결말 축하 (Lottie 마크)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--background:#f4f4f6;--foreground:#111114;--surface:#ffffff;--surface-foreground:var(--foreground);--expression:#0f766e;--expression-surface:#e5f3ef;--learn:oklch(0.54 0.19 300);--learn-foreground:oklch(0.9911 0 0);--learn-surface:oklch(0.945 0.022 300);--muted:#74747e;--accent:#0087ff;--accent-fill:#087ff5;--accent-soft:#e0efff;--accent-foreground:#fff;--border:#e3e3e9;--danger:#bd3434;--font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif}
  @media(prefers-color-scheme:dark){:root{--background:#0b0b0d;--foreground:#ffffff;--surface:#1a1a1e;--expression:#76d6c9;--expression-surface:#152f2c;--learn:oklch(0.78 0.15 300);--learn-foreground:oklch(0.21 0.03 300);--learn-surface:oklch(0.27 0.045 300);--muted:#a0a0aa;--border:#303038;--accent-soft:#152b42;--danger:#ff8982}}

  * { box-sizing: border-box }
  body { margin: 0; padding: 0 0 40px; background: var(--background); color: var(--foreground); font-family: var(--font); -webkit-font-smoothing: antialiased }
  .sh-bar { position: sticky; top: 0; z-index: 999; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: #191a1c; color: #d7d7d7; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button { border: 1px solid #3a3d42; background: none; color: inherit; font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer }
  .sh-bar select { width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit; font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer; color-scheme: dark }
  #sh-question { overflow-wrap: anywhere; max-width: 100% }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }
  .sh-workspace { overflow-x: auto }
  .sh-options { display: flex; gap: 16px; justify-content: safe center; align-items: flex-start }
  [data-variant] { flex: 1 0 300px; max-width: 960px; min-width: 0 }
  .sh-variant-label { margin: 12px 16px 0; color: var(--muted); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
  .sh-vp-390 [data-variant] { flex: 0 0 390px }
  .sh-vp-768 [data-variant] { flex: 0 0 768px }
  .sh-vp-390 .sh-stage { max-width: 390px; background: var(--background); border: 10px solid #191a1c; border-radius: 28px; padding: 0; height: min(844px, calc(100dvh - 52px)); overflow: hidden; margin-top: 12px }
  .sh-vp-768 .sh-stage { max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px; padding: 16px; margin-top: 12px }

  /* ── product: 에피소드 결말 ── */
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0 }
  h1,h2,h3,p { margin: 0 }
  svg { flex-shrink: 0 }
  .screen { height: 100%; display: flex; flex-direction: column; position: relative; background: var(--background) }
  .toolbar { height: 44px; margin-top: 54px; display: flex; align-items: center; justify-content: center; position: relative; padding: 0 56px; font-size: 17px; font-weight: 600; flex-shrink: 0 }
  .toolbar .back { position: absolute; left: 4px; top: 0; width: 44px; height: 44px; display: grid; place-items: center }
  .situation { display: flex; gap: 6px; flex-shrink: 0; border-bottom: 1px solid var(--border); background: linear-gradient(var(--accent-soft), var(--accent-soft)) var(--background); padding: 8px 20px; font-size: 14px; line-height: 20px; word-break: keep-all }
  .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; scrollbar-width: none }
  .narration { font-size: 15px; line-height: 23px; color: var(--muted); word-break: keep-all }
  .who { font-size: 12px; line-height: 16px; color: var(--muted); margin-bottom: 4px }
  .bubble { background: var(--surface); border-radius: 18px; padding: 12px 16px; font-size: 17px; line-height: 26px; max-width: 86%; width: max-content }
  .mine { margin-left: auto; background: var(--accent-soft) }
  .bottom { flex-shrink: 0; padding: 8px 20px 34px }

  /* 결말 카드 공통 (RN: rounded-3xl, border accent/15, bg-surface + accent/5 틴트, px-5 pt-5 pb-4, gap-4) */
  .closing { position: relative; overflow: hidden; border-radius: 24px; border: 1px solid color-mix(in srgb, var(--accent) 15%, transparent); background: linear-gradient(color-mix(in srgb, var(--accent) 5%, transparent), color-mix(in srgb, var(--accent) 5%, transparent)) var(--surface); padding: 20px 20px 16px; display: grid; gap: 16px; text-align: center; cursor: pointer }
  .heading { display: grid; justify-items: center; gap: 8px; position: relative; z-index: 1; padding: 4px 0 }
  .kicker { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--accent) }
  .outcome { font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -.3px; word-break: keep-all; max-width: 300px }
  .primary { position: relative; z-index: 2; min-height: 48px; border-radius: 999px; background: var(--accent-fill); color: #fff; font-size: 16px; line-height: 24px; font-weight: 600; padding: 12px 24px; display: flex; align-items: center; justify-content: center; width: 100% }
  .burst { position: absolute; left: 50%; width: 0; height: 0; z-index: 3; pointer-events: none }
  .burst i { position: absolute; left: 0; top: 0; display: block; opacity: 0 }
  .burst i.rect { width: 6px; height: 10px; border-radius: 2px; background: var(--c) }
  .burst i.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c) }
  .burst i.star { width: 10px; height: 10px; background: var(--c); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%) }

  /* A · 지금 (RN 구현 그대로): 체크 메달 280ms 스케일 인, 두 개의 고정 lucide 반짝임, 파랑 조각 18개 1050ms */
  .a .medal-wrap { position: relative; width: 64px; height: 64px; display: grid; place-items: center }
  .a .medal { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-foreground); display: grid; place-items: center; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent) }
  .a .medal svg { width: 24px; height: 24px }
  .a .spark { position: absolute; color: var(--accent); width: 16px; height: 16px; top: 0; right: -16px }
  .a .spark.small { width: 14px; height: 14px; left: -16px; top: auto; bottom: 4px }
  .a .burst { top: 40px }
  .a.play .medal-wrap { animation: a-arrive 280ms cubic-bezier(.23,1,.32,1) both }
  .a.play .burst i { animation: a-confetti 1050ms cubic-bezier(.23,1,.32,1) var(--delay) both }
  @keyframes a-arrive { from { opacity: 0; transform: scale(.95) } to { opacity: 1; transform: scale(1) } }
  @keyframes a-confetti { 0% { opacity: 0; transform: translate(0, 8px) rotate(0) } 12% { opacity: 1 } 58% { opacity: 1; transform: translate(calc(var(--dx) * .72), var(--dy)) rotate(calc(var(--turn) * .6)) } 100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 68px)) rotate(var(--turn)) } }

  /* B · 장면 이모지가 주인공. 순서: 이모지 팝(스프링) → 조각 세 색 → 해냈어요! 팝 → 결과 문장 올라옴. 버튼은 처음부터 누를 수 있다. */
  .b .hero { width: 68px; height: 68px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-size: 36px; line-height: 1 }
  .b .burst { top: 44px }
  .b.play .closing { animation: rise 260ms cubic-bezier(.23,1,.32,1) both }
  .b.play .hero { animation: pop-hero 560ms cubic-bezier(.2,.75,.25,1.4) 40ms both }
  .b.play .kicker { animation: pop-text 340ms cubic-bezier(.2,.75,.25,1.35) 300ms both }
  .b.play .outcome { animation: slide-up 380ms cubic-bezier(.23,1,.32,1) 400ms both }
  .b.play .primary { animation: settle 500ms ease-out 300ms both }
  .b.play .burst i { animation: confetti 1150ms cubic-bezier(.14,.6,.32,1) calc(180ms + var(--delay)) both }

  /* C · 문장이 주인공. 아이콘 없음. 해냈어요! → 결과 문장이 커지며 자리 잡고 그 뒤에서 조각이 터진다. */
  .c .outcome { font-size: 25px; line-height: 33px; letter-spacing: -.5px }
  .c .heading { padding: 14px 0 10px }
  .c .burst { top: 58px }
  .c.play .closing { animation: rise 260ms cubic-bezier(.23,1,.32,1) both }
  .c.play .kicker { animation: pop-text 340ms cubic-bezier(.2,.75,.25,1.35) 60ms both }
  .c.play .outcome { animation: pop-outcome 520ms cubic-bezier(.2,.75,.25,1.3) 160ms both }
  .c.play .primary { animation: settle 500ms ease-out 300ms both }
  .c.play .burst i { animation: confetti 1150ms cubic-bezier(.14,.6,.32,1) calc(240ms + var(--delay)) both }

  /* L · Lottie 마크가 주인공. 원이 스프링으로 튀어나오고 체크가 그려지며, 고리가 퍼지고 그 뒤에서 폭죽 */
  .l .mark { position: relative; width: 72px; height: 72px; display: grid; place-items: center }
  .l .disc { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 14%, transparent) }
  .l .disc svg { width: 32px; height: 32px; stroke: var(--accent-foreground); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round }
  .l .disc path { stroke-dasharray: 30; stroke-dashoffset: 0 }
  .l .ring { position: absolute; inset: 4px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0 }
  .l .burst { top: 46px }
  .l.play .closing { animation: rise 260ms cubic-bezier(.23,1,.32,1) both }
  .l.play .disc { animation: pop-hero 520ms cubic-bezier(.2,.75,.25,1.4) 40ms both }
  .l.play .disc path { animation: draw 360ms cubic-bezier(.4,0,.2,1) 260ms both }
  .l.play .ring { animation: ring 620ms ease-out 360ms both }
  .l.play .kicker { animation: pop-text 340ms cubic-bezier(.2,.75,.25,1.35) 440ms both }
  .l.play .outcome { animation: slide-up 380ms cubic-bezier(.23,1,.32,1) 540ms both }
  .l.play .primary { animation: settle 500ms ease-out 300ms both }
  .l.play .burst i { animation: confetti 1150ms cubic-bezier(.14,.6,.32,1) calc(320ms + var(--delay)) both }
  @keyframes draw { from { stroke-dashoffset: 30 } to { stroke-dashoffset: 0 } }
  @keyframes ring { 0% { opacity: .5; transform: scale(.9) } 100% { opacity: 0; transform: scale(1.9) } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
  @keyframes pop-hero { 0% { opacity: 0; transform: scale(.4) rotate(-10deg) } 60% { opacity: 1; transform: scale(1.14) rotate(3deg) } 100% { opacity: 1; transform: scale(1) rotate(0) } }
  @keyframes pop-text { 0% { opacity: 0; transform: scale(.6) } 70% { opacity: 1; transform: scale(1.08) } 100% { opacity: 1; transform: scale(1) } }
  @keyframes pop-outcome { 0% { opacity: 0; transform: scale(.88) translateY(6px) } 65% { opacity: 1; transform: scale(1.03) translateY(0) } 100% { opacity: 1; transform: scale(1) } }
  @keyframes slide-up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  @keyframes settle { from { opacity: .55 } to { opacity: 1 } }
  @keyframes confetti { 0% { opacity: 0; transform: translate(0, 6px) rotate(0) scale(.6) } 10% { opacity: 1; transform: translate(calc(var(--dx) * .25), calc(var(--dy) * .45)) rotate(calc(var(--turn) * .2)) scale(1) } 55% { opacity: 1; transform: translate(calc(var(--dx) * .8), var(--dy)) rotate(calc(var(--turn) * .6)) } 100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 80px)) rotate(var(--turn)) } }
  @media(prefers-reduced-motion:reduce){ .play .closing, .play .closing * { animation: none !important } .burst { display: none } }
</style>

<header class="sh-bar">
  <b>compare</b>
  <span id="sh-question"></span>
  <label class="sh-control" id="sh-variant-control"><span class="sh-control-label">variant</span><select id="sh-variant"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
</header>

<main class="sh-workspace" data-question="마지막 대사가 오고 결말이 난 직후. Lottie 마크가 주인공인 축하 (카드를 누르면 다시 재생, Lottie 자리는 CSS로 흉내)" data-states="타협 결말">
  <div class="sh-options">
    <div data-variant="l" data-title="Lottie 마크 + 폭죽 · 해냈어요! · 결과 문장"><div class="sh-stage"><div class="screen l" data-kind="l"></div></div></div>
  </div>
</main>

<script>
  document.body.classList.add('sh-vp-390');
  const stage = document.querySelector('.sh-workspace');
  const stateSelect = document.getElementById('sh-state');
  const variantSelect = document.getElementById('sh-variant');
  const variantControl = document.getElementById('sh-variant-control');
  const vpBtn = document.getElementById('sh-vp');
  function fail(message) { const n = document.createElement('p'); n.setAttribute('role','alert'); n.textContent = message; stage.replaceChildren(n); document.querySelectorAll('.sh-bar select, .sh-bar button').forEach(c => c.disabled = true); throw new Error(message); }
  const question = (stage.dataset.question || '').trim();
  if (!question) fail('Name the user situation in data-question.');
  document.getElementById('sh-question').textContent = question;
  const rows = [...stage.querySelectorAll(':scope > .sh-options')];
  if (rows.length !== 1) fail('Use one alternatives row for the current decision.');
  const currentVariants = [...rows[0].children].filter(node => node.matches('[data-variant]'));
  const ids = currentVariants.map(v => v.dataset.variant.trim());
  if (currentVariants.length < 1 || currentVariants.length > 3 || new Set(ids).size !== ids.length || ids.includes('all') || ids.includes('')) fail('The decision needs 1–3 alternatives.');
  currentVariants.forEach((variant, index) => { variant.dataset.variant = ids[index]; const label = document.createElement('div'); label.className = 'sh-variant-label'; label.textContent = variant.dataset.title || variant.dataset.variant; variant.prepend(label); });
  function buildVariants() { variantControl.hidden = currentVariants.length === 1; variantSelect.replaceChildren(); const choices = currentVariants.length > 1 ? [{ id: 'all', title: 'All' }] : []; choices.push(...currentVariants.map(v => ({ id: v.dataset.variant, title: v.dataset.title || v.dataset.variant }))); choices.forEach(c => variantSelect.add(new Option(c.title, c.id))); applyVariant(choices[0].id); }
  function applyVariant(id) { const fallback = currentVariants.length > 1 ? 'all' : currentVariants[0].dataset.variant; const active = [...variantSelect.options].some(o => o.value === id) ? id : fallback; currentVariants.forEach(v => { v.hidden = active !== 'all' && v.dataset.variant !== active; v.querySelector('.sh-variant-label').hidden = active !== 'all'; }); variantSelect.value = active; }
  variantSelect.onchange = () => applyVariant(variantSelect.value);
  const declared = (stage.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
  const currentStates = [...new Set(['Default', ...declared])];
  function buildStates() { stateSelect.innerHTML = ''; currentStates.forEach(name => { const o = document.createElement('option'); o.textContent = name; o.value = name; stateSelect.append(o); }); applyState('Default'); }
  function applyState(name) { const active = currentStates.includes(name) ? name : 'Default'; stage.querySelectorAll('[data-when]').forEach(el => { el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active); }); stateSelect.value = active; renderAll(); }
  stateSelect.onchange = () => applyState(stateSelect.value);
  window.comparisonShell = { setState: applyState, getQuestion: () => question, getState: () => stateSelect.value, setVariant: applyVariant, getVariant: () => variantSelect.value };
  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() { VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full')); vpBtn.textContent = 'vp: ' + vp + ' (m)'; vpBtn.classList.toggle('on', vp !== 'full'); }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();
  addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (e.key === 'm') vpBtn.click(); if (e.key === 'r') replayAll(); });

  // ── 결말 데이터: 성공과 타협 ──
  const endings = {
    'Default': { success: true, outcome: '새 아이스 아메리카노를 받아냈다', narration: '직원이 새 잔을 건넨다. 컵 너머로 얼음이 찰랑인다.', reply: 'Here you go. Sorry again for the mix-up.' },
    '타협 결말': { success: false, outcome: '잘못 나온 커피를 그냥 마시기로 했다', narration: '줄이 길어진다. 컵을 들고 자리로 돌아온다.', reply: 'Sorry, we’re slammed right now. Next time, okay?' },
  };
  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  const lucideSpark = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>';
  const colors = ['var(--accent)', 'var(--learn)', 'var(--expression)'];
  function burst(kind, success) {
    if (kind === 'a') return '<div class="burst" aria-hidden="true">' + Array.from({ length: 18 }, (_, i) => { const d = i % 2 ? -1 : 1; const shape = i % 3 ? 'rect' : 'dot'; const c = i % 3 ? 'var(--accent)' : 'color-mix(in srgb, var(--accent) 50%, transparent)'; return `<i class="${shape}" style="--c:${c};--dx:${d*(35+(i*17)%99)}px;--dy:${-(20+(i*23)%66)}px;--turn:${d*(70+(i*31)%160)}deg;--delay:${(i%4)*22}ms"></i>`; }).join('') + '</div>';
    const n = success ? 26 : 10, spread = success ? 1 : .6;
    return '<div class="burst" aria-hidden="true">' + Array.from({ length: n }, (_, i) => { const d = i % 2 ? -1 : 1; const shape = ['rect','dot','star'][i % 3]; const c = success ? colors[i % 3] : colors[i % 2 ? 0 : 2]; return `<i class="${shape}" style="--c:${c};--dx:${(d*(30+(i*19)%120)*spread).toFixed(0)}px;--dy:${(-(26+(i*29)%80)*spread).toFixed(0)}px;--turn:${d*(90+(i*37)%220)}deg;--delay:${(i%5)*30}ms"></i>`; }).join('') + '</div>';
  }
  function card(kind, e) {
    const kicker = e.success ? '<div class="kicker">해냈어요!</div>' : '';
    let hero = '';
    if (kind === 'a') hero = `<div class="medal-wrap" aria-hidden="true"><div class="medal">${checkSvg}</div><span class="spark">${lucideSpark}</span><span class="spark small">${lucideSpark}</span></div>`;
    if (kind === 'b') hero = '<div class="hero" aria-hidden="true">☕</div>';
    if (kind === 'l') hero = '<div class="mark" aria-hidden="true"><div class="ring"></div><div class="disc"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div></div>';
    return `<div class="closing" data-component="EpisodeClosing" role="group">${burst(kind, e.success)}<div class="heading">${hero}${kicker}<h3 class="outcome">${e.outcome}</h3></div><button class="primary" data-component="Button">표현 돌아보기</button></div>`;
  }
  function screenMarkup(kind, e) {
    return `<div class="toolbar"><button class="back" aria-label="뒤로 가기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>잘못 나온 첫 잔</div>
      <div class="situation" data-component="EpisodeSituationBanner"><span aria-hidden="true">☕</span><span>주문과 다른 커피가 나왔어요. 원하는 커피로 바꿔 보세요.</span></div>
      <div class="chat"><div class="bubble mine">Excuse me, I ordered an iced americano, not a latte.</div><div><div class="who">Owen</div><div class="bubble">${e.reply}</div></div><p class="narration">${e.narration}</p></div>
      <div class="bottom">${card(kind, e)}</div>`;
  }
  function renderAll() {
    const e = endings[stateSelect.value] || endings.Default;
    document.querySelectorAll('.screen').forEach(s => { s.innerHTML = screenMarkup(s.dataset.kind, e); s.classList.remove('play'); void s.offsetWidth; s.classList.add('play'); });
  }
  function replayAll() { renderAll(); }
  stage.addEventListener('click', e => { const c = e.target.closest('.closing'); if (!c || e.target.closest('.primary')) return; const s = c.closest('.screen'); s.classList.remove('play'); void s.offsetWidth; s.classList.add('play'); });
  buildStates(); buildVariants();
</script>
