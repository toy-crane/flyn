<!--
  comparison shell: a decision layer for one user situation, up to three alternatives.
  Copy of build-prototype/templates/comparison-shell.html. Contract preserved:
  product UI only inside .sh-stage; situation in data-question; 1–3 [data-variant];
  presets in data-states; 390/768 viewports; sticky in-frame bars; project tokens in :root.
-->
<meta charset="utf-8">
<title>아이콘 줄이 나타나는 때 (확정안)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--background:#f4f4f6;--foreground:#111114;--surface:#ffffff;--surface-foreground:var(--foreground);--expression:#0f766e;--expression-surface:#e5f3ef;--learn:oklch(0.54 0.19 300);--learn-foreground:oklch(0.9911 0 0);--learn-surface:oklch(0.945 0.022 300);--muted:#74747e;--accent:#0087ff;--accent-fill:#087ff5;--accent-soft:#e0efff;--accent-foreground:#fff;--border:#e3e3e9;--danger:#bd3434;--font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif}
  @media(prefers-color-scheme:dark){:root{--background:#0b0b0d;--foreground:#ffffff;--surface:#1a1a1e;--expression:#76d6c9;--expression-surface:#152f2c;--learn:oklch(0.78 0.15 300);--learn-foreground:oklch(0.21 0.03 300);--learn-surface:oklch(0.27 0.045 300);--muted:#a0a0aa;--border:#303038;--accent-soft:#152b42;--danger:#ff8982}}

  * { box-sizing: border-box }
  body { margin: 0; padding: 0 0 40px; background: var(--background); color: var(--foreground); font-family: var(--font); -webkit-font-smoothing: antialiased }
  .sh-bar { position: sticky; top: 0; z-index: 999; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: #191a1c; color: #d7d7d7; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button { border: 1px solid #3a3d42; background: none; color: inherit; font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer }
  .sh-bar select { width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit; font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer; color-scheme: dark }
  #sh-question { overflow-wrap: anywhere; max-width: 100% }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }
  .sh-workspace { overflow-x: auto }
  .sh-options { display: flex; gap: 16px; justify-content: safe center; align-items: flex-start }
  [data-variant] { flex: 1 0 300px; max-width: 960px; min-width: 0 }
  .sh-variant-label { margin: 12px 16px 0; color: var(--muted); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
  .sh-vp-390 [data-variant] { flex: 0 0 390px }
  .sh-vp-768 [data-variant] { flex: 0 0 768px }
  .sh-vp-390 .sh-stage { max-width: 390px; background: var(--background); border: 10px solid #191a1c; border-radius: 28px; padding: 0; height: min(844px, calc(100dvh - 52px)); overflow: hidden; margin-top: 12px }
  .sh-vp-768 .sh-stage { max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px; padding: 16px; margin-top: 12px }

  /* ── product: 에피소드 화면 ── */
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0 }
  h1,h2,h3,p { margin: 0 }
  svg { flex-shrink: 0 }
  .screen { height: 100%; display: flex; flex-direction: column; position: relative; background: var(--background) }
  .toolbar { height: 44px; margin-top: 54px; display: flex; align-items: center; justify-content: center; position: relative; padding: 0 56px; font-size: 17px; font-weight: 600; flex-shrink: 0 }
  .toolbar .back { position: absolute; left: 4px; top: 0; width: 44px; height: 44px; display: grid; place-items: center }
  .situation { display: flex; gap: 6px; flex-shrink: 0; border-bottom: 1px solid var(--border); background: linear-gradient(var(--accent-soft), var(--accent-soft)) var(--background); padding: 8px 20px; font-size: 14px; line-height: 20px; word-break: keep-all }
  .chat-wrap { position: relative; flex: 1; min-height: 0 }
  .chat { height: 100%; overflow-y: auto; padding: 16px 20px 110px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; scroll-behavior: auto }
  .chat::-webkit-scrollbar { display: none }
  .narration { font-size: 15px; line-height: 23px; color: var(--muted); word-break: keep-all }
  .who { font-size: 12px; line-height: 16px; color: var(--muted); margin-bottom: 4px }
  .bubble { background: var(--surface); border-radius: 18px; padding: 12px 16px; font-size: 17px; line-height: 26px; max-width: 86%; width: max-content; min-height: 50px }
  .mine { margin-left: auto; background: var(--accent-soft) }
  .caret::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-left: 4px; vertical-align: middle; animation: blink 1s infinite }
  @keyframes blink { 50% { opacity: .2 } }
  .typing { display: inline-flex; gap: 4px; padding: 0 2px; align-items: center; height: 26px }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .4; animation: dot 1.1s infinite }
  .typing i:nth-child(2) { animation-delay: .18s } .typing i:nth-child(3) { animation-delay: .36s }
  @keyframes dot { 30% { opacity: 1; transform: translateY(-2px) } }

  /* 아이콘 줄. 자리는 항상 잡아 두고(높이 28 + 위 여백 6), 보이는 것만 바뀐다. 말풍선이 밀리지 않는다. */
  .row { display: flex; margin-top: 6px; margin-left: -6px; height: 28px }
  .row.end { justify-content: flex-end; margin-left: 0; margin-right: -6px }
  .row button { width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); border-radius: 999px }
  .row button + button { margin-left: -4px }
  .row button svg { width: 16px; height: 16px }
  .row button[aria-pressed="true"] { color: var(--accent) } .row button[aria-pressed="true"] svg { fill: currentColor }
  .row button.done { color: var(--success, #2f855a) }
  /* 떠오름: 불투명도 0→1, 4pt 위로, 180ms. 줄 단위로도, 늦게 합류하는 아이콘 하나로도 같은 움직임이다. */
  .rise { opacity: 0; transform: translateY(4px); transition: opacity .18s cubic-bezier(.2,.7,.3,1), transform .18s cubic-bezier(.2,.7,.3,1); pointer-events: none }
  .rise.in { opacity: 1; transform: none; pointer-events: auto }
  .no-motion .rise { transition: none }
  @media(prefers-reduced-motion:reduce){ .rise { transition: none } }

  .composer { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 18px 34px; display: flex; gap: 8px; align-items: flex-end; background: linear-gradient(transparent, var(--background) 30%) }
  .composer .field { flex: 1; min-height: 48px; border: 1px solid var(--border); background: var(--surface); border-radius: 26px; padding: 12px 16px; font-size: 16px; line-height: 24px; color: var(--muted) }
  .composer .send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-foreground); display: grid; place-items: center; margin-bottom: 2px; opacity: .4 }
  .composer .send.stop { opacity: 1 }

  /* AI에게 물어보기 시트 */
  .ask .toolbar { margin-top: 24px }
  .q { font-size: 15px; line-height: 23px; background: var(--accent-soft); border-radius: 16px; padding: 10px 14px; margin-left: auto; max-width: 86%; width: max-content }
  .answer { font-size: 16px; line-height: 25px; word-break: keep-all }
  .answer strong { font-weight: 600 }
</style>

<header class="sh-bar">
  <b>compare</b>
  <span id="sh-question"></span>
  <label class="sh-control" id="sh-variant-control"><span class="sh-control-label">variant</span><select id="sh-variant"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <span class="sh-control-label" id="phase"></span>
  <button id="sh-replay">다시 재생</button>
  <button id="sh-vp">vp: full (m)</button>
</header>

<main class="sh-workspace" data-question="장면이 흐른 뒤 말풍선 아래 아이콘 줄이 언제, 어떻게 나타나는가" data-states="2화 이후 첫 장면,대화 기록 열기,동작 줄이기,AI에게 물어보기">
  <div class="sh-options">
    <div data-variant="a" data-title="다 도착한 뒤 대사마다 차례로 떠오른다 · 1화 첫 장면은 복사 먼저">
      <div class="sh-stage">
        <div class="screen" id="screen" data-component="EpisodeScreen">
          <div class="toolbar"><button class="back" aria-label="뒤로 가기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><span id="title">잘못 나온 첫 잔</span></div>
          <div class="situation" id="situation" data-component="EpisodeSituationBanner"><span aria-hidden="true">☕</span><span>주문과 다른 커피가 나왔어요. 원하는 커피로 바꿔 보세요.</span></div>
          <div class="chat-wrap">
            <div class="chat" id="chat"></div>
            <div class="composer" id="composer" data-component="ComposerSurface"><div class="field">영어나 한국어로 적어 주세요.</div><div class="send" id="send" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  document.body.classList.add('sh-vp-390');
  const stage = document.querySelector('.sh-workspace');
  const stateSelect = document.getElementById('sh-state');
  const variantSelect = document.getElementById('sh-variant');
  const variantControl = document.getElementById('sh-variant-control');
  const vpBtn = document.getElementById('sh-vp');
  function fail(message) { const n = document.createElement('p'); n.setAttribute('role','alert'); n.textContent = message; stage.replaceChildren(n); document.querySelectorAll('.sh-bar select, .sh-bar button').forEach(c => c.disabled = true); throw new Error(message); }
  const question = (stage.dataset.question || '').trim();
  if (!question) fail('Name the user situation in data-question.');
  document.getElementById('sh-question').textContent = question;
  const rows = [...stage.querySelectorAll(':scope > .sh-options')];
  if (rows.length !== 1) fail('Use one alternatives row for the current decision.');
  const currentVariants = [...rows[0].children].filter(node => node.matches('[data-variant]'));
  const ids = currentVariants.map(v => v.dataset.variant.trim());
  if (currentVariants.length < 1 || currentVariants.length > 3 || new Set(ids).size !== ids.length || ids.includes('all') || ids.includes('')) fail('The decision needs 1–3 alternatives.');
  currentVariants.forEach((variant, index) => { variant.dataset.variant = ids[index]; const label = document.createElement('div'); label.className = 'sh-variant-label'; label.textContent = variant.dataset.title || variant.dataset.variant; variant.prepend(label); });
  function buildVariants() { variantControl.hidden = currentVariants.length === 1; variantSelect.replaceChildren(); const choices = currentVariants.length > 1 ? [{ id: 'all', title: 'All' }] : []; choices.push(...currentVariants.map(v => ({ id: v.dataset.variant, title: v.dataset.title || v.dataset.variant }))); choices.forEach(c => variantSelect.add(new Option(c.title, c.id))); applyVariant(choices[0].id); }
  function applyVariant(id) { const fallback = currentVariants.length > 1 ? 'all' : currentVariants[0].dataset.variant; const active = [...variantSelect.options].some(o => o.value === id) ? id : fallback; currentVariants.forEach(v => { v.hidden = active !== 'all' && v.dataset.variant !== active; v.querySelector('.sh-variant-label').hidden = active !== 'all'; }); variantSelect.value = active; }
  variantSelect.onchange = () => applyVariant(variantSelect.value);
  const declared = (stage.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
  const currentStates = [...new Set(['Default', ...declared])];
  function buildStates() { stateSelect.innerHTML = ''; currentStates.forEach(name => { const o = document.createElement('option'); o.textContent = name; o.value = name; stateSelect.append(o); }); applyState('Default'); }
  function applyState(name) { const active = currentStates.includes(name) ? name : 'Default'; stage.querySelectorAll('[data-when]').forEach(el => { el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active); }); stateSelect.value = active; if (typeof onState === 'function') onState(active); }
  stateSelect.onchange = () => applyState(stateSelect.value);
  window.comparisonShell = { setState: applyState, getQuestion: () => question, getState: () => stateSelect.value, setVariant: applyVariant, getVariant: () => variantSelect.value };
  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() { VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full')); vpBtn.textContent = 'vp: ' + vp + ' (m)'; vpBtn.classList.toggle('on', vp !== 'full'); }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();
  addEventListener('keydown', e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (e.key === 'm') vpBtn.click(); });

  // ── 시연 ──
  const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
  const bookmarkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>';
  const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  const regenIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>';
  const chat = document.getElementById('chat'), phase = document.getElementById('phase'), screen = document.getElementById('screen'), send = document.getElementById('send');
  const situation = document.getElementById('situation'), title = document.getElementById('title');
  let run = 0;            // 재생 번호. 상태를 바꾸면 앞 재생을 버린다.
  const STAGGER = 40, CHAR = 14;
  const demo = { charMs: CHAR, phase: '', instant: false, step: false, _next: null, next() { const r = demo._next; demo._next = null; if (r) r(); } };
  window.demo = demo;
  const wait = ms => demo.instant ? Promise.resolve() : demo.step ? new Promise(r => { demo._next = r; }) : new Promise(r => setTimeout(r, ms));
  const alive = id => id === run;
  function setPhase(t) { demo.phase = t; phase.textContent = t; }
  function scrollDown() { chat.scrollTop = chat.scrollHeight; }
  function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function rowEl(align, buttons, opts = {}) {
    // 줄은 처음부터 자리를 잡는다. 보이지 않을 뿐이다.
    const r = el(`<div class="row ${align} ${opts.instant ? 'rise in' : 'rise'}" data-component="MessageActionRow"></div>`);
    buttons.forEach(b => r.append(b));
    return r;
  }
  const copyBtn = (label) => el(`<button aria-label="${label}" data-copy>${copyIcon}</button>`);
  const bookmarkBtn = (late) => el(`<button aria-label="표현 저장" aria-pressed="false" data-bm class="${late ? 'rise' : ''}">${bookmarkIcon}</button>`);
  const regenBtn = () => el(`<button aria-label="다시 받기">${regenIcon}</button>`);

  async function typeInto(node, text, id) {
    node.classList.add('caret');
    if (demo.instant || demo.step) { node.textContent = text; node.classList.remove('caret'); scrollDown(); return alive(id); }
    for (let i = 0; i < text.length; i++) {
      if (!alive(id)) return false;
      node.textContent = text.slice(0, i + 1);
      scrollDown();
      await wait(demo.charMs);
    }
    node.classList.remove('caret');
    return true;
  }

  // 장면 하나: 지문과 대사가 차례로 흐르고, 끝나면 대사 아래 줄이 위에서부터 떠오른다.
  async function streamScene(id, segments, { bookmark, instant }) {
    send.classList.add('stop');
    const rowsMade = [];
    for (const seg of segments) {
      if (seg.who === null) {
        const n = el('<p class="narration"></p>'); chat.append(n);
        if (!(await typeInto(n, seg.text, id))) return [];
        continue;
      }
      const wrap = el(`<div data-component="SceneUtterance"><div class="who">${seg.who}</div><div class="bubble"></div></div>`);
      const bubble = wrap.querySelector('.bubble');
      const buttons = [copyBtn('대사 복사')];
      if (bookmark) buttons.push(bookmarkBtn(false));
      const row = rowEl('start', buttons, { instant });
      wrap.append(row); chat.append(wrap); rowsMade.push(row);
      if (!(await typeInto(bubble, seg.text, id))) return [];
      await wait(120);
    }
    send.classList.remove('stop');
    // 장면이 끝났다. 줄이 대사마다 40ms 간격으로 떠오른다.
    rowsMade.forEach((r, i) => { r.style.transitionDelay = instant ? '0ms' : `${i * STAGGER}ms`; requestAnimationFrame(() => requestAnimationFrame(() => r.classList.add('in'))); });
    return rowsMade;
  }

  function reset(kind) {
    run += 1; chat.replaceChildren(); send.classList.remove('stop');
    screen.classList.toggle('ask', kind === 'ask');
    situation.hidden = kind === 'ask';
    title.textContent = kind === 'ask' ? 'AI에게 물어보기' : (kind === 'later' ? '두 번째 손님' : '잘못 나온 첫 잔');
    return run;
  }

  const OPENING = [
    { who: null, text: '카운터 앞. 방금 받은 컵에서 차가운 물방울이 흘러내린다. 직원은 벌써 다음 손님을 부른다.' },
    { who: 'Owen', text: 'Next! What can I get for you?' },
    { who: 'Owen', text: 'Oh, wait. Was that yours? Is everything okay with it?' },
  ];
  const REPLY = [
    { who: 'Owen', text: 'Oh, sorry about that. Let me fix it for you.' },
    { who: null, text: '오웬이 컵을 받아 들고 머신 쪽으로 돌아선다.' },
  ];
  const EP2 = [
    { who: null, text: '다음 날 아침. 같은 카운터, 같은 직원. 오웬이 먼저 알아본다.' },
    { who: 'Owen', text: 'Hey, you\'re back! Hot latte today?' },
    { who: 'Owen', text: 'Or are you in a hurry again?' },
  ];

  // 1화 첫 장면: 회차가 없으니 복사만 먼저. 첫 메시지를 보내 회차가 생기면 책갈피가 합류한다.
  async function playFirst(instant) {
    const id = reset('first');
    setPhase('첫 장면이 흐르는 중 · 줄 없음');
    const rows = await streamScene(id, OPENING, { bookmark: false, instant });
    if (!alive(id)) return;
    setPhase('첫 장면 끝 · 복사만 떠오름');
    await wait(1600); if (!alive(id)) return;
    // 사용자가 처음 말한다. 이 순간 회차가 생긴다.
    chat.append(el('<div class="bubble mine">Excuse me, I ordered a hot latte, not an iced one.</div>')); scrollDown();
    setPhase('첫 메시지 보냄 · 회차 생김');
    const typing = el('<div><div class="who">Owen</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>');
    chat.append(typing); scrollDown();
    await wait(420); if (!alive(id)) return;
    // 회차가 생겼다는 것을 앱이 알자마자 첫 장면의 복사 옆에 책갈피가 같은 떠오름으로 자리 잡는다.
    rows.forEach((r, i) => { const b = bookmarkBtn(true); r.append(b); b.style.transitionDelay = instant ? '0ms' : `${i * STAGGER}ms`; requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('in'))); });
    setPhase('첫 장면에 책갈피 합류');
    await wait(700); if (!alive(id)) return;
    typing.remove();
    setPhase('답 장면이 흐르는 중 · 줄 없음');
    await streamScene(id, REPLY, { bookmark: true, instant });
    if (!alive(id)) return;
    setPhase('답 장면 끝 · 복사와 책갈피가 함께 떠오름');
  }

  // 2화 이후: 첫 장면도 열 때 저장되므로 복사와 책갈피가 함께 떠오른다.
  async function playLater() {
    const id = reset('later');
    setPhase('첫 장면이 흐르는 중 · 줄 없음');
    await streamScene(id, EP2, { bookmark: true, instant: false });
    if (!alive(id)) return;
    setPhase('장면 끝 · 복사와 책갈피가 함께 떠오름');
  }

  // 대화 기록: 이미 끝난 대화라 줄이 처음부터 서 있다.
  function playHistory() {
    const id = reset('history');
    const add = (segs, bookmark) => segs.forEach(seg => {
      if (seg.who === null) { chat.append(el(`<p class="narration">${seg.text}</p>`)); return; }
      const w = el(`<div><div class="who">${seg.who}</div><div class="bubble">${seg.text}</div></div>`);
      const buttons = [copyBtn('대사 복사')]; if (bookmark) buttons.push(bookmarkBtn(false));
      w.append(rowEl('start', buttons, { instant: true })); chat.append(w);
    });
    add(OPENING, true);
    chat.append(el('<div class="bubble mine">Excuse me, I ordered a hot latte, not an iced one.</div>'));
    add(REPLY, true);
    setPhase('기록 · 애니메이션 없음');
  }

  // AI에게 물어보기: 답이 흐르는 동안 줄이 없고, 끝나면 복사와 다시 받기가 떠오른다.
  async function playAsk() {
    const id = reset('ask');
    chat.append(el('<div class="q">"I ordered a hot latte" 대신 "I ordered hot latte"라고 하면 안 돼요?</div>'));
    const a = el('<div><p class="answer"></p></div>'); const row = rowEl('start', [copyBtn('답변 복사'), regenBtn()]); a.append(row); chat.append(a);
    setPhase('답이 흐르는 중 · 줄 없음');
    send.classList.add('stop');
    const ok = await typeInto(a.querySelector('.answer'), '셀 수 있는 명사라서 관사가 필요해요. 라테 한 잔은 a hot latte, 두 잔이면 two hot lattes예요. 관사를 빼면 원어민에게는 문장이 잠깐 멈칫하게 들려요.', id);
    if (!ok) return;
    send.classList.remove('stop');
    requestAnimationFrame(() => requestAnimationFrame(() => row.classList.add('in')));
    setPhase('답 끝 · 복사와 다시 받기가 떠오름');
  }

  function onState(name) {
    screen.classList.toggle('no-motion', name === '동작 줄이기');
    if (name === '2화 이후 첫 장면') playLater();
    else if (name === '대화 기록 열기') playHistory();
    else if (name === '동작 줄이기') playFirst(true);
    else if (name === 'AI에게 물어보기') playAsk();
    else playFirst(false);
  }
  document.getElementById('sh-replay').onclick = () => onState(stateSelect.value);
  stage.addEventListener('click', e => {
    const c = e.target.closest('[data-copy]'); if (c) { c.classList.add('done'); c.innerHTML = checkIcon; setTimeout(() => { c.classList.remove('done'); c.innerHTML = copyIcon; }, 1500); return; }
    const b = e.target.closest('[data-bm]'); if (b) { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', on ? '저장 취소' : '표현 저장'); }
  });
  buildStates(); buildVariants();
</script>
