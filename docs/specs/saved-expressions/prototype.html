<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               and viewport cycle. Chrome that needs explaining has failed.

  Self-contained by design: no build, no framework, no network.
-->

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  document.body.classList.add('sh-vp-390');
  show(location.hash.slice(1));
</script>

    { type: 'utterance', id: 'u2', who: '미아', text: "Oh no, I'm so sorry about that. Let me remake it for you right away.", meaning: '어머, 정말 죄송해요. 바로 다시 만들어 드릴게요.' },
    { type: 'reply', text: '괜찮아요, 그런데 좀 급해서요.',
      learn: { id: 'c2', kind: 'expression', title: '이럴 때 쓰는 영어 표현', original: '괜찮아요, 그런데 좀 급해서요.', originalMarks: [], fixed: "No worries, but I'm in a bit of a hurry.", fixedMarks: ['No worries,', 'in a bit of a hurry.'], why: "'괜찮아요'는 No worries, '좀 급해요'는 in a bit of a hurry라고 해요.", meaning: '괜찮아요, 그런데 좀 급해서요.' } },
    { type: 'utterance', id: 'u3', who: '미아', text: "Got it. I'll have it ready in two minutes. Sorry again for the mix-up.", meaning: '알겠어요. 2분 안에 준비할게요. 착오가 있어서 다시 한번 죄송해요.' }
  ];
  let saved = [];
  const expanded = new Set();
  const failed = new Set();
  let toastTimer = null;
  const isSaved = ref => saved.some(item => item.ref === ref);
  const mark = (text, marks) => marks.reduce((out, m) => out.replace(m, `<b>${m}</b>`), text);
  const umark = (text, marks) => marks.reduce((out, m) => out.replace(m, `<u>${m}</u>`), text);

  function bookmarkButton(ref) {
    const on = isSaved(ref);
    return `<button type="button" class="bookmark" data-bookmark="${ref}" aria-pressed="${on}" aria-label="${on ? '저장 취소' : '표현 저장'}">${on ? ICON.bookmarkFilled : ICON.bookmark}</button>`;
  }
  function learnSlot(learn) {
    const open = expanded.has(learn.id);
    const fail = failed.has(learn.id) ? `<p class="status-line">표현을 저장하지 못했어요. ${ICON.refresh}</p>` : '';
    if (!open) return `<div class="learn-slot"><div class="note-row"><button type="button" class="note ${learn.kind}" data-expand="${learn.id}" aria-label="${learn.title} 보기">${ICON.spark}<span>${mark(learn.fixed, learn.fixedMarks)}</span>${ICON.down}</button></div>${fail}</div>`.replace('<div class="note-row">', '<div class="note-row">' + bookmarkButton(learn.id));
    return `<div class="learn-slot"><div class="card ${learn.kind}"><div class="head"><h3>${learn.title}</h3>${bookmarkButton(learn.id)}<button type="button" class="bookmark" data-expand="${learn.id}" aria-label="${learn.title} 접기">${ICON.up}</button></div><p class="orig">${umark(learn.original, learn.originalMarks)}</p><p class="fixed">${mark(learn.fixed, learn.fixedMarks)}</p><p class="why">${learn.why}</p><button type="button" class="ask">AI에게 물어보기</button></div>${fail}</div>`;
  }
  function renderChat() {
    const chat = document.getElementById('chat');
    chat.innerHTML = scene.map(part => {
      if (part.type === 'narration') return `<p class="narration">${part.text}</p>`;
      if (part.type === 'utterance') {
        return `<div class="utterance" data-utterance="${part.id}" data-saved="${isSaved(part.id)}"><span class="who">${part.who}</span><div class="bubble-row"><div class="bubble">${part.text}</div>${bookmarkButton(part.id)}</div>${failed.has(part.id) ? `<p class="status-line" style="margin-top:6px">표현을 저장하지 못했어요. ${ICON.refresh}</p>` : ''}</div>`;
      }
      return `<div class="reply">${part.text}</div>${learnSlot(part.learn)}`;
    }).join('');
  }

  function itemFor(ref) {
    for (const part of scene) {
      if (part.type === 'utterance' && part.id === ref) return { ref, kind: 'line', english: part.text, meaning: part.meaning, speaker: part.who };
      if (part.type === 'reply' && part.learn.id === ref) {
        const l = part.learn;
        return { ref, kind: l.kind, english: l.fixed, marks: l.fixedMarks, original: l.original, originalMarks: l.originalMarks, why: l.why };
      }
    }
  }
  function toggleSave(ref) {
    failed.delete(ref);
    if (isSaved(ref)) { saved = saved.filter(item => item.ref !== ref); }
    else if (prototypeShell.getScreen() === 'episode' && prototypeShell.getState() === '저장 실패') { failed.add(ref); }
    else { saved = [itemFor(ref), ...saved]; showToast(); }
    renderChat(); renderList();
  }
  function showToast() {
    const screen = document.querySelector('[data-screen="episode"]');
    screen.querySelector('.toast')?.remove();
    screen.insertAdjacentHTML('beforeend', '<div class="toast" role="status">표현을 저장했어요</div>');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => screen.querySelector('.toast')?.remove(), 2500);
  }

  function renderList() {
    const list = document.getElementById('expression-list');
    list.innerHTML = saved.length ? `<div class="list">${saved.map(item => {
      const meta = `<p class="meta"><span class="pill ${item.kind === 'line' ? '' : 'me'}">${item.kind === 'line' ? item.speaker : '내 표현'}</span>${SOURCE}</p>`;
      const inner = item.kind === 'line'
        ? `${meta}<p class="en">${item.english}</p><p class="ko">${item.meaning}</p>`
        : `${meta}<div class="band"><p class="mine">${umark(item.original, item.originalMarks)}</p></div><p class="en">${mark(item.english, item.marks)}</p><p class="why">${item.why}</p>`;
      return `<div class="row-wrap" data-row="${item.ref}"><button type="button" class="delete" data-delete="${item.ref}" aria-label="삭제" tabindex="-1">삭제</button><div class="row ${item.kind}">${inner}</div></div>`;
    }).join('')}</div>` : '';
    if (prototypeShell.getScreen() === 'expressions') {
      if (!saved.length && prototypeShell.getState() === 'Default') prototypeShell.setState('비어 있음');
      if (saved.length && prototypeShell.getState() === '비어 있음') prototypeShell.setState('Default');
    }
  }

  // 목록 행 밀기: 왼쪽으로 밀면 삭제가 드러난다.
  let swipe = null;
  stage.addEventListener('pointerdown', e => { const row = e.target.closest('.row-wrap'); if (row && !e.target.closest('.delete')) swipe = { row, x: e.clientX }; });
  stage.addEventListener('pointermove', e => { if (!swipe) return; const dx = e.clientX - swipe.x; if (dx < -30) { swipe.row.classList.add('open'); swipe = null; } else if (dx > 30) { swipe.row.classList.remove('open'); swipe = null; } });
  stage.addEventListener('pointerup', () => { swipe = null; });

  stage.addEventListener('click', e => {
    const t = e.target;
    const bm = t.closest('[data-bookmark]'); if (bm) { toggleSave(bm.dataset.bookmark); return; }
    const ex = t.closest('[data-expand]'); if (ex) { const id = ex.dataset.expand; expanded.has(id) ? expanded.delete(id) : expanded.add(id); renderChat(); return; }
    const del = t.closest('[data-delete]'); if (del) { saved = saved.filter(item => item.ref !== del.dataset.delete); renderChat(); renderList(); return; }
    if (t.closest('[data-retry]')) { prototypeShell.setState('Default'); renderList(); return; }
    const a = t.closest('a[href^="#"]'); if (a) { const dest = a.getAttribute('href').slice(1); if (!screens.some(s => s.dataset.screen === dest)) e.preventDefault(); }
  });

  const shellSetState = prototypeShell.setState;
  prototypeShell.setState = name => { shellSetState(name); if (prototypeShell.getScreen() === 'expressions' && name === 'Default') renderList(); };
  stateSelect.addEventListener('change', () => { if (prototypeShell.getScreen() === 'expressions' && stateSelect.value === 'Default') renderList(); });
  screenSelect.addEventListener('change', renderList);
  addEventListener('hashchange', () => setTimeout(renderList));
  saved = ['c1', 'c2', 'u2'].map(itemFor);
  renderChat(); renderList();
</script>
