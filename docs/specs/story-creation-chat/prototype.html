<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               and viewport cycle.

  Self-contained by design: no build, no framework, no network.
-->

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
    current.dispatchEvent(new CustomEvent('statechange', { detail: active }));
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
  });
</script>

    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
    compass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M8 3v16"/></svg>',
    sparkle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>',
    cell: '<svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="4.5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="9" y="3" width="3" height="9" rx=".8"/><rect x="13.5" y="0" width="3" height="12" rx=".8"/></svg>',
    wifi: '<svg viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.5a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6zM4.7 7.6l1.2 1.2a3 3 0 0 1 4.2 0l1.2-1.2a4.7 4.7 0 0 0-6.6 0zM2.2 5.1l1.2 1.2a6.5 6.5 0 0 1 9.2 0l1.2-1.2a8.2 8.2 0 0 0-11.6 0zM0 2.7l1.2 1.2a9.9 9.9 0 0 1 13.6 0L16 2.7a11.7 11.7 0 0 0-16 0z"/></svg>',
    battery: '<svg class="battery" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>'
  };
  const statusbar = `<div class="statusbar" aria-hidden="true"><span>9:41</span><div class="island"></div><div class="signals">${icon.cell}${icon.wifi}${icon.battery}</div></div>`;
  const tabbar = active => `<nav class="tabbar" data-component="NativeTabs">
      <div class="tab${active === 'home' ? ' on' : ''}">${icon.home}<span>홈</span></div>
      <div class="tab${active === 'browse' ? ' on' : ''}">${icon.compass}<span>탐색</span></div>
      <div class="tab${active === 'stories' ? ' on' : ''}">${icon.book}<span>스토리</span></div>
    </nav>`;

  // ── 탐색 ──
  const browse = screens.find(s => s.dataset.screen === 'browse');
  const row = s => `<button class="row" data-component="StoryRow"><div class="cover${s.mine ? '' : ' pic'}"></div><div class="row-text"><strong>${escapeHTML(s.title)}</strong><span>${escapeHTML(s.hook)}</span></div>${icon.chevron}</button>`;
  const FILTERS = [{ id: 'all', label: '전체' }, { id: 'mine', label: '내 스토리' }];
  let made = false;
  let filter = 'all';
  function browseList() {
    const mine = made ? [{ ...STORY, mine: true }] : [];
    const items = filter === 'mine' ? mine : [...mine, ...OFFICIAL];
    if (items.length === 0) return `<div class="empty" data-component="EmptyState">${icon.sparkle}<p>아직 내 스토리가 없어요.</p><button class="primary" data-component="Button" data-open-create>스토리 만들기</button></div>`;
    return `<div class="list">${items.map(row).join('')}</div>`;
  }
  function renderBrowse() {
    browse.innerHTML = `<div class="screen">
      ${statusbar}
      <div class="toolbar" data-component="NativeStackHeader"><h2>탐색</h2>
        <div class="toolbar-right"><button class="icon-action" aria-label="스토리 만들기" data-component="Stack.Toolbar.Button" data-open-create>${icon.plus}</button></div>
      </div>
      <div class="body">
        <div class="chips" role="group" aria-label="스토리 필터" data-component="new:FilterChips">${FILTERS.map(f => `<button aria-pressed="${f.id === filter}" data-filter="${f.id}">${f.label}</button>`).join('')}</div>
        ${browseList()}
      </div>
      ${tabbar('browse')}
      <div class="home-indicator"></div>
    </div>`;
    browse.querySelectorAll('[data-open-create]').forEach(b => b.onclick = () => { resetCreate(); show('create'); });
    browse.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { filter = b.dataset.filter; renderBrowse(); });
  }
  browse.addEventListener('statechange', e => { made = e.detail === '만든 뒤'; filter = 'all'; renderBrowse(); });
  renderBrowse();

  // ── 스토리 만들기 ──
  const create = screens.find(s => s.dataset.screen === 'create');
  create.innerHTML = `<div class="screen">
      ${statusbar}
      <div class="toolbar" data-component="NativeStackHeader">
        <button class="back" aria-label="뒤로 가기" id="create-back">${icon.back}</button>
        <h2>스토리 만들기</h2>
      </div>
      <div class="chat-body" id="create-chat" data-component="ChatPanel"></div>
      <div class="episode-bottom" data-component="ComposerSurface">
        <form class="composer" id="create-form">
          <textarea id="create-input" rows="1" aria-label="답장" placeholder="편하게 적어 주세요."></textarea>
          <button class="send" id="create-send" aria-label="보내기">${icon.up}</button>
        </form>
      </div>
      <div class="home-indicator"></div>
    </div>`;
  const chat = document.getElementById('create-chat');
  const input = document.getElementById('create-input');
  const send = document.getElementById('create-send');
  let step = 0;
  let busy = false;

  const aiTurn = parts => `<div class="turn"><div class="answer" data-component="MarkdownAnswer">${parts.map(p => `<p>${escapeHTML(p)}</p>`).join('')}</div></div>`;
  const userTurn = text => `<div class="turn user-turn"><div class="user-bubble" data-component="UserMessage">${escapeHTML(text)}</div></div>`;
  const waitingTurn = `<div class="turn" data-waiting><div class="waiting" data-component="WaitingAnswer" role="status" aria-label="답변을 준비하고 있어요."><i></i><i></i><i></i></div></div>`;
  const storyCard = story => `<div class="turn"><div class="story-card" data-component="new:StoryCard">
      <div class="story-head"><div class="story-cover" data-component="StoryCover"></div><div><h3>${escapeHTML(story.title)}</h3><p>${escapeHTML(story.hook)}</p></div></div>
      <div class="cast"><span class="label">등장인물</span>${story.cast.map(c => `<p>${escapeHTML(c)}</p>`).join('')}</div>
      <ol class="episodes">${story.episodes.map((e, i) => `<li><span class="num">${i + 1}화</span><div><strong>${escapeHTML(e.title)}</strong><span>${escapeHTML(e.preview)}</span></div></li>`).join('')}</ol>
      <button class="primary" data-component="Button" data-play>대화 시작하기</button>
    </div></div>`;

  function scrollChat() { chat.scrollTop = chat.scrollHeight; }
  function prefill(text) { input.value = text || ''; send.disabled = !input.value.trim(); input.style.height = '48px'; input.style.height = Math.min(112, input.scrollHeight) + 'px'; }
  function wireCards() {
    const cards = [...chat.querySelectorAll('.story-card')];
    cards.forEach((card, i) => card.classList.toggle('stale', i !== cards.length - 1));
    const play = chat.querySelector('.story-card:not(.stale) [data-play]');
    if (play) play.onclick = () => startPlay(play);
  }
  function resetCreate() {
    step = 0; busy = false;
    chat.innerHTML = aiTurn(['어떤 상황을 만들고 싶어요?']);
    prefill(SCRIPT[0].user);
    if (prototypeShell.getScreen() === 'create') prototypeShell.setState('Default');
  }
  function jumpToCard() {
    chat.innerHTML = aiTurn(['어떤 상황을 만들고 싶어요?']);
    SCRIPT.slice(0, 3).forEach(s => {
      chat.insertAdjacentHTML('beforeend', userTurn(s.user) + aiTurn(s.ai));
      if (s.card) chat.insertAdjacentHTML('beforeend', storyCard(s.card) + (s.after ? aiTurn(s.after) : ''));
    });
    step = 3; busy = false;
    wireCards(); prefill(SCRIPT[3].user); scrollChat();
  }
  function reply(entry) {
    chat.insertAdjacentHTML('beforeend', waitingTurn); scrollChat();
    setTimeout(() => {
      chat.querySelector('[data-waiting]')?.remove();
      chat.insertAdjacentHTML('beforeend', aiTurn(entry.ai));
      if (entry.card) chat.insertAdjacentHTML('beforeend', storyCard(entry.card));
      if (entry.after) chat.insertAdjacentHTML('beforeend', aiTurn(entry.after));
      wireCards(); busy = false;
      prefill(SCRIPT[step]?.user || '');
      if (!SCRIPT[step]) input.placeholder = '고칠 게 있으면 적어 주세요.';
      scrollChat();
    }, 900);
  }
  document.getElementById('create-form').onsubmit = event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    chat.insertAdjacentHTML('beforeend', userTurn(text));
    prefill(''); input.blur(); scrollChat();
    const entry = SCRIPT[step] || FALLBACK;
    step += 1;
    reply(entry);
  };
  input.oninput = () => prefill(input.value);
  document.getElementById('create-back').onclick = () => { show('browse'); };
  create.addEventListener('statechange', e => { if (e.detail === '카드') jumpToCard(); else if (step > 0) resetCreate(); });

  function startPlay(button) {
    busy = true;
    button.disabled = true;
    button.innerHTML = '<span class="spinner" aria-hidden="true"></span>대화 시작하기';
    button.setAttribute('aria-label', '대화 시작하기, 만드는 중');
    send.disabled = true;
    setTimeout(() => {
      show('browse'); prototypeShell.setState('만든 뒤');
      show('episode');
      resetCreate();
    }, 1500);
  }

  // ── 1화 ──
  const episode = screens.find(s => s.dataset.screen === 'episode');
  episode.innerHTML = `<div class="screen">
      ${statusbar}
      <div class="toolbar" data-component="NativeStackHeader">
        <button class="back" aria-label="뒤로 가기" id="episode-back">${icon.back}</button>
        <h2>1화 · 이름 없는 예약</h2>
      </div>
      <div class="situation" data-component="SituationLine"><span class="emoji" aria-hidden="true">🏨</span><span>예약을 찾아 체크인해 보세요</span></div>
      <div class="chat-body" data-component="ChatPanel">
        <p class="narration" data-component="SceneMessage">베를린 공항에서 바로 온 호텔 로비, 프런트 앞이다. 예약 확인서를 내밀었지만 Lena는 화면을 몇 번이나 새로고침한다.</p>
        <div class="turn"><div class="character" data-component="SceneMessage"><div class="speaker">Lena</div><div class="speech">I’m sorry, I can’t find a reservation under that name.</div></div></div>
        <p class="narration" data-component="SceneMessage">뒤로는 체크인을 기다리는 사람들이 줄을 서 있고, 손에는 무거운 여행 가방이 들려 있다.</p>
      </div>
      <div class="episode-bottom" data-component="ComposerSurface">
        <form class="composer" onsubmit="return false">
          <textarea rows="1" aria-label="답장" placeholder="영어나 한국어로 적어 주세요."></textarea>
          <button class="send" aria-label="보내기" disabled>${icon.up}</button>
        </form>
      </div>
      <div class="home-indicator"></div>
    </div>`;
  document.getElementById('episode-back').onclick = () => { show('browse'); prototypeShell.setState('만든 뒤'); };

  resetCreate();
  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
