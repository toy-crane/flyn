<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->

  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>

<main class="sh-stage"><section data-screen="episode" data-title="대화 중 배울 표현" data-states="문법 오류 · 과거형,철자 오류,낱말 선택,상황에 맞는 표현,오류와 표현 제안 함께,서로 다른 오류 여러 개,직설적인 태도 유지,이미 상황에 적절함,채팅 말투와 표기만 다름,다른 낱말이 되는 철자,한국어 입력,한국어와 영어 혼합,긴 문장 · 오류와 표현 제안,뜻을 파악하기 어려움,확인 중,확인 실패와 재시도"><div class="top"><span class="back">‹</span><b>카페에서 생긴 일</b><span>•••</span></div><div id="conversation"></div><div id="sheet" class="sheet-backdrop" hidden role="dialog" aria-label="AI에게 물어보기"><div class="sheet-head"><b>AI에게 물어보기</b><button id="close-sheet" aria-label="AI에게 물어보기 닫기">닫기</button></div><div class="sheet-source"></div><div class="sheet-history"></div><form class="sheet-form"><input aria-label="궁금한 점" placeholder="궁금한 것을 한국어로 물어보세요"><button aria-label="질문 보내기">↑</button></form></div></section></main>

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>

s": ["wants"], "context": "이동 시간이 다가와 커피를 포장하려 해요", "npc": "Would you like a mug or a paper cup?", "reply": "Sure. One coffee to go."}, {"name": "서로 다른 오류 여러 개", "original": "She want two coffee.", "fixed": "She wants two coffees.", "marked": "She <mark>wants</mark> two <mark>coffees</mark>.", "why": ["She 뒤에는 wants를 써요.", "커피 두 잔을 주문할 때는 coffees처럼 복수형을 써요."], "errors": ["want", "coffee"], "context": "친구 대신 커피 두 잔을 주문해요", "npc": "What would your friend like?", "reply": "Two coffees. Got it.", "entries": [["She <u>want</u>", "She <mark>wants</mark>", "She 뒤에는 wants를 써요."], ["two <u>coffee</u>", "two <mark>coffees</mark>", "커피 두 잔을 주문할 때는 coffees처럼 복수형을 써요."]]}, {"name": "직설적인 태도 유지", "original": "I dont wants a replacement. I want my money back.", "fixed": "I dont want a replacement. I want my money back.", "marked": "I dont <mark>want</mark> a replacement. I want my money back.", "why": ["dont 뒤에는 wants가 아니라 want를 써요."], "errors": ["wants"], "context": "주문한 아이스커피 대신 뜨거운 커피가 나왔어요", "npc": "I can make another one for you.", "reply": "All right. I’ll refund your order."}, {"name": "이미 상황에 적절함", "original": "This is not what I ordered.", "fixed": "", "marked": "", "why": [], "errors": [], "context": "주문한 아이스커피 대신 뜨거운 커피가 나왔어요", "npc": "Here you go. One hot latte!", "reply": "Oh, sorry about that. Let me check your order.", "status": "natural"}, {"name": "채팅 말투와 표기만 다름", "original": "Thanks mia!!! im gonna take it to go 😊", "fixed": "", "marked": "", "why": [], "errors": [], "context": "직원이 주문한 커피를 다시 만들어 줬어요", "npc": "Here’s your iced coffee. Sorry for the wait.", "reply": "You’re welcome. Have a good day!", "status": "natural"}, {"name": "다른 낱말이 되는 철자", "original": "Its too hot to drink.", "fixed": "It's too hot to drink.", "marked": "<mark>It's</mark> too hot to drink.", "why": ["‘너무 뜨거워요’의 주어와 동사는 it is이고, 줄이면 it’s예요."], "errors": ["Its"], "context": "주문한 아이스커피 대신 뜨거운 커피가 나왔어요", "npc": "Here you go. One hot latte!", "reply": "Oh, sorry about that. Let me check your order."}, {"name": "한국어 입력", "original": "이 커피 포장해 주세요.", "fixed": "Can I get this coffee to go?", "marked": "Can I get this coffee <mark>to go</mark>?", "why": ["‘포장해서 가져가다’는 음료를 주문할 때 to go로 말해요."], "errors": [], "context": "커피를 밖으로 가져가려고 해요", "npc": "Would you like a mug or a paper cup?", "reply": "Sure. I’ll get you a paper cup.", "korean": true}, {"name": "한국어와 영어 혼합", "original": "Can I get this coffee 디카페인으로?", "fixed": "Can I get this coffee decaf?", "marked": "Can I get this coffee <mark>decaf</mark>?", "why": ["‘디카페인으로’는 decaf라고 해요."], "errors": [], "context": "저녁이라 카페인 없는 커피를 주문하려 해요", "npc": "What kind of coffee would you like?", "reply": "Yes, we have decaf.", "korean": true}, {"name": "긴 문장 · 오류와 표현 제안", "original": "I ordered an iced latte with oat milk, but you give me a hot one with regular milk, and I want you to make it again.", "fixed": "I ordered an iced oat milk latte, but you gave me a hot one with regular milk, and I want you to remake it.", "marked": "I ordered an <mark>iced oat milk latte</mark>, but you <mark>gave</mark> me a hot one with regular milk, and I want you to <mark>remake it</mark>.", "why": ["이미 받은 음료를 말하므로 give의 과거형 gave를 써요.", "iced oat milk latte는 온도와 우유 종류를 함께 말하는 주문 표현이에요.", "음료를 다시 만들어 달라는 뜻은 remake it으로 말할 수 있어요."], "errors": ["give"], "context": "주문한 아이스커피 대신 뜨거운 커피가 나왔어요", "npc": "Here you go. One hot latte!", "reply": "Oh, sorry about that. Let me check your order."}, {"name": "뜻을 파악하기 어려움", "original": "Coffee before blue same because.", "fixed": "", "marked": "", "why": [], "errors": [], "context": "주문한 아이스커피 대신 뜨거운 커피가 나왔어요", "npc": "Here you go. One hot latte!", "reply": "Sorry, could you tell me what you’d like?", "status": "unclear"}, {"name": "확인 중", "original": "I ask for iced coffee.", "fixed": "", "marked": "", "why": [], "errors": [], "context": "주문한 아이스커피 대신 뜨거운 커피가 나왔어요", "npc": "Here you go. One hot latte!", "reply": "Oh, sorry about that. Let me check your order.", "status": "pending"}, {"name": "확인 실패와 재시도", "original": "I ask for iced coffee.", "fixed": "", "marked": "", "why": [], "errors": [], "context": "주문한 아이스커피 대신 뜨거운 커피가 나왔어요", "npc": "Here you go. One hot latte!", "reply": "Oh, sorry about that. Let me check your order.", "status": "error"}];

const cv=document.getElementById('conversation'),sheet=document.getElementById('sheet');
let activeCase=cases[0]; const saved=new Set(),historyByCase=new Map(),drafts=new Map();
let toastTimer;
function toast(message,icon){const el=cv.querySelector('.status');const frame=document.querySelector('.sh-stage');el.innerHTML=icons[icon]+message;if(icon==='save'&&saved.has(activeCase.name)){el.querySelector('svg').style.fill='var(--learn)';el.querySelector('svg').style.stroke='var(--learn)';}el.style.top=(cv.querySelector('.situation').getBoundingClientRect().bottom-frame.getBoundingClientRect().top+frame.scrollTop+8)+'px';el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;},2500);}
const cardTitle=c=>(c.korean?'이럴 때 쓰는 영어 표현':'더 자연스러운 영어 표현')+(c.why.length>1?' '+c.why.length+'개':'');
const esc=t=>t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const icons={copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V4H4v11h4"/></svg>',save:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'};
function render(){
 activeCase=cases.find(c=>c.name===prototypeShell.getState())||cases[0];const c=activeCase; sheet.hidden=true;
 let original=esc(c.original);for(const word of c.errors)original=original.replace(word,'<u>'+word+'</u>');
 let card='';
 if(c.fixed){const title=cardTitle(c);const entries=c.entries?c.entries.map(e=>'<div class="entry"><p class="original">'+e[0]+'</p><p class="fixed">'+e[1]+'</p><p class="why">'+e[2]+'</p></div>').join(''):'<p class="original">'+original+'</p><p class="fixed">'+c.marked+'</p>'+c.why.map(w=>'<p class="why">'+w+'</p>').join('');
 card='<div class="feedback closed '+(c.korean?'korean':'')+'" data-component="new:CorrectionNote"><button class="collapsed" aria-label="'+title+' 보기"><span>✧</span><div>'+c.marked+'</div><span>⌄</span></button><div class="expanded"><div class="heading">✧ '+title+'<button class="toggle" aria-label="'+title+' 접기">⌃</button></div>'+entries+'<button class="ask" data-component="LinkButton">AI에게 물어보기 ›</button></div></div><div class="actions"><button class="save" aria-label="'+(saved.has(c.name)?'저장 취소':'표현 저장')+'" aria-pressed="'+saved.has(c.name)+'">'+icons.save+'</button><button class="copy" aria-label="표현 복사">'+icons.copy+'</button></div>';
 }else {const labels={natural:'✓ 자연스러운 표현이에요',unclear:'표현의 뜻을 파악하기 어려워요',pending:'<span class="spinner">◌</span> 표현을 확인하고 있어요',error:'표현을 확인하지 못했어요 <button aria-label="표현 다시 확인" class="retry">↻</button>'};card='<div data-component="StatusLine" class="line-status '+(c.status==='error'?'error':'')+'">'+labels[c.status]+'</div>';}

 cv.innerHTML='<p class="situation">'+c.context+'</p><div class="name">Mia</div><div class="bubble" data-component="Typography">'+c.npc+'</div>'+'<div class="bubble user">'+esc(c.original)+'</div>'+card+'<div class="name follow">Mia</div><div class="bubble">'+c.reply+'</div><div class="composer">영어나 한국어로 적어 주세요</div><div class="status" role="status" hidden></div>';
 cv.querySelectorAll('.toggle,.collapsed').forEach(b=>b.onclick=()=>cv.querySelector('.feedback').classList.toggle('closed'));
 const save=cv.querySelector('.save');if(save)save.onclick=()=>{saved.has(c.name)?saved.delete(c.name):saved.add(c.name);save.setAttribute('aria-pressed',saved.has(c.name));save.setAttribute('aria-label',saved.has(c.name)?'저장 취소':'표현 저장');toast(saved.has(c.name)?'표현을 저장했어요':'저장을 취소했어요','save');};
 const copy=cv.querySelector('.copy');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(c.fixed);copy.innerHTML='<svg viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></svg>';copy.setAttribute('aria-label','복사 완료');clearTimeout(copy.resetTimer);copy.resetTimer=setTimeout(()=>{copy.innerHTML=icons.copy;copy.setAttribute('aria-label','표현 복사');},1500);}catch{cv.querySelector('.status').textContent='표현을 복사하지 못했어요';}};
 const ask=cv.querySelector('.ask');if(ask)ask.onclick=()=>{sheet.hidden=false;sheet.querySelector('.sheet-source').classList.toggle('korean',!!c.korean);sheet.querySelector('.sheet-source').innerHTML='<p class="heading">'+cardTitle(c)+'</p><p class="original">'+esc(c.original)+'</p><p class="fixed">'+esc(c.fixed)+'</p>';sheet.querySelector('.sheet-history').innerHTML=historyByCase.get(c.name)||'';sheet.querySelector('input').value=drafts.get(c.name)||'';sheet.scrollIntoView({block:'end'});};
 const retry=cv.querySelector('.retry');if(retry)retry.onclick=()=>{prototypeShell.setState('문법 오류 · 과거형');render();};
 document.querySelector('.sh-stage').scrollTop=0;
}
document.getElementById('close-sheet').onclick=()=>{drafts.set(activeCase.name,sheet.querySelector('input').value);sheet.hidden=true;};
sheet.querySelector('form').onsubmit=e=>{e.preventDefault();const input=sheet.querySelector('input');if(!input.value.trim())return;const body=(historyByCase.get(activeCase.name)||'')+'<div class="bubble user">'+esc(input.value)+'</div><p class="sheet-answer">'+activeCase.why.join(' ')+'</p>';historyByCase.set(activeCase.name,body);sheet.querySelector('.sheet-history').innerHTML=body;input.value='';drafts.delete(activeCase.name);};
document.getElementById('sh-state').addEventListener('change',render);document.getElementById('sh-screen').addEventListener('change',render);render();
</script>
