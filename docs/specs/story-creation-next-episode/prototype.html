<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>플린 · 스토리 만들기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* apps/mobile/global.css의 라이트·다크 토큰. 나머지 시맨틱 색은 기존 앱 표현에 맞춘 임시 매핑. */
  :root {
    --background: #f4f4f6;
    --foreground: #111114;
    --surface: #ffffff;
    --surface-foreground: var(--foreground);
    --expression: #0f766e;
    --expression-surface: #e5f3ef;
    --learn: oklch(0.54 0.19 300);
    --learn-foreground: oklch(0.9911 0 0);
    --learn-surface: oklch(0.945 0.022 300);
    --scene: #3c3c43;
    --cast-1: #b4552f;
    --cast-2: #2f6f4e;
    --cast-3: #8a5a10;
    --cast-4: #a8386a;
    --muted: #77777f;
    --line: #e3e3e8;
    --accent: #0a84ff;
    --accent-foreground: #ffffff;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  .sh-theme-dark {
    --background: #0b0b0d;
    --foreground: #ffffff;
    --surface: #1a1a1e;
    --surface-foreground: var(--foreground);
    --expression: #76d6c9;
    --expression-surface: #152f2c;
    --learn: oklch(0.78 0.15 300);
    --learn-foreground: oklch(0.21 0.03 300);
    --learn-surface: oklch(0.27 0.045 300);
    --scene: #c7c7cc;
    --cast-1: #f0997b;
    --cast-2: #97c459;
    --cast-3: #e0b063;
    --cast-4: #ee93b1;
    --muted: #a0a0aa;
    --line: #33333a;
    --accent: #0a84ff;
    --accent-foreground: #ffffff;
  }

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }

  /* Product pixels */
  .sh-stage { padding: 0; position:relative; }
  .sh-vp-390 .sh-stage, .sh-vp-768 .sh-stage { padding: 0; position:relative; }
  .app-screen { min-height: 100%; display: flex; flex-direction: column; background: var(--background); }
  .app-header { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:62px; padding: 8px 16px; background:var(--background); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .app-header strong { font-size:17px; letter-spacing:-.02em; }
  .icon-btn { width:36px; height:36px; border:0; background:transparent; color:var(--foreground); font-size:27px; line-height:1; cursor:pointer; border-radius:50%; }
  .icon-btn:focus-visible, .choice-btn:focus-visible, .outline button:focus-visible, .composer button:focus-visible, .primary:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .head-spacer { width:36px; }
  .chat-history { flex:1; display:flex; flex-direction:column; gap:17px; padding:20px 18px 26px; min-height:420px; }
  .bubble { max-width:85%; border-radius:18px; padding:10px 14px; line-height:1.53; font-size:16px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .user-row { display:flex; justify-content:flex-end; }
  .user-row .bubble { background:var(--accent); color:var(--accent-foreground); border-bottom-right-radius:6px; }
  .assistant-row { width:100%; font-size:16px; line-height:1.55; overflow-wrap:anywhere; }
  .assistant-row p { margin:0; }
  .choices { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .choice-btn { font:500 14px/1.3 var(--font); color:var(--accent); background:var(--surface); border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line)); border-radius:100px; padding:10px 13px; text-align:left; cursor:pointer; max-width:100%; }
  .choice-btn:hover { background:color-mix(in srgb,var(--accent) 8%,var(--surface)); }
  .choice-btn[disabled] { color:var(--muted); border-color:var(--line); cursor:default; }
  .composer-wrap { position:sticky; bottom:0; z-index:4; padding:10px 12px 14px; background:linear-gradient(to bottom, transparent, var(--background) 20%); }
  .composer { display:flex; align-items:end; gap:8px; padding:6px; background:var(--surface); border:1px solid var(--line); border-radius:26px; box-shadow:0 5px 22px #0000000b; }
  .composer textarea { flex:1; min-width:0; min-height:42px; max-height:112px; resize:vertical; border:0; outline:0; padding:10px 8px; background:transparent; color:var(--foreground); font:16px/1.4 var(--font); }
  .composer textarea::placeholder { color:var(--muted); }
  .composer button { width:40px; height:40px; border:0; border-radius:50%; background:var(--accent); color:white; cursor:pointer; font-size:19px; }
  .composer button:disabled { opacity:.45; cursor:default; }
  .outline { background:var(--surface); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:14px; box-shadow:0 1px 2px #00000009; }
  .outline h2 { margin:0; font-size:17px; line-height:1.4; }
  .outline .hook { color:var(--muted); font-size:13px; line-height:1.5; margin:2px 0 0; }
  .outline-section { border-top:1px solid var(--line); padding-top:12px; }
  .outline-label { display:block; color:var(--muted); font-size:12px; font-weight:600; margin-bottom:6px; }
  .cast-line { display:block; font-size:14px; line-height:1.55; }
  .episode-line { display:grid; grid-template-columns:34px minmax(0,1fr); gap:7px; margin-bottom:11px; }
  .episode-line:last-child { margin-bottom:0; }
  .episode-line .no { font-size:12px; color:var(--muted); font-weight:700; padding-top:2px; }
  .episode-line b { font-size:15px; display:block; }
  .episode-line p { font-size:13px; color:var(--muted); line-height:1.5; margin:2px 0 0; }
  .outline button, .primary { border-radius:14px; padding:12px 14px; border:0; cursor:pointer; font:600 15px var(--font); }
  .outline .add { background:transparent; border:1px solid var(--line); color:var(--foreground); }
  .outline .make, .primary { background:var(--accent); color:#fff; }
  .outline button:disabled { opacity:.45; cursor:default; }
  .after-card { margin:10px 4px 0; font-size:16px; }
  .detail-body { padding:20px; display:flex; flex-direction:column; gap:24px; flex:1; }
  .detail-intro { display:flex; gap:14px; }
  .detail-cover { flex:none; width:92px; height:118px; border-radius:14px; background:linear-gradient(155deg,#2d5b78,#152b3c); display:grid; place-items:center; color:#d6e8f1; font-size:46px; }
  .detail-intro h2 { font-size:20px; margin:0 0 6px; line-height:1.25; }
  .detail-intro p { font-size:14px; line-height:1.45; color:var(--muted); margin:0; }
  .detail-body h3 { font-size:14px; margin:0 0 10px; }
  .detail-list { background:var(--surface); padding:6px 18px; border-radius:16px; }
  .detail-list .episode-line { padding:13px 0; margin:0; border-bottom:1px solid var(--line); }
  .detail-list .episode-line:last-child { border:0; }
  .detail-footer { position:sticky; bottom:0; background:var(--background); padding:12px 22px 18px; }
  .detail-footer button { width:100%; }
  .modal-backdrop { position:fixed; inset:0; background:#0009; display:grid; place-items:center; z-index:30; padding:20px; }
  .sh-vp-390 .modal-backdrop { inset:auto; left:50%; top:52px; transform:translateX(-50%); width:390px; height:min(844px, calc(100dvh - 52px)); border-radius:28px; }
  .sh-vp-768 .modal-backdrop { inset:auto; left:50%; top:52px; transform:translateX(-50%); width:768px; height:calc(100dvh - 52px); border-radius:12px; }
  .modal { width:min(330px,100%); border-radius:18px; background:var(--surface); padding:22px; box-shadow:0 16px 50px #0004; }
  .modal h3 { margin:0 0 18px; font-size:18px; }
  .modal-actions { display:flex; gap:10px; }
  .modal-actions button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--foreground); font:600 15px var(--font); cursor:pointer; }
  .modal-actions .retry { background:var(--accent); color:white; border-color:var(--accent); }
  .browse-body { padding:20px; flex:1; }
  .browse-chips { display:flex; gap:8px; margin-bottom:16px; }
  .browse-chips button { border:1px solid var(--line); background:var(--surface); color:var(--foreground); padding:8px 14px; border-radius:100px; font:500 14px var(--font); }
  .browse-chips button.on { background:var(--foreground); color:var(--background); }
  .browse-row { display:flex; gap:12px; background:var(--surface); border-radius:16px; padding:14px; align-items:center; cursor:pointer; }
  .browse-row .mini-cover { width:55px; height:69px; flex:none; border-radius:10px; background:linear-gradient(155deg,#2d5b78,#152b3c); color:white; display:grid; place-items:center; }
  .browse-row b { font-size:15px; display:block; }
  .browse-row small { font-size:13px; line-height:1.4; color:var(--muted); display:block; margin-top:3px; }
  .browse-empty { min-height:520px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; text-align:center; }
  .browse-empty .empty-mark { width:54px; height:54px; border-radius:20px; background:var(--surface); display:grid; place-items:center; font-size:24px; }
  .browse-empty p { margin:0; color:var(--foreground); font-size:16px; font-weight:600; }
  .browse-empty button { background:var(--accent); color:white; border:0; border-radius:12px; padding:11px 18px; font:600 14px var(--font); cursor:pointer; }
  .browse-footer { position:sticky; bottom:0; padding:10px 14px 20px; background:var(--background); display:flex; justify-content:space-around; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
  @media (min-width:700px) { .app-screen { max-width:560px; margin:auto; width:100%; border-left:1px solid var(--line); border-right:1px solid var(--line); } }
</style>

<body class="sh-vp-390">
<header class="sh-bar">
  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
  <div class="sh-theme" id="sh-theme" role="group" aria-label="theme (t)" hidden>
    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>
</header>

<main class="sh-stage">
  <section data-screen="create" data-title="스토리 만들기" data-states="다음 사건 선택,스토리 카드,한 에피소드 카드,만들기 실패" class="app-screen">
    <header class="app-header" data-component="NavigationHeader"><button class="icon-btn" type="button" id="create-back" aria-label="뒤로 가기">‹</button><strong>스토리 만들기</strong><span class="head-spacer"></span></header>
    <div class="chat-history" id="chat-history" aria-live="polite" data-component="ChatPanel"></div>
    <div class="composer-wrap"><form class="composer" id="composer" data-component="ComposerSurface"><textarea id="composer-input" rows="1" aria-label="메시지 입력" placeholder="메시지를 입력하세요"></textarea><button type="submit" id="send" aria-label="메시지 보내기">↑</button></form></div>
  </section>
  <section data-screen="browse" data-title="탐색" class="app-screen">
    <header class="app-header" data-component="NavigationHeader"><span class="head-spacer"></span><strong>탐색</strong><button class="icon-btn" id="browse-create" type="button" aria-label="스토리 만들기">＋</button></header>
    <div class="browse-body" data-component="BrowseScreen"><div class="browse-chips" data-component="TagGroup"><button class="on" type="button">전체</button><button type="button">내 스토리</button></div><div class="browse-row" id="browse-story" role="button" tabindex="0" hidden><div class="mini-cover">✦</div><div><b>영어로 시작하는 첫 출근</b><small>새 회사에서 나를 소개하고 동료에게 먼저 말을 걸어 봐요.</small></div></div><div class="browse-row" id="browse-official" role="button" tabindex="0" style="margin-top:10px"><div class="mini-cover">☕</div><div><b>잘못 나온 첫 잔</b><small>주문과 다른 커피가 나왔어요. 바쁜 직원에게 바꿔 달라고 말해 봐요.</small></div></div><div class="browse-empty" id="browse-empty" hidden><div class="empty-mark">✦</div><p>아직 내 스토리가 없어요</p><button id="browse-empty-create" type="button">스토리 만들기</button></div></div>
    <div class="browse-footer"><span>홈</span><span>탐색</span><span>스토리</span><span>노트</span></div>
  </section>
  <section data-screen="detail" data-title="스토리 상세" class="app-screen">
    <header class="app-header" data-component="NavigationHeader"><button class="icon-btn" type="button" id="detail-back" aria-label="뒤로 가기">‹</button><strong>스토리</strong><span class="head-spacer"></span></header>
    <div class="detail-body" id="detail-body" data-component="StoryDetailScreen"></div>
    <div class="detail-footer"><button class="primary" type="button" id="start-play">대화 시작하기</button></div>
  </section>
</main>

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));

  // 모두 가짜 대화와 가짜 데이터다. 모델, 저장소, 앱 경로에는 연결하지 않는다.
  const historyEl = document.getElementById('chat-history');
  const inputEl = document.getElementById('composer-input');
  const sendEl = document.getElementById('send');
  let mode = 'opening';
  let messages = [];
  let episodes = [];
  let pending = '';
  let userChoice = '';
  let choiceIndex = -1;
  let failed = false;
  let saved = false;
  let browseFilter = "all";
  let detailSource = "made";
  const first = { number: 1, title:'첫 팀 회의', preview:'팀장이 소개를 부탁했어요. 긴장되지만 내 경력과 맡을 일을 말해 보려 해요.' };
  const options = [
    { label:'점심시간에 동료와 친해지기', key:'lunch' },
    { label:'첫 업무에서 도움 요청하기', key:'help' },
    { label:'이대로 진행하기', key:'finish' }
  ];
  const addOptions = [
    { label:'다음 회의에서 의견 말하기', key:'meeting' },
    { label:'새 동료에게 첫 업무 묻기', key:'help' },
    { label:'지금 카드로 돌아가기', key:'finish' }
  ];
  const esc = value => String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  const say = (role,text) => messages.push({role,text});
  function reset(){ mode='opening'; messages=[]; episodes=[{...first}]; pending=''; failed=false; choiceIndex=-1; say('assistant','어떤 상황에서 영어로 대화해 보고 싶으세요?'); render(); prototypeShell.setState('Default'); }
  function baseChoice(){
    messages=[]; episodes=[{...first}]; pending=''; failed=false;
    say('assistant','어떤 상황에서 영어로 대화해 보고 싶으세요?');
    say('user','해외 회사 첫 출근을 연습하고 싶어요.');
    say('assistant','첫 팀 회의에서 자기소개하는 장면은 어때요? 팀장 Alex가 소개를 부탁하고, 앞으로 맡을 일과 잘 부탁한다는 말을 해 보는 거예요.');
    say('user','좋아요. 경력직인데 영어가 서툴러서 좀 긴장돼요.');
    say('choices','경력은 있지만 영어로 소개하는 게 긴장되는 상황이군요. Alex가 소개를 부탁한 순간부터 시작할게요. 같은 회사에서 이어서 겪을 일도 골라 볼까요? 에피소드 하나만 만들어도 좋아요.');
    choiceIndex=messages.length-1; mode='choice';
  }
  function secondEpisode(key,detail){
    const number=episodes.length+1;
    if(key==='lunch') return {number,title:'말없는 점심시간',preview:detail?.includes('취미') ? '동료와 마주 앉았어요. 취미 이야기로 먼저 말을 걸어 보려 해요.' : '동료와 마주 앉았어요. 먼저 말을 걸어 보려 해요.'};
    if(key==='help') return {number,title:'첫 업무에서 도움 요청',preview:'맡은 일의 시작 방법을 모르겠어요. 동료에게 도움을 요청해 보려 해요.'};
    if(key==='meeting') return {number,title:'다음 회의에서 의견 말하기',preview:'팀 회의에서 내 생각을 말할 차례가 왔어요. 긴장되지만 의견을 전해 보려 해요.'};
    return {number,title:(detail||userChoice).includes('전화')?'고객과 첫 통화':(detail||userChoice).includes('휴가')?'휴가 물어보기':'다음 사건',preview:detail || userChoice};
  }
  function showChoice(isAdd=false){
    messages.push({role:'choices',text:isAdd ? '같은 회사에서 다음에 겪을 일을 골라 볼까요? 직접 적어도 좋아요.' : '같은 회사에서 이어서 겪을 일도 골라 볼까요? 에피소드 하나만 만들어도 좋아요.',isAdd});
    choiceIndex=messages.length-1; mode=isAdd?'add-choice':'choice';
    prototypeShell.setState('다음 사건 선택'); render();
  }
  function choose(key,label){
    if(!(mode==='choice'||mode==='add-choice')) return;
    const wasAdd=mode==='add-choice';
    if(messages[choiceIndex]) messages[choiceIndex].resolved=true;
    say('user',label);
    if(key==='finish'){ showCard(); return; }
    if(key==='custom' && /고 싶/.test(label) && label.length>15){ episodes.push(secondEpisode('custom',label)); showCard(); return; }
    pending=key; userChoice=label; mode='details';
    if(key==='lunch') say('assistant','점심시간에 옆자리 동료 Jamie와 식사하면서 이야기하는 장면을 더해 볼게요. 처음 만난 동료와 어떤 이야기를 해 보고 싶어요?');
    else if(key==='help') say('assistant','첫 업무에서 동료에게 도움을 요청하는 장면을 더해 볼게요. 어떤 일을 맡았고 무엇이 막혔나요?');
    else if(key==='meeting') say('assistant','다음 회의에서 의견을 말하는 장면을 더해 볼게요. 어떤 이야기를 꺼내고 싶나요?');
    else say('assistant','그 장면에서 누구와 무슨 일을 하려는지 조금 더 말해 주세요.');
    prototypeShell.setState('Default'); render();
  }
  function showCard(){ messages.push({role:'card',snapshot:episodes.map(e=>({...e}))}); mode='card'; prototypeShell.setState(episodes.length===1?'한 에피소드 카드':'스토리 카드'); render(); }
  function cardMarkup(snapshot, active){
    const lunch = snapshot.some(e=>e.title==='말없는 점심시간');
    const phone = snapshot.some(e=>e.title==='고객과 첫 통화');
    const cast = lunch ? '<span class="cast-line">Jamie · 20대 동료. 먼저 말을 걸면 조심스럽게 대답한다.</span>' : phone ? '<span class="cast-line">Taylor · 30대 고객. 첫 통화에서 필요한 정보를 차분히 묻는다.</span>' : '';
    const hook = lunch ? '새 회사에서 나를 소개하고 동료에게 먼저 말을 걸어 봐요.' : phone ? '새 회사에서 나를 소개하고 고객과 첫 통화를 해 봐요.' : snapshot.length>1 ? '새 회사에서 나를 소개하고 다음 일도 내 말로 풀어 봐요.' : '새 회사에서 나를 소개해 봐요.';
    return `<div class="outline" data-component="StoryOutlineCard"><div><h2>영어로 시작하는 첫 출근</h2><p class="hook">${hook}</p></div><div class="outline-section"><span class="outline-label">인물</span><span class="cast-line">Alex · 40대 팀장. 내 소개를 듣고 필요한 일을 묻는다.</span>${cast}</div><div class="outline-section">${snapshot.map(e=>`<div class="episode-line"><span class="no">${e.number}화</span><div><b>${esc(e.title)}</b><p>${esc(e.preview)}</p></div></div>`).join('')}</div>${active?`<button class="add" data-component="Button" data-action="add" type="button" ${snapshot.length>=5?'disabled':''}>＋ 에피소드 추가하기</button><button class="make" data-component="Button" data-action="make" type="button">스토리 만들기</button>`:''}</div>${active?'<p class="after-card">바꾸고 싶은 부분이 있으면 말해 주세요.</p>':''}`;
  }
  function render(){
    const lastCard=messages.findLastIndex(m=>m.role==='card');
    historyEl.innerHTML=messages.map((m,i)=>{
      if(m.role==='user') return `<div class="user-row" data-component="UserMessage"><div class="bubble">${esc(m.text)}</div></div>`;
      if(m.role==='card') return `<div class="assistant-row">${cardMarkup(m.snapshot,i===lastCard&&mode==='card')}</div>`;
      if(m.role==='choices'){
        const opts=m.isAdd?addOptions:options;
        return `<div class="assistant-row" data-component="AssistantMessage"><p>${esc(m.text)}</p><div class="choices" role="group" aria-label="다음 에피소드 선택">${opts.map(o=>`<button type="button" class="choice-btn" data-component="new:EpisodeChoice" data-choice="${o.key}" data-label="${esc(o.label)}" ${m.resolved?'disabled':''}>${esc(o.label)}</button>`).join('')}</div></div>`;
      }
      return `<div class="assistant-row" data-component="AssistantMessage"><p>${esc(m.text)}</p></div>`;
    }).join('');
    inputEl.disabled=mode==='creating'; sendEl.disabled=mode==='creating';
    requestAnimationFrame(()=>historyEl.lastElementChild?.scrollIntoView({block:'end'}));
  }
  function sendText(text){
    const raw=text.trim(); if(!raw||mode==='creating') return;
    inputEl.value='';
    if(mode==='opening'){
      say('user',raw);
      if(/하나만|한 에피소드만|그냥 만들어/.test(raw)){ say('assistant','첫 팀 회의에서 자기소개하는 장면으로 잡을게요.'); showCard(); return; }
      say('assistant','첫 팀 회의에서 자기소개하는 장면은 어때요? 팀장 Alex가 소개를 부탁하고, 앞으로 맡을 일과 잘 부탁한다는 말을 해 보는 거예요.'); mode='clarify'; prototypeShell.setState('Default'); render(); return;
    }
    if(mode==='clarify'){
      say('user',raw);
      if(/하나만|그냥 만들어/.test(raw)){showCard();return;}
      say('assistant','경력은 있지만 영어로 소개하는 게 긴장되는 상황이군요. Alex가 소개를 부탁한 순간부터 시작할게요.'); showChoice(); return;
    }
    if(mode==='choice'||mode==='add-choice'){
      if(/^(이대로 진행하기|여기까지|그냥 만들어|하나만)/.test(raw)){choose('finish',raw);return;}
      choose('custom',raw); return;
    }
    if(mode==='details'){
      say('user',raw);
      episodes.push(secondEpisode(pending,raw));
      say('assistant',pending==='lunch'?'식사를 시작했는데 아직 서로 말이 없는 순간에, 먼저 취미 이야기를 꺼내 보는 장면으로 잡을게요.':'말씀한 내용을 다음 에피소드의 시작 상황으로 잡을게요.');
      pending=''; showCard(); return;
    }
    if(mode==='card'){
      say('user',raw);
      if(/빼|삭제/.test(raw)&&episodes.length>1){episodes.pop();say('assistant','마지막 에피소드를 뺐어요.');}
      else {episodes.at(-1).preview=raw;say('assistant','말씀하신 내용으로 마지막 에피소드의 상황을 고쳤어요.');}
      showCard();
    }
  }
  document.getElementById('composer').addEventListener('submit',e=>{e.preventDefault();sendText(inputEl.value)});
  inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText(inputEl.value)}});
  historyEl.addEventListener('click',e=>{
    const choice=e.target.closest('[data-choice]'); if(choice){choose(choice.dataset.choice,choice.dataset.label);return;}
    const action=e.target.closest('[data-action]'); if(!action)return;
    if(action.dataset.action==='add'&&mode==='card'&&episodes.length<5){say('user','에피소드를 하나 더 넣고 싶어요.');showChoice(true);}
    if(action.dataset.action==='make'&&mode==='card'){mode='creating';saved=true;detailSource='made';render();renderDetail();renderBrowse();prototypeShell.showScreen('detail');}
  });
  function renderDetail(){
    if(detailSource==='official'){document.getElementById('detail-body').innerHTML='<div class="detail-intro"><div class="detail-cover" role="img" aria-label="커피 스토리 표지">☕</div><div><h2>잘못 나온 첫 잔</h2><p>주문한 것과 다른 커피가 나왔어요. 바쁜 직원에게 바꿔 달라고 말해 봐요.</p></div></div><div><h3>에피소드</h3><div class="detail-list"><div class="episode-line"><span class="no">1화</span><div><b>다른 커피가 나왔어요</b><p>직원은 벌써 다음 손님을 부르고 있어요.</p></div></div></div></div>';return;}
    document.getElementById('detail-body').innerHTML=`<div class="detail-intro"><div class="detail-cover" role="img" aria-label="스토리 표지 그림 자리">✦</div><div><h2>영어로 시작하는 첫 출근</h2><p>낯선 회사에서 처음 만난 사람들과 영어로 대화해 봐요. ${episodes.length>1?'팀장 앞에서 나를 소개하고, 다음에 겪을 일도 내 말로 풀어갑니다.':'팀장 앞에서 내 경력과 맡을 일을 소개해 봅니다.'}</p></div></div><div><h3>에피소드</h3><div class="detail-list">${episodes.map(e=>`<div class="episode-line"><span class="no">${e.number}화</span><div><b>${esc(e.title)}</b><p>${esc(e.preview)}</p></div></div>`).join('')}</div></div>`;
  }
  document.getElementById('detail-back').onclick=()=>{reset();prototypeShell.showScreen('browse');};
  document.getElementById('create-back').onclick=()=>{reset();prototypeShell.showScreen('browse');};
  document.getElementById('browse-create').onclick=()=>{reset();prototypeShell.showScreen('create');};
  document.getElementById('browse-empty-create').onclick=()=>{reset();prototypeShell.showScreen('create');};
  document.getElementById('browse-story').onclick=()=>{if(saved){detailSource='made';renderDetail();prototypeShell.showScreen('detail');}};
  document.getElementById('browse-official').onclick=()=>{detailSource='official';renderDetail();prototypeShell.showScreen('detail');};
  document.querySelectorAll('.browse-chips button').forEach((button,index)=>{button.onclick=()=>{browseFilter=index?'mine':'all';renderBrowse();};});
  function renderBrowse(){document.querySelectorAll('.browse-chips button').forEach((button,index)=>button.classList.toggle('on',(index===1)===(browseFilter==='mine')));document.getElementById('browse-story').hidden=!saved;document.getElementById('browse-official').hidden=browseFilter==='mine';document.getElementById('browse-empty').hidden=browseFilter!=='mine'||saved;document.querySelector('#browse-story small').textContent=episodes.some(e=>e.title==='말없는 점심시간')?'새 회사에서 나를 소개하고 동료에게 먼저 말을 걸어 봐요.':episodes.length>1?'새 회사에서 나를 소개하고 다음 일도 내 말로 풀어 봐요.':'새 회사에서 나를 소개해 봐요.';}
  renderBrowse();
  document.getElementById('start-play').onclick=()=>{alert('대화 시작은 이 프로토타입의 범위 밖이에요.');};
  document.getElementById('sh-state').addEventListener('change',e=>{
    if(prototypeShell.getScreen()!=='create')return;
    const name=e.target.value;
    if(name==='Default'){reset();return;}
    baseChoice();
    if(name==='다음 사건 선택'){prototypeShell.setState(name);render();return;}
    if(name==='스토리 카드'||name==='만들기 실패'){
      messages[choiceIndex].resolved=true;say('user','점심시간에 동료와 친해지기');
      say('assistant','점심시간에 옆자리 동료 Jamie와 식사하면서 이야기하는 장면을 더해 볼게요. 처음 만난 동료와 어떤 이야기를 해 보고 싶어요?');
      say('user','업무 말고 취미 얘기를 하고 싶어요. 제가 먼저 말을 걸어보고 싶고요.');
      episodes.push(secondEpisode('lunch','취미'));showCard();
      if(name==='만들기 실패')showFailure(); else prototypeShell.setState(name);
      return;
    }
    if(name==='한 에피소드 카드'){messages[choiceIndex].resolved=true;say('user','이대로 진행하기');showCard();}
  });
  function showFailure(){failed=true;prototypeShell.setState('만들기 실패');let div=document.createElement('div');div.className='modal-backdrop';div.id='error-modal';div.innerHTML='<div class="modal" role="alertdialog" aria-modal="true" aria-label="스토리를 만들지 못했어요"><h3>스토리를 만들지 못했어요</h3><div class="modal-actions"><button type="button" data-error="close">닫기</button><button type="button" class="retry" data-error="retry">다시 시도</button></div></div>';document.querySelector('.sh-stage').append(div);document.querySelector('.sh-stage').scrollTop=0;div.addEventListener('click',e=>{let b=e.target.closest('[data-error]');if(!b)return;div.remove();failed=false;prototypeShell.setState('스토리 카드');if(b.dataset.error==='retry'){saved=true;detailSource='made';renderBrowse();renderDetail();prototypeShell.showScreen('detail');}});}
  reset();
  renderDetail();
</script>
