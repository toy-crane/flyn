name: Internal deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# All production stages will share this group. Do not cancel an active DB write.
concurrency:
  group: flyn-production-deployment
  cancel-in-progress: false
  queue: max

jobs:
  database:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'toy-crane/flyn' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Install locked dependencies without production credentials
        run: bun install --frozen-lockfile
      - name: Require successful checks on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/release-checks.ts
      - name: Connect the Flyn production database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bunx --no-install supabase link --project-ref owtajtnfleiobyfocdjy --output-format text
      - name: Apply approved migrations and record verified history
        env:
          DEPLOYMENT_STATE_SIGNING_KEY: ${{ secrets.DEPLOYMENT_STATE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bun scripts/ci/release-database.ts
      - name: Record the scope
        run: echo 'Database stage verified. Edge and API follow in the same run.' >> "$GITHUB_STEP_SUMMARY"

  edge:
    needs: database
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'toy-crane/flyn' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Install locked dependencies without production credentials
        run: bun install --frozen-lockfile
      - name: Deploy Edge Functions or inspect the existing request
        env:
          DEPLOYMENT_STATE_SIGNING_KEY: ${{ secrets.DEPLOYMENT_STATE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun scripts/ci/release-edge.ts

  api:
    needs: edge
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'toy-crane/flyn' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Install tools without production credentials
        run: |
          bun install --frozen-lockfile
          npm install --global vercel@51.6.1
      - name: Require successful checks on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/release-checks.ts
      - name: Build and deploy the API or inspect the existing request
        env:
          DEPLOYMENT_STATE_SIGNING_KEY: ${{ secrets.DEPLOYMENT_STATE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bun scripts/ci/release-api.ts
      - name: Record the scope
        run: echo 'Database, Edge and API stages verified. Mobile delivery follows.' >> "$GITHUB_STEP_SUMMARY"

  mobile:
    needs: api
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'toy-crane/flyn' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
      checks: read
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Install tools without production credentials
        run: |
          bun install --frozen-lockfile
          cd /tmp
          npm install --global eas-cli@24.0.0
      - name: Deploy mobile or inspect the existing workflow
        env:
          DEPLOYMENT_STATE_SIGNING_KEY: ${{ secrets.DEPLOYMENT_STATE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bun scripts/ci/release-mobile.ts
