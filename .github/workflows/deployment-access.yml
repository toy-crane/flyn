name: Deployment access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-access
  cancel-in-progress: false

jobs:
  supabase:
    name: Verify production Supabase access (read-only)
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'toy-crane/flyn' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the requested main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Install locked dependencies without production credentials
        run: bun install --frozen-lockfile
      - name: Verify the Flyn project and pending migrations without applying them
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          bunx --no-install supabase link --project-ref owtajtnfleiobyfocdjy --output-format text
          bunx --no-install supabase db push --linked --dry-run --output-format text
      - name: Record the scope of this check
        run: |
          echo 'Supabase credentials and migration history read passed. No migrations, seed, Auth settings, or deployments were applied.' >> "$GITHUB_STEP_SUMMARY"
