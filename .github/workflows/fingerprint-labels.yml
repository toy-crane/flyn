name: Publish fingerprint label

on:
  workflow_run:
    workflows: [PR fingerprint]
    types: [in_progress, completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: fingerprint-label-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  label:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only trusted default-branch code. Never checkout the source PR or restore its caches here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { run } = require('./scripts/ci/fingerprint-labels.cjs');
            await run({ github, context, core });
