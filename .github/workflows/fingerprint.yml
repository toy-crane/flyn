name: PR fingerprint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: fingerprint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: production
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Public repository variables only. Missing values must fail, never bypass app.config.ts.
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"
      - name: Install each revision from its own lockfile
        run: |
          (cd base && NODE_ENV=development bun install --frozen-lockfile)
          (cd head && NODE_ENV=development bun install --frozen-lockfile)
      - name: Calculate iOS fingerprints
        run: |
          node head/scripts/ci/fingerprint.cjs base/apps/mobile > "$RUNNER_TEMP/base-hash"
          node head/scripts/ci/fingerprint.cjs head/apps/mobile > "$RUNNER_TEMP/head-hash"
      - name: Save bounded comparison data
        run: |
          mkdir -p result
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const baseHash = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'base-hash'), 'utf8').trim();
          const headHash = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'head-hash'), 'utf8').trim();
          if (![baseHash, headHash].every(hash => /^[a-f0-9]{40}$/.test(hash))) throw new Error('Invalid fingerprints');
          fs.writeFileSync('result/result.json', JSON.stringify({ base: process.env.BASE_SHA, head: process.env.HEAD_SHA, baseHash, headHash }));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fingerprint-result
          path: result/result.json
          retention-days: 3
          overwrite: true
          if-no-files-found: error
