name: Database validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      database: ${{ steps.plan.outputs.database }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"
      - name: Detect database changes and protect migration history
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            BASE_SHA=$(git rev-list --max-parents=0 "$HEAD_SHA")
          fi
          plan=$(bun scripts/ci/database.ts plan "$BASE_SHA" "$HEAD_SHA")
          echo "database=$(echo "$plan" | jq -r .database)" >> "$GITHUB_OUTPUT"

  database:
    needs: [changes]
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - name: Replay migrations, test permissions, compare types and schema
        run: bun scripts/ci/database.ts verify

  required:
    name: Required database validation
    if: ${{ always() }}
    needs: [changes, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the expected database result
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          DATABASE_NEEDED: ${{ needs.changes.outputs.database }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$DATABASE_NEEDED" = true ]; then
            test "$DATABASE_RESULT" = success
          else
            test "$DATABASE_NEEDED" = false
            test "$DATABASE_RESULT" = skipped
          fi
