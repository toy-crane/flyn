name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.command }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        command: [check, check-types, test]
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_FORCE: "true"
      CHECK_COMMAND: ${{ matrix.command }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run validation
        run: bun run "$CHECK_COMMAND"

  required:
    name: Required validation
    if: ${{ always() }}
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every validation to pass
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
